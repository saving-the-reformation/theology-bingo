const REVISIONS={
 who:{
  0:['I was a priest-king of Salem who blessed Abram and received a tenth from him; later Scripture makes me a type of Christ.','Melchizedek','Genesis introduces Melchizedek as both king and priest. Hebrews uses his unusual biblical profile to explain the superiority and permanence of Christ’s priesthood.','Genesis 14:18–20; Hebrews 7:1–17 (ESV)','https://www.biblegateway.com/passage/?search=Genesis+14%3A18-20%3B+Hebrews+7%3A1-17&version=ESV'],
  1:['I served as secretary to Jeremiah, read his scroll in the temple, and later received a promise of preservation.','Baruch','Baruch’s scribal work preserves and publicly delivers Jeremiah’s prophecy despite royal opposition. God’s personal word to him in Jeremiah 45 promises his life rather than worldly greatness.','Jeremiah 36; 45 (ESV)','https://www.biblegateway.com/passage/?search=Jeremiah+36%3B+45&version=ESV'],
  2:['I was a left-handed Benjamite judge who delivered Israel from Moab after gaining a private audience with King Eglon.','Ehud','Ehud’s story emphasizes God’s unexpected means of deliverance: an overlooked physical detail becomes central to rescuing Israel from Moabite oppression.','Judges 3:12–30 (ESV)','https://www.biblegateway.com/passage/?search=Judges+3%3A12-30&version=ESV'],
  3:['I was a prophetess consulted during Josiah’s reform after the Book of the Law was found.','Huldah','Huldah authoritatively confirms the rediscovered book’s warning and announces both coming judgment and mercy toward Josiah because he humbled himself.','2 Kings 22:8–20 (ESV)','https://www.biblegateway.com/passage/?search=2+Kings+22%3A8-20&version=ESV'],
  4:['I confronted David with curses while he fled from Absalom, then crossed the Jordan to seek pardon when David returned.','Shimei','Second Samuel places Shimei on both sides of David’s exile. David restrains immediate vengeance when cursed and again refuses to turn his restoration into a day of retaliatory bloodshed.','2 Samuel 16:5–14; 19:16–23 (ESV)','https://www.biblegateway.com/passage/?search=2+Samuel+16%3A5-14%3B+19%3A16-23&version=ESV'],
  5:['I was selected to replace Judas, though Acts says relatively little more about my ministry.','Matthias','Matthias restores the symbolic number of the Twelve and meets the stated requirement of having accompanied Jesus’ ministry and witnessed His resurrection.','Acts 1:15–26 (ESV)','https://www.biblegateway.com/passage/?search=Acts+1%3A15-26&version=ESV'],
  6:['I was a Cushite court official who rescued Jeremiah from a cistern and received a promise that my life would be spared.','Ebed-melech','Ebed-melech risks confronting the king and acts compassionately when Judah’s officials abandon Jeremiah. God later promises to preserve him because he trusted in the Lord.','Jeremiah 38:7–13; 39:15–18 (ESV)','https://www.biblegateway.com/passage/?search=Jeremiah+38%3A7-13%3B+39%3A15-18&version=ESV'],
  7:['I wrote down Paul’s letter to the Romans and briefly greeted its recipients in my own name.','Tertius','Tertius identifies himself as the letter’s scribe, giving a small but valuable glimpse of the coworkers and ordinary practices involved in apostolic correspondence.','Romans 16:21–23 (ESV)','https://www.biblegateway.com/passage/?search=Romans+16%3A21-23&version=ESV'],
  8:['I opposed four hundred prophets before Ahab, described a heavenly council, and foretold the king’s death at Ramoth-gilead.','Micaiah son of Imlah','Micaiah stands alone against royal pressure and the court prophets. His vision exposes their false assurance and confirms that God’s judgment cannot be escaped by disguise.','1 Kings 22:1–40 (ESV)','https://www.biblegateway.com/passage/?search=1+Kings+22%3A1-40&version=ESV'],
  9:['Paul called me his brother, fellow worker, fellow soldier, and the Philippians’ messenger; I nearly died in Christ’s service.','Epaphroditus','Paul presents Epaphroditus as an example of costly, humble service and urges the church to honor workers who risk themselves for Christ’s mission.','Philippians 2:25–30 (ESV)','https://www.biblegateway.com/passage/?search=Philippians+2%3A25-30&version=ESV'],
  10:['I repeatedly refreshed Paul, was not ashamed of his chains, and searched earnestly for him in Rome.','Onesiphorus','Onesiphorus models courageous loyalty to an imprisoned apostle when association with Paul carried shame and danger. Paul answers his mercy with a prayer for mercy.','2 Timothy 1:15–18 (ESV)','https://www.biblegateway.com/passage/?search=2+Timothy+1%3A15-18&version=ESV'],
  11:['I was the priest who hid the young Joash, arranged his coronation, and led the overthrow of Athaliah.','Jehoiada','Jehoiada preserves the threatened Davidic line, renews covenant loyalty, and restores ordered worship after Athaliah’s violent seizure of the throne.','2 Kings 11 (ESV)','https://www.biblegateway.com/passage/?search=2+Kings+11&version=ESV'],
  12:['I amazed Samaria with magic, received baptism, and then tried to purchase the power to impart the Holy Spirit.','Simon Magus','Acts contrasts receiving God’s gift with attempting to control or commercialize it. Peter exposes Simon’s corrupt motive and calls him to repentance.','Acts 8:9–24 (ESV)','https://www.biblegateway.com/passage/?search=Acts+8%3A9-24&version=ESV'],
  13:['I taught that the resurrection had already happened and upset the faith of some, so Paul named my teaching a gangrene.','Hymenaeus','Paul treats the denial of a future resurrection as a destructive doctrinal error, yet answers it with confidence that God’s firm foundation still stands.','2 Timothy 2:14–19 (ESV)','https://www.biblegateway.com/passage/?search=2+Timothy+2%3A14-19&version=ESV'],
  14:['I loved to be first, rejected apostolic authority, spread malicious words, and expelled believers who welcomed the brothers.','Diotrephes','Third John exposes how ambition can corrupt church leadership: Diotrephes rejects apostolic correction and uses exclusion to control the congregation.','3 John 9–11 (ESV)','https://www.biblegateway.com/passage/?search=3+John+9-11&version=ESV'],
  15:['I was a Jewish false prophet and magician who opposed Paul and Barnabas before the proconsul on Cyprus.','Elymas, also called Bar-Jesus','Elymas tries to turn the proconsul away from the faith. His temporary blindness displays judgment against spiritual deception, while the proconsul responds with belief and astonishment.','Acts 13:4–12 (ESV)','https://www.biblegateway.com/passage/?search=Acts+13%3A4-12&version=ESV']
 },
 said:{
  0:['“You have made us for yourself, and our heart is restless until it rests in you.”','Augustine','Source: Confessions I.1. The line frames the entire work as a search for rest in God.'],
  1:['Teaching summarized: fallen human choice is not spiritually neutral but bound under sin until liberated by grace.','Martin Luther','Source: On the Bondage of the Will (1525). This is a summary rather than a translation-dependent direct quotation.'],
  2:['“The chief end of man is to glorify God and to enjoy him forever.”','Westminster Shorter Catechism','Source: Westminster Shorter Catechism, Question 1.'],
  3:['“There is not a square inch in the whole domain of our human existence over which Christ, who is sovereign over all, does not cry: Mine!”','Abraham Kuyper','Source: the 1880 inaugural address Sphere Sovereignty; English translations vary slightly.'],
  4:['“Our wisdom, in so far as it ought to be deemed true and solid wisdom, consists almost entirely of two parts: the knowledge of God and of ourselves.”','John Calvin','Source: Institutes of the Christian Religion I.1.1.'],
  5:['Teaching summarized: general revelation truly reveals God, but sinners need Scripture to know Him rightly as Redeemer in Christ.','Herman Bavinck','Source: Reformed Dogmatics, volume 1, the prolegomena and doctrine of revelation. This is a summary, not a direct quotation.'],
  6:['“For He was made man that we might be made God.”','Athanasius','Source: On the Incarnation 54.3. “Made God” describes participation by grace, not equality with the divine essence.'],
  7:['“You have not yet considered how great the weight of sin is.”','Anselm of Canterbury','Source: Cur Deus Homo I.21; wording varies by translation.'],
  8:['“Grace does not destroy nature, but perfects it.”','Thomas Aquinas','Source: Summa Theologiae I.1.8, reply to objection 2.'],
  9:['“I am not my own, but belong—body and soul, in life and in death—to my faithful Savior, Jesus Christ.”','Heidelberg Catechism','Source: Heidelberg Catechism, Question 1.'],
  10:['“Acknowledged in two natures, without confusion, without change, without division, without separation.”','Definition of Chalcedon','Source: Definition of Chalcedon (451). The four adverbs guard both the integrity of the natures and the unity of Christ’s person.'],
  11:['“The Church is the congregation of saints, in which the Gospel is rightly taught and the Sacraments are rightly administered.”','Augsburg Confession','Source: Augsburg Confession, Article VII.'],
  12:['“There was when he was not.”','Arius and the Arian party','Source: an Arian slogan reported in fourth-century anti-Arian sources, including Athanasius, De Decretis. Nicaea answered with “begotten, not made.”'],
  13:['“What has not been assumed has not been healed.”','Gregory of Nazianzus','Source: Letter 101 to Cledonius. Gregory argues against an incomplete humanity in Apollinarian Christology.'],
  14:['“Give what you command, and command what you will.”','Augustine','Source: Confessions X.29.40. Pelagius objected because the prayer makes obedient willing dependent on grace.'],
  15:['Teaching summarized: the Creator who gave Israel the Law is not the previously unknown Father revealed by Jesus.','Marcion','Source: reconstructed from critics such as Irenaeus, Against Heresies I.27, and Tertullian, Against Marcion; Marcion’s own writings do not survive intact.']
 },
 trivia:{
  0:['Which council’s final definition rejected monothelitism by confessing two natural wills and two natural operations in Christ?','Constantinople III',['Constantinople I','Chalcedon','Constantinople II','Constantinople III'],'Constantinople III (680–681) distinguished Christ’s two natural wills without dividing His one person.'],
  1:['Which Old Testament text supplies Hebrews with the oath that the Messiah is “a priest forever after the order of Melchizedek”?','Psalm 110:4',['Genesis 14:18','Psalm 2:7','Psalm 110:4','Zechariah 6:13'],'Hebrews repeatedly joins Genesis 14’s Melchizedek narrative to the divine oath of Psalm 110:4.'],
  2:['How many times was Athanasius exiled during the fourth-century struggle over Nicene theology?','Five',['Three','Four','Five','Seven'],'Athanasius endured five exiles under several emperors; the changing political coalitions make the number easy to underestimate.'],
  3:['How many articles did the Remonstrants present in 1610, prompting the response later organized as the Canons of Dort?','Five',['Four','Five','Six','Seven'],'The Five Articles of Remonstrance were answered by Dort in five heads of doctrine, with the third and fourth treated together.'],
  4:['Which royal secretary read the newly found Book of the Law aloud to King Josiah?','Shaphan',['Hilkiah','Shaphan','Ahikam','Huldah'],'Hilkiah found the book and gave it to Shaphan; Shaphan carried and read it to Josiah before Huldah was consulted.'],
  5:['At which verse does Paul explicitly call Adam “a type of the one who was to come”?','Romans 5:14',['Romans 3:21','Romans 5:12','Romans 5:14','Romans 8:3'],'Romans 5:14 states the typological claim; the surrounding paragraph develops Adam and Christ as representative heads.'],
  6:['Which council condemned the Three Chapters in an effort to reconcile opponents of Chalcedon?','Constantinople II',['Ephesus','Chalcedon','Constantinople II','Nicaea II'],'Constantinople II in 553 condemned writings associated with Theodore of Mopsuestia, Theodoret, and Ibas while reaffirming Chalcedon.'],
  7:['Whose Tome supplied a major Christological resource for the Council of Chalcedon?','Leo I',['Cyril of Jerusalem','Leo I','Gregory of Nyssa','John Chrysostom'],'Leo’s Tome to Flavian helped articulate the integrity of Christ’s divine and human natures in one person.'],
  8:['Who became the leading defender of dyothelitism and suffered mutilation and exile for opposing monothelitism?','Maximus the Confessor',['John of Damascus','Maximus the Confessor','Theodore of Mopsuestia','Eusebius of Caesarea'],'Maximus argued that a complete human nature includes a human will; he was tried, mutilated, and exiled before Constantinople III vindicated the doctrine.'],
  9:['Which document is the earliest surviving source to list exactly the twenty-seven books of the present New Testament together?','Athanasius’s Thirty-Ninth Festal Letter',['The Muratorian Fragment','Athanasius’s Thirty-Ninth Festal Letter','The Didache','Nicaea’s canons'],'Athanasius’s Easter letter of 367 gives the earliest surviving exact twenty-seven-book list, though recognition developed over time.'],
  10:['Which technical term names the attribution of properties of either nature to the one person of Christ?','Communication of properties',['Extra Calvinisticum','Beatific vision','Communication of properties','Divine appropriation'],'The communicatio idiomatum allows Christians to say that the Lord of glory was crucified because the one acting person possesses both natures.'],
  11:['Which confession gives an influential Reformed account of the marks of the true church in Article 29?','Belgic Confession',['Augsburg Confession','Belgic Confession','Westminster Confession','Second Helvetic Confession'],'Belgic Confession Article 29 identifies pure preaching, pure sacramental administration, and church discipline as marks of the true church.'],
  12:['Which council rejected Semi-Pelagian accounts of the beginning of faith by insisting that even the desire to believe is a gift of preceding grace?','Second Council of Orange',['Council of Trent','Second Council of Orange','Council of Constance','Synod of Whitby'],'Orange in 529 rejected both Pelagian self-sufficiency and unaided initiation of faith, without teaching later Reformed double predestination.'],
  13:['Which Christological error taught that Christ’s humanity was absorbed or confused after the union rather than remaining a complete human nature?','Eutychianism',['Apollinarianism','Eutychianism','Adoptionism','Monothelitism'],'Chalcedon answered Eutychian confusion with two natures “without confusion, without change.” Oriental Orthodox miaphysitism must not be reduced to this position.'],
  14:['Which fourth-century party denied the full deity of the Holy Spirit while accepting a high doctrine of the Son?','Pneumatomachians',['Donatists','Pneumatomachians','Novatians','Montanists'],'Constantinople I confessed the Spirit as Lord and giver of life, worshiped and glorified with the Father and Son.'],
  15:['Which theologian became the most influential Latin opponent of Donatism and grounded sacramental validity in Christ rather than the minister’s moral purity?','Augustine',['Jerome','Augustine','Ambrose','Pelagius'],'Augustine separated the objective gift and promise of Christ from the minister’s worthiness without excusing corrupt clergy from discipline.']
 },
 verse:{
  0:['“For our sake he made him to be sin who knew no sin…”','“…so that in him we might become the righteousness of God.” — 2 Corinthians 5:21',['“…so that in him we might become the righteousness of God.” — 2 Corinthians 5:21','“…that we might die to sin and live to righteousness.”','“…so that the righteous requirement of the law might be fulfilled in us.”','“…in order that the blessing of Abraham might come to the Gentiles.”'],'The exact continuation grounds the believer’s righteousness “in him”; the alternatives are genuine biblical phrases from other arguments.'],
  1:['“For in him the whole fullness of deity dwells bodily…”','“…and you have been filled in him, who is the head of all rule and authority.” — Colossians 2:9–10',['“…and you have been filled in him, who is the head of all rule and authority.” — Colossians 2:9–10','“…and through him to reconcile to himself all things.”','“…and he is before all things, and in him all things hold together.”','“…and he is the head of the body, the church.”'],'Colossians moves from Christ’s bodily divine fullness to the believers’ fullness in Him and His supremacy over every power.'],
  2:['“He is the radiance of the glory of God…”','“…and the exact imprint of his nature.” — Hebrews 1:3',['“…and the exact imprint of his nature.” — Hebrews 1:3','“…and the image of the invisible God.”','“…and the firstborn from the dead.”','“…and the heir of all things.”'],'Hebrews joins radiance and exact imprint to confess both personal distinction and full sharing in the divine glory.'],
  3:['“But now the righteousness of God has been manifested apart from the law…”','“…although the Law and the Prophets bear witness to it.” — Romans 3:21',['“…although the Law and the Prophets bear witness to it.” — Romans 3:21','“…through the law comes knowledge of sin.”','“…but now we are released from the law.”','“…for the law brings wrath.”'],'Paul’s “apart from the law” does not mean without Old Testament witness; the Law and Prophets testify to the revealed righteousness.'],
  4:['“God chose what is foolish in the world to shame the wise…”','“…God chose what is weak in the world to shame the strong.” — 1 Corinthians 1:27',['“…God chose what is weak in the world to shame the strong.” — 1 Corinthians 1:27','“…God chose what is low and despised in the world.”','“…so that no human being might boast in the presence of God.”','“…for the foolishness of God is wiser than men.”'],'The exact continuation preserves Paul’s paired contrast: foolish and wise, then weak and strong.'],
  5:['“For we do not have a high priest who is unable to sympathize with our weaknesses…”','“…but one who in every respect has been tempted as we are, yet without sin.” — Hebrews 4:15',['“…but one who in every respect has been tempted as we are, yet without sin.” — Hebrews 4:15','“…but one who has been made perfect forever.”','“…but one who always lives to make intercession for them.”','“…but one who learned obedience through what he suffered.”'],'Hebrews holds together Christ’s full solidarity in temptation and His sinlessness; nearby priestly phrases make the alternatives plausible.'],
  6:['“For from him and through him and to him are all things…”','“…To him be glory forever. Amen.” — Romans 11:36',['“…To him be glory forever. Amen.” — Romans 11:36','“…For who has known the mind of the Lord?”','“…that in everything he might be preeminent.”','“…to him be glory in the church and in Christ Jesus.”'],'Romans 11 closes its doxology by moving from God as source, sustainer and goal of all things to His eternal glory.'],
  7:['“Therefore he had to be made like his brothers in every respect…”','“…so that he might become a merciful and faithful high priest in the service of God.” — Hebrews 2:17',['“…so that he might become a merciful and faithful high priest in the service of God.” — Hebrews 2:17','“…that by the grace of God he might taste death for everyone.”','“…that through death he might destroy the one who has the power of death.”','“…for because he himself has suffered when tempted, he is able to help those who are being tempted.”'],'The continuation states the priestly purpose of the Son’s complete human likeness; the distractors come from the same chapter.'],
  8:['“As a plan for the fullness of time…”','“…to unite all things in him, things in heaven and things on earth.” — Ephesians 1:10',['“…to unite all things in him, things in heaven and things on earth.” — Ephesians 1:10','“…to reconcile to himself all things, whether on earth or in heaven.”','“…to create in himself one new man in place of the two.”','“…to bring to unity the faith and knowledge of the Son of God.”'],'Ephesians 1 describes God’s climactic purpose as summing up the whole creation in Christ.'],
  9:['“When all things are subjected to him, then the Son himself will also be subjected…”','“…that God may be all in all.” — 1 Corinthians 15:28',['“…that God may be all in all.” — 1 Corinthians 15:28','“…that he might be preeminent in everything.”','“…that every tongue should confess that Jesus Christ is Lord.”','“…that the creation itself will be set free from its bondage to corruption.”'],'The verse ends the kingdom sequence with God “all in all”; it concerns the consummated mediatorial reign, not loss of the Son’s deity.'],
  10:['“And the Scripture, foreseeing that God would justify the Gentiles by faith…”','“…preached the gospel beforehand to Abraham.” — Galatians 3:8',['“…preached the gospel beforehand to Abraham.” — Galatians 3:8','“…counted it to him as righteousness.”','“…imprisoned everything under sin.”','“…gave the law through angels by an intermediary.”'],'Paul treats the Abrahamic promise as gospel announced in advance, joining Gentile justification to the promise.'],
  11:['“And he is before all things…”','“…and in him all things hold together.” — Colossians 1:17',['“…and in him all things hold together.” — Colossians 1:17','“…and he is the head of the body, the church.”','“…for by him all things were created.”','“…that in everything he might be preeminent.”'],'The exact continuation moves from Christ’s priority before creation to His continuing preservation of it.'],
  12:['“All things were made through him…”','“…and without him was not any thing made that was made.” — John 1:3',['“…and without him was not any thing made that was made.” — John 1:3','“…in him was life, and the life was the light of men.”','“…and the world was made through him, yet the world did not know him.”','“…and the Word became flesh and dwelt among us.”'],'John places everything that came into being on the created side and the Word on the Creator side of the distinction.'],
  13:['“Touch me, and see…”','“…For a spirit does not have flesh and bones as you see that I have.” — Luke 24:39',['“…For a spirit does not have flesh and bones as you see that I have.” — Luke 24:39','“…See my hands and my feet, that it is I myself.”','“…Why are you troubled, and why do doubts arise in your hearts?”','“…They gave him a piece of broiled fish, and he took it and ate before them.”'],'The revised prompt now asks for the immediate continuation rather than skipping “Touch me, and see”; all alternatives come from the same resurrection scene.'],
  14:['“He saved us, not because of works done by us in righteousness, but according to his own mercy…”','“…by the washing of regeneration and renewal of the Holy Spirit.” — Titus 3:5',['“…by the washing of regeneration and renewal of the Holy Spirit.” — Titus 3:5','“…whom he poured out on us richly through Jesus Christ our Savior.”','“…so that being justified by his grace we might become heirs.”','“…training us to renounce ungodliness and worldly passions.”'],'The harder gap requires the rest of the verse: mercy takes concrete form in regeneration and renewal by the Spirit.'],
  15:['“Why is it that you have contrived this deed in your heart?…”','“…You have not lied to man but to God.” — Acts 5:4',['“…You have not lied to man but to God.” — Acts 5:4','“…We must obey God rather than men.”','“…Your silver perish with you, because you thought you could obtain the gift of God with money.”','“…It is more blessed to give than to receive.”'],'This is now the immediate continuation in Acts 5:4; the other choices are genuine statements from Acts with similar moral force.']

 timeline:{
  0:['Clement’s letter to Corinth|Ignatius writes en route to martyrdom|Martyrdom of Polycarp|Irenaeus writes Against Heresies',['Clement’s letter to Corinth','Ignatius writes en route to martyrdom','Martyrdom of Polycarp','Irenaeus writes Against Heresies'],'Approximate sequence: c. 96, c. 110, c. 155–160, and c. 180.'],
  1:['Marcion’s canon circulates|Muratorian Fragment composed|Eusebius distinguishes recognized and disputed books|Athanasius issues Festal Letter 39',['Marcion’s canon circulates','Muratorian Fragment composed','Eusebius distinguishes recognized and disputed books','Athanasius issues Festal Letter 39'],'Approximate sequence: c. 140, late second century, early fourth century, and 367.'],
  2:['Augsburg Confession|First Helvetic Confession|Scots Confession|Belgic Confession',['Augsburg Confession','First Helvetic Confession','Scots Confession','Belgic Confession'],'The confessions appeared in 1530, 1536, 1560, and 1561.'],
  3:['Marburg Colloquy|Augsburg Confession|Consensus Tigurinus|Formula of Concord',['Marburg Colloquy','Augsburg Confession','Consensus Tigurinus','Formula of Concord'],'These milestones in Protestant sacramental controversy and confessional development date to 1529, 1530, 1549, and 1577.'],
  4:['First Act of Supremacy|Edward VI becomes king|Mary I becomes queen|Elizabethan Religious Settlement',['First Act of Supremacy','Edward VI becomes king','Mary I becomes queen','Elizabethan Religious Settlement'],'The English sequence runs 1534, 1547, 1553, and 1559.'],
  5:['Luther’s Ninety-Five Theses|Leipzig Debate|Diet of Worms|Luther completes his German New Testament',['Luther’s Ninety-Five Theses','Leipzig Debate','Diet of Worms','Luther completes his German New Testament'],'The events date to 1517, 1519, 1521, and 1522.']
 },
 error:{
  0:['Ephesus upheld the title Theotokos for Mary.|Chalcedon described the incarnation as producing one composite nature from two.|Chalcedon met in 451 and confessed one person in two natures.',1,'Chalcedon did not teach one composite nature produced from two; it confessed Christ in two natures without confusion or change.'],
  1:['Athanasius attended Nicaea as a deacon assisting Alexander.|Athanasius personally drafted the surviving text of the Nicene Creed by himself.|Athanasius endured multiple exiles under changing imperial policies.',1,'Athanasius defended Nicaea, but the creed was a conciliar product; no evidence makes him its sole author.'],
  2:['The Remonstrance of 1610 presented five articles.|Dort answered in five heads, combining its third and fourth heads in publication.|Dort taught that Christ’s death lacks sufficient intrinsic value for anyone outside the elect.',2,'Dort explicitly called Christ’s death of infinite value and sufficient to expiate the sins of the whole world while distinguishing its saving design and application.'],
  3:['Augustine argued that even the beginning of faith depends on grace.|Orange rejected the claim that unaided willing initiates salvation.|Orange simply adopted every feature of a later doctrine of double predestination.',2,'Orange affirmed preceding grace but did not simply teach the later Reformed formulation of double predestination.'],
  4:['Acts 15 addressed whether Gentile converts must be circumcised and keep the Mosaic law.|The apostolic decree required Gentile circumcision before table fellowship.|James supported his judgment by citing the prophets.',1,'The council rejected circumcision as a condition for Gentile inclusion; its decree addressed selected practices tied to fellowship and idolatry.'],
  5:['The Didache is not a complete list of New Testament books.|The surviving Muratorian Fragment does not present exactly today’s twenty-seven-book canon.|Athanasius’s Festal Letter was an ecumenical council’s binding canon decree.',2,'Festal Letter 39 was a bishop’s annual letter, not an ecumenical conciliar decree, even though its twenty-seven-book list became highly influential.'],
  6:['Constantinople I met in 381.|Its original assembly included a full delegation from the Latin West.|Its creed expanded the confession of the Holy Spirit’s deity and work.',1,'Constantinople I was originally an Eastern council; its ecumenical authority and creed were received more broadly afterward.'],
  7:['The surviving canons of Nicaea I do not give a New Testament book list.|Athanasius’s Thirty-Ninth Festal Letter dates to 367.|The Muratorian Fragment contains exactly the present twenty-seven books with none omitted or disputed.',2,'The damaged Muratorian list differs from the present canon and reflects an earlier stage of reception.'],
  8:['Luther published the Ninety-Five Theses in 1517.|Luther appeared before the Diet of Worms in 1521.|Luther was the principal author of the Augsburg Confession presented in 1530.',2,'Philip Melanchthon was the principal author of the Augsburg Confession, though it represented the Lutheran cause.'],
  9:['Lateran IV used the language of transubstantiation.|Zwingli and Calvin both rejected a local bodily presence of Christ in the bread.|Calvin reduced the Supper to a mental recollection with no objective divine gift.',2,'Calvin taught real participation in Christ by the Spirit and rejected both local bodily presence and a merely mental memorial.'],
  10:['Maximus argued that Christ’s human will is healed and deified rather than abolished.|Constantinople III confessed two natural wills in Christ.|Dyothelitism requires two competing personal centers of decision in Christ.',2,'Orthodox dyothelitism locates two natural wills in the one acting person; it does not posit two rival subjects.'],
  11:['Guido de Brès was a principal author of the Belgic Confession.|The Heidelberg Catechism appeared in 1563.|The Westminster Confession was completed before the Synod of Dort met.',2,'Dort met in 1618–1619; the Westminster Assembly began in 1643 and produced its confession later.'],
  12:['Arian theology placed the Son within the created order.|Nicaea used homoousios to confess the Son’s full deity.|Nicaea’s “one essence” meant that Father and Son are the same person.',2,'Nicaea confessed unity of divine essence without erasing the personal distinction between Father and Son.'],
  13:['Apollinarianism replaced Christ’s rational human mind with the Logos.|Gregory argued that what is not assumed is not healed.|Apollinarianism was first condemned because it divided Christ into two personal subjects.',2,'Apollinarianism’s characteristic error was incomplete humanity, not the two-subject division associated with Nestorian formulations.'],
  14:['Donatists tied sacramental validity to the minister’s ecclesial and moral standing.|Augustine grounded sacramental efficacy in Christ rather than the minister.|The anti-Donatist Church required every returning Donatist to receive baptism again.',2,'The catholic response generally recognized Donatist baptism and rejected rebaptism while disciplining schism and corrupt ministry.'],
  15:['Marcion sharply separated the Creator from Jesus’ Father.|Marcion used an edited Gospel resembling Luke and a restricted Pauline collection.|Marcion affirmed the future resurrection of the same physical body.',2,'Marcion’s system disparaged material creation and did not confess the catholic doctrine of bodily resurrection.']
 },
 rather:{

  1:['Temporarily pause Communion while a congregation investigates a serious doctrinal division, or continue the Supper while leaders pursue correction and reconciliation?','State what kind of error or division would justify each response; weigh the Supper’s role in unity, discipline, assurance and restoration.'],
  2:['Ordain a candidate with one carefully defined confessional exception and deep theological competence, or a candidate claiming full subscription who cannot explain the confession’s difficult articles?','Weigh honesty, teachability, boundaries of office, the seriousness of the exception and the danger of merely verbal subscription.'],
  3:['Require a person baptized with a nontrinitarian formula to receive Christian baptism, or receive the earlier rite as valid because it used water and named Jesus?','Define matter, form, intention and ecclesial confession; explain why your decision is not either sacramental magic or private judgment.'],
  4:['Use limited church education funds to train one teacher in biblical languages, or train the whole teaching team to read major patristic and confessional sources well?','Compare depth and breadth, dependence on experts, access to primary evidence and the interpretive blind spots each investment could correct.'],

saidGame.desc='Identify the speaker or document from a substantial line, its historical moment, and the controversy or pastoral problem it addresses.';
saidGame.assist='Use the clue written for this quotation. If the room still needs help, reveal its era before revealing the answer.';
saidGame.items=[
 ['“You have made us for yourself, and our heart is restless until it rests in you.”','Augustine','The opening prayer of Confessions frames the human story as disordered desire healed only by return to God.','Ancient Church','North African bishop; autobiographical prayer written around AD 397.','Augustine, Confessions I.1','https://www.ccel.org/ccel/augustine/confessions.i.html'],
 ['“He became man that we might become divine.”','Athanasius','In On the Incarnation, the line describes participation in divine life by grace, not creatures becoming God by nature.','Ancient Church','A leading fourth-century defender of Nicaea wrote this against pagan and Arian objections.','Athanasius, On the Incarnation 54','https://www.ccel.org/ccel/athanasius/incarnation.html'],
 ['“What has not been assumed has not been healed.”','Gregory of Nazianzus','Gregory argues against Apollinarianism that Christ assumed a complete humanity, including a rational human mind.','Ancient Church','A Cappadocian Father defending Christ’s complete humanity.','Gregory of Nazianzus, Letter 101','https://www.ccel.org/ccel/schaff/npnf207.iv.ii.iii.html'],
 ['“The glory of God is a living man; and the life of man consists in beholding God.”','Irenaeus of Lyons','The fuller sentence joins creaturely life to the vision of the Creator within Irenaeus’ defense of creation and redemption.','Ancient Church','Second-century opponent of Gnosticism and author of Against Heresies.','Irenaeus, Against Heresies IV.20.7','https://www.ccel.org/ccel/schaff/anf01.ix.vi.xxi.html'],
 ['“I believe in order that I may understand.”','Anselm of Canterbury','The Proslogion presents reason as inquiry conducted inside confessed faith, not as an independent replacement for revelation.','Medieval Church','A Benedictine archbishop associated with “faith seeking understanding.”','Anselm, Proslogion 1','https://sourcebooks.fordham.edu/basis/anselm-proslogium.asp'],
 ['“Grace does not destroy nature, but perfects it.”','Thomas Aquinas','Aquinas uses the principle to explain why supernatural grace heals and elevates created nature rather than treating creation as evil.','Medieval Church','A thirteenth-century Dominican writing a theological summa.','Thomas Aquinas, Summa Theologiae I.1.8','https://www.newadvent.org/summa/1001.htm#article8'],
 ['“The reason for loving God is God himself; and the measure of love due to him is immeasurable love.”','Bernard of Clairvaux','Bernard begins On Loving God by grounding love’s worth in God rather than in the benefits the believer hopes to receive.','Medieval Church','A Cistercian abbot writing on the ordered growth of Christian love.','Bernard, On Loving God 1','https://www.ccel.org/ccel/bernard/loving_god.html'],
 ['“The human heart is a perpetual factory of idols.”','John Calvin','Calvin’s image explains why idolatry is not merely an external pagan practice but a recurring corruption of worship within us.','Reformation','A Genevan Reformer discussing humanity’s knowledge and worship of God.','Calvin, Institutes I.11.8','https://ccel.org/ccel/calvin/institutes.iii.xii.html'],
 ['“The true treasure of the church is the most holy gospel of the glory and grace of God.”','Martin Luther','Thesis 62 redirects the indulgence controversy from a treasury of merits to the church’s proclamation of divine grace.','Reformation','A 1517 disputation concerning indulgences.','Luther, Ninety-Five Theses 62','https://sourcebooks.fordham.edu/source/luther95.txt'],
 ['“I am not my own, but belong—body and soul, in life and in death—to my faithful Savior, Jesus Christ.”','Heidelberg Catechism','Question 1 makes assurance personal and Trinitarian: Christ pays, preserves, and assures His people by the Spirit.','Reformation','A pastoral catechism published in the Palatinate in 1563.','Heidelberg Catechism, Q1','https://www.crcna.org/welcome/beliefs/confessions/heidelberg-catechism'],
 ['“The chief end of man is to glorify God, and to enjoy him forever.”','Westminster Shorter Catechism','The first answer gives the catechism’s controlling vision: God’s glory and human joy are united rather than rivals.','Post-Reformation','A concise catechism produced by the Westminster Assembly.','Westminster Shorter Catechism, Q1','https://opc.org/sc.html'],
 ['“Faith is the principal work of the Holy Spirit.”','John Calvin','Calvin places saving faith within the Spirit’s work of uniting people to Christ rather than treating faith as unaided self-production.','Reformation','Look in Book III of a repeatedly revised Genevan institute.','Calvin, Institutes III.1.4','https://www.ccel.org/ccel/calvin/institutes.v.ii.html'],
 ['“There is not a square inch in the whole domain of our human existence over which Christ does not cry: Mine!”','Abraham Kuyper','The declaration expresses Kuyper’s conviction that Christ’s lordship reaches church, learning, politics, art, and ordinary vocation.','Modern Church','Dutch neo-Calvinist theologian, journalist, and prime minister.','Princeton Seminary: Abraham Kuyper quotation','https://www.ptsem.edu/news/abraham-kuyper-prize/'],
 ['“Grace restores nature.”','Herman Bavinck','Bavinck repeatedly uses this principle to oppose both the destruction of creation and the idea that redemption merely leaves nature untouched.','Modern Church','Dutch author of the four-volume Reformed Dogmatics.','The Bavinck Institute','https://bavinckinstitute.org/herman-bavinck/'],
 ['“Christianity begins with a triumphant indicative.”','J. Gresham Machen','Machen contrasts news about what God has done in Christ with a merely moral program of human improvement.','Modern Church','A Princeton New Testament scholar opposing theological liberalism.','Machen, Christianity and Liberalism','https://www.ccel.org/ccel/machen/liberalism.html'],
 ['“Cheap grace is the deadly enemy of our Church.”','Dietrich Bonhoeffer','The Cost of Discipleship attacks forgiveness detached from repentance, baptism detached from discipline, and grace detached from following Christ.','Modern Church','A German pastor writing about costly discipleship under the shadow of Nazism.','Bonhoeffer, The Cost of Discipleship','https://archive.org/details/costofdisciplesh0000bonh'],
 ['“The Son of God became man to enable men to become sons of God.”','C. S. Lewis','Lewis compresses the incarnation and adoption: the natural Son shares His life with creatures by grace.','Modern Church','A twentieth-century Oxford apologist explaining basic Christianity for a popular audience.','Lewis, Mere Christianity','https://www.cslewis.com/us/books/hardcover/mere-christianity/9780060652920/'],
 ['“The whole counsel of God concerning all things necessary for his own glory, man’s salvation, faith and life, is either expressly set down in Scripture, or by good and necessary consequence may be deduced from Scripture.”','Westminster Confession of Faith','The confession joins Scripture’s sufficiency to careful inference while denying that new revelations may supplement the apostolic deposit.','Post-Reformation','A 1646 Reformed confession, chapter 1.','Westminster Confession 1.6','https://opc.org/wcf.html#Chapter_01'],
 ['“We know him by two means: first, by the creation, preservation, and government of the universe; second, he makes himself known more clearly by his holy and divine Word.”','Belgic Confession','Article 2 distinguishes general revelation in creation from God’s clearer saving self-disclosure in Scripture.','Reformation','A continental Reformed confession written by Guido de Brès.','Belgic Confession, Article 2','https://www.crcna.org/welcome/beliefs/confessions/belgic-confession'],
 ['“One and the same Christ… acknowledged in two natures, without confusion, without change, without division, without separation.”','Definition of Chalcedon','The four adverbs protect both the distinction of Christ’s natures and the unity of His one person.','Ancient Church','The decisive Christological definition of the council held in AD 451.','Definition of Chalcedon','https://www.ccel.org/creeds/chalcedonian-creed.html']

scavengeGame.assist='One player finds the strongest text for the assigned side; another must locate a passage that appears to push the other way.';
scavengeGame.items=[
 ['The promise of Jeremiah 31 means the new covenant can contain no members who later prove unbelieving.','Use Jeremiah 31:31–34 with Hebrews 8 and 10. Distinguish covenant administration, inward renewal, warning passages, and the final number of the elect.'],
 ['Romans 7:14–25 describes Paul’s normal experience as a regenerate Christian.','Compare Romans 6–8, especially changes of tense, slavery language, delight in God’s law, and life in the Spirit.'],
 ['Baptism is only a public testimony of the believer and not a sign or means by which God addresses the church.','Use Acts 2:38–39, Romans 6:1–4, 1 Corinthians 10:1–5, Colossians 2:11–12, and 1 Peter 3:21 while distinguishing sign from automatic saving effect.'],
 ['When James says a person is justified by works, he contradicts Paul’s doctrine of justification by faith apart from works.','Compare James 2:14–26 with Romans 3:21–4:8. Identify each writer’s opponent and how each uses faith, works, and justify.'],
 ['The command to make disciples in Matthew 28 belongs only to the original apostles.','Trace the command, Christ’s continuing presence, ordinary teaching, Acts, and Ephesians 4. Ask what is unique to apostles and what continues in the church.'],
 ['First Corinthians 11 requires the same physical head covering in every church and culture.','Weigh creation, glory, angels, nature, apostolic practice, and local symbolism. Distinguish the enduring claim from its possible cultural expression.'],
 ['Hebrews 6 teaches that a truly justified believer can finally lose salvation.','Read Hebrews 3, 6, and 10 together with the author’s confidence in better things, covenant participation, perseverance, and the function of warning.'],
 ['The image of God was completely destroyed by the fall.','Compare Genesis 1:26–28; 5:1–3; 9:6; James 3:9; Ephesians 4:24; and Colossians 3:10. Distinguish remaining image from moral renewal.'],
 ['Because Christ fulfilled the law, the Ten Commandments no longer direct Christian obedience.','Use Matthew 5:17–48, Romans 6–8, 13:8–10, 1 Corinthians 9:20–21, and Galatians 5. Distinguish condemnation, covenant form, and moral instruction.'],
 ['The Lord’s Supper is merely a mental remembrance of an absent Christ.','Compare the words of institution, 1 Corinthians 10:16–17 and 11:17–34, and John 6 with care. Define remembrance, participation, faith, and the Spirit’s work.'],
 ['Romans 9 concerns only historical service roles and says nothing about God’s saving mercy.','Trace the chapter from Israel’s privileges and God’s promise through mercy, hardening, vessels, Gentile calling, and Romans 10–11.'],
 ['The New Testament hope is escape from the material world rather than bodily resurrection and renewed creation.','Build the case from Luke 24:36–43, Romans 8:18–25, 1 Corinthians 15, Philippians 3:20–21, and Revelation 21–22.']
];
let ratherGame=G.find(game=>game.id==='rather');
ratherGame.desc='Choose between two costly options inside a concrete church scenario. State the governing principle, likely harm, and condition that would change your answer.';
ratherGame.assist='Before voting, name one biblical text, one person affected, and the most serious unintended consequence of each option.';
ratherGame.items=[
 ['Your 20-person study has six weeks before summer schedules scatter the group. Would you slowly exegete Philippians together, or survey Nicaea through Chalcedon so members can recognize basic Christological errors?','Decide whether the group’s most urgent need is skill in reading one biblical text or a doctrinal map; name what the unchosen plan leaves vulnerable.'],
 ['A new believer asks for one hour of mentoring each week. Would you use it to memorize and interpret Romans 8, or teach a repeatable method of praying through selected Psalms?','Consider immediate spiritual stability, habits that continue without you, temperament, suffering, and how Scripture shapes both understanding and affection.'],
 ['Two informed members keep talking past each other about baptism. Would you schedule a moderated public dialogue now, or first require each to submit a written statement and private steelman of the other view?','Weigh transparency, preparation, relational trust, the maturity of listeners, and whether public disagreement will clarify or merely recruit sides.'],
 ['Your church discovers that a beloved teacher has publicly misstated the Trinity using modalist language. Would you correct the recording immediately with a public note, or speak privately first and publish a joint clarification afterward?','Distinguish a verbal mistake from settled belief while accounting for the audience already exposed to the error.'],
 ['A small church can fund either one elder’s year of introductory Greek or a course that teaches all six teachers to use confessions and reliable commentaries responsibly. Which investment do you choose?','Compare depth, shared capacity, dependence on one expert, and which present teaching failures each option would actually correct.'],
 ['A visitor baptized with water in a nontrinitarian group seeks membership after confessing Nicene faith. Would you require Christian baptism in the triune name, or receive the earlier act as valid because it was sincerely intended as baptism?','Define baptism’s form, ecclesial confession, intention, and relation to the convert’s present faith without reducing the question to sincerity alone.'],
 ['A preacher’s assigned text contains a major textual variant that affects one phrase but no central doctrine. Would you explain the variant during the sermon, or preach the main text and handle the technical question afterward?','Balance honesty, clarity, congregational confidence, time, and whether the variant materially changes the passage’s argument.'],
 ['Your only two realistic churches are doctrinally precise with a pattern of manipulative leadership, or pastorally healthy but mistaken on a significant secondary doctrine. Which do you pursue first?','Name the actual doctrine and leadership failure; identify when either problem becomes disqualifying rather than merely difficult.'],
 ['A popular guest makes a serious doctrinal error during a livestream. Would you interrupt and correct it in the same broadcast, or finish the event and publish a careful response the next day?','Consider the error’s severity, how many people heard it, whether delay implies agreement, and whether immediate correction can be accurate and charitable.'],
 ['You have one study year. Would you gain reading competence in biblical Greek, or trace one disputed doctrine through ten major interpreters from the early church to today?','Say which interpretive blind spot each path corrects, what it cannot supply, and how the choice fits your actual calling.'],
 ['For a debate night, would you defend your own doctrine against its best critic, or be assigned the rival position and judged on whether an expert recognizes your presentation as fair?','Choose whether the group most needs defensive precision or intellectual charity, and define a scoring rule that prevents caricature.'],
 ['A church agrees broadly with the Westminster Confession but has not studied several disputed chapters. Would you adopt it now with clearly recorded exceptions, or delay subscription until a year-long study is complete?','Weigh doctrinal clarity, institutional honesty, teachability, the danger of indefinite ambiguity, and the meaning of subscription.'],
 ['A confused teenager asks why Arius was wrong. Would you begin with one passage such as John 1:1–3, or first tell the larger biblical story that led the church to use homoousios?','Identify which method best gives an immediate anchor and which better answers prepared counter-readings; show how you would eventually use both.'],
 ['Your group can spend one month either reading translated primary sources from one heresy or comparing five heresies through a reliable survey. Which produces better discernment for this group?','Compare historical empathy and precision with pattern recognition, available reading skill, and the risk of confidently misunderstanding primary texts.'],
 ['A member frequently uses a bad Trinity analogy but gladly confesses the Nicene Creed. Would you prohibit the analogy immediately, or keep it temporarily while teaching exactly where it fails?','Consider the difference between illustration and doctrine, the learners who may remember the error, and whether a repaired explanation is possible.'],
 ['A prayer-and-testimony night and a difficult-passage workshop are competing for the only monthly gathering. Which do you schedule this month?','Use the group’s recent conflicts, discouragement, biblical literacy, and pastoral needs; give a concrete plan for preserving the neglected good.']
];
let simpleGame=G.find(game=>game.id==='simple');
simpleGame.desc='Give a 30-second explanation a new Christian could repeat accurately. Then compare it with a plain model answer, one everyday picture, and a biblical anchor.';
simpleGame.assist='Ask the room which technical word can be removed and which distinction must remain. A good answer is short, accurate, and repeatable.';
const SIMPLE_ANSWERS={
 'justification':['Justification is God’s once-for-all verdict that a sinner is righteous because Jesus’ righteousness is counted as theirs and received through faith—not because they have already become morally perfect.','A judge declares the accused accepted because another has fully met the legal demand.','Romans 3:21–26; 5:1'],
 'the Trinity':['The one true God eternally exists as three distinct persons—Father, Son, and Holy Spirit. Each person is fully God, yet they are not three gods and not one person wearing three masks.','One divine “what” and three personal “whos”—without dividing God into pieces.','Matthew 3:16–17; 28:19'],
 'sanctification':['Sanctification is the Spirit’s lifelong work of making believers increasingly holy because they already belong to Christ. It changes how they live but is never the basis of God’s accepting verdict.','A living tree bears growing fruit because it is alive; fruit does not purchase its life.','Romans 6:1–14; Galatians 5:16–25'],
 'the incarnation':['The eternal Son of God took a complete human nature without ceasing to be God. Jesus is one person who is fully divine and fully human.','The Son added true humanity; He did not subtract deity or create a second person.','John 1:1–14; Philippians 2:5–11'],
 'the covenant of grace':['After humanity fell, God promised to save a people through Christ. That one saving promise unfolds through the biblical covenants and is received by faith, not earned by obedience.','Different chapters of one rescue promise reach their goal in Jesus.','Genesis 3:15; Galatians 3:6–14; Hebrews 8'],
 'the communion of saints':['All who belong to Christ also belong to one another. They share worship, gifts, burdens, encouragement, and material care across congregations, generations, and even death.','Union with the same Head makes believers members of the same body.','1 Corinthians 12:12–27; Hebrews 12:22–24'],
 'the eternal generation of the Son':['The Son is eternally from the Father, which distinguishes Him as Son, but He was never created and never began. He possesses the same undivided divine life as the Father.','The relation is eternal identity, not an event inside time.','John 1:1, 18; 5:26'],
 'Christ’s active and passive obedience':['Jesus saved us through His whole obedience: He perfectly fulfilled God’s law throughout His life and willingly bore its curse in suffering and death. Both belong to the righteousness He provides.','He both completed the required obedience and endured the deserved penalty.','Romans 5:18–19; Galatians 4:4–5'],
 'union with Christ':['By the Spirit and through faith, believers are joined to Christ. Because they belong to Him, His death and resurrection become the source of their justification, adoption, holiness, and future glory.','The benefits of salvation come with the Savior, like life flowing from a vine to its branches.','John 15:1–5; Ephesians 1:3–14'],
 'divine simplicity':['God is not assembled from parts. His love, holiness, power, and wisdom are not separate pieces competing inside Him; each truly describes the one living God.','God does not have goodness as an added ingredient—He is good.','Exodus 3:14; 1 John 1:5; 4:8'],
 'the inseparable operations of the Trinity':['Everything God does toward creation is the one work of Father, Son, and Spirit together. Scripture may highlight one person, but the three never act as separate gods.','Creation is from the Father, through the Son, in the Spirit—one divine act.','John 5:19; 1 Corinthians 8:6'],
 'the law–gospel distinction':['God’s law tells us what righteousness requires and exposes our sin. The gospel announces what God has done in Christ to save sinners. The gospel frees believers to obey, but obedience is not the price of the gift.','The law says what must be done; the gospel announces what Christ has done.','Romans 3:19–24; Galatians 3:10–14'],
 'why Arianism is not merely a minor disagreement about Jesus':['Arianism makes the Son the highest creature. But if Jesus is not the eternal Creator, He cannot reveal God perfectly, give divine life, or rightly receive worship. Nicaea therefore confessed Him as begotten, not made.','A created savior cannot bridge the Creator–creature divide.','John 1:1–3; Colossians 1:15–20'],
 'why modalism is not the doctrine of the Trinity':['Modalism says one divine person appears in three roles. Scripture instead shows Father, Son, and Spirit eternally loving, sending, speaking to, and glorifying one another while remaining the one God.','The baptism of Jesus shows three persons present together, not one actor changing costumes.','Matthew 3:16–17; John 17:1–5'],
 'why Pelagianism misunderstands both sin and grace':['Pelagianism treats people as able to begin obeying God without inward renewing grace. Scripture says sinners remain responsible but need the Spirit to give life, faith, and a new heart.','Grace is not merely better instructions for the spiritually sick; it raises the spiritually dead.','John 6:44; Ephesians 2:1–10'],
 'why Gnosticism cannot be combined with the Christian gospel':['Gnosticism treats matter as a prison and salvation as secret knowledge. Christianity confesses a good creation, the Son’s real flesh, a public gospel, and the resurrection of the body.','God rescues creation through incarnation and resurrection; He does not teach souls a secret escape route.','John 1:14; 1 Corinthians 15:12–28']
};
simpleGame.items=Object.entries(SIMPLE_ANSWERS).map(([term,answer])=>[term,...answer]);
G.unshift({id:'live',title:'Live AI Game Host',where:'Live AI · researched on demand',tone:'fresh',desc:'Ask the AI for a brand-new Bible, church-history, doctrine, or confession question whenever the room is ready.',assist:'Ask the room to identify the strongest reason for its answer before revealing the AI’s explanation and verified source.',items:[]});
G.push({id:'jeopardy',title:'Theology Jeopardy',where:'Voice chat · 2 teams',desc:'Draw source-backed clues from five categories. Reveal the response, then award its points to the team that answered correctly.',assist:'Let the opposing team request the Scripture reference, century, or confession family—but the clue loses half its value.',items:[
 ['Paul commends this woman to the Roman church as a servant of the church at Cenchreae and a patron of many.','Who is Phoebe?','Scripture',100,'Romans 16 places Phoebe among the trusted coworkers who served and supported the early churches.','Romans 16:1–2 (ESV)','https://www.biblegateway.com/passage/?search=Romans+16%3A1-2&version=ESV'],
 ['This short New Testament letter explicitly quotes a prophecy attributed to Enoch, the seventh from Adam.','What is Jude?','Scripture',200,'Jude 14–15 uses the Enoch tradition as part of its warning against the letter’s false teachers.','Jude 14–16 (ESV)','https://www.biblegateway.com/passage/?search=Jude+14-16&version=ESV'],
 ['Paul leaves this coworker in Crete to appoint elders in every town and put what remained into order.','Who is Titus?','Scripture',300,'The commission anchors Titus’s pastoral work in qualified leadership and sound teaching.','Titus 1:5–9 (ESV)','https://www.biblegateway.com/passage/?search=Titus+1%3A5-9&version=ESV'],
 ['This council of 325 confessed the Son as being of one essence with the Father against the Arian party.','What is the First Council of Nicaea?','Councils',100,'Nicaea’s homoousios placed the Son on the Creator side of the Creator–creature distinction.','Nicene Creed (325)','https://www.ccel.org/creeds/nicene.creed.html'],
 ['This council of 431 defended the title Theotokos to protect the unity of Christ’s person.','What is the Council of Ephesus?','Councils',200,'The title was primarily Christological: the one born of Mary is the divine Son incarnate, not a separate human person.','Council of Ephesus documents','https://www.ccel.org/ccel/schaff/npnf214.x.html'],
 ['This council of 681 confessed two natural wills and operations in Christ against monothelitism.','What is the Third Council of Constantinople?','Councils',300,'The council argued that Christ’s complete humanity includes a human will operating harmoniously under His divine will.','Constantinople III definition','https://www.ccel.org/ccel/schaff/npnf214.xiv.iii.html'],
 ['The 1529 colloquy where Luther and Zwingli agreed on many articles but divided over Christ’s words “This is my body.”','What is the Marburg Colloquy?','Reformation',200,'Marburg exposed the lasting Protestant division over Christ’s presence in the Lord’s Supper.','Encyclopaedia Britannica: Marburg Colloquy','https://www.britannica.com/event/Colloquy-of-Marburg'],
 ['This Scottish reformer returned from exile in 1559 and became a leading voice of the Reformed Kirk.','Who is John Knox?','Reformers',100,'Knox helped shape the confession, worship, and presbyterian order of the Scottish Reformation.','Encyclopaedia Britannica: John Knox','https://www.britannica.com/biography/John-Knox'],
 ['This Genevan successor to Calvin defended Reformed orthodoxy and published influential editions of the Greek New Testament.','Who is Theodore Beza?','Reformers',300,'Beza led the Genevan Academy after Calvin and influenced Reformed theology, biblical scholarship, and church leadership across Europe.','Encyclopaedia Britannica: Theodore Beza','https://www.britannica.com/biography/Theodore-Beza'],
 ['Question 1 of this catechism begins by asking, “What is your only comfort in life and in death?”','What is the Heidelberg Catechism?','Confessions',100,'The answer frames Christian assurance through belonging to Jesus Christ in body and soul.','Heidelberg Catechism, Q1','https://www.crcna.org/welcome/beliefs/confessions/heidelberg-catechism'],
 ['Chapter 3 of this 1646 confession treats God’s eternal decree while denying that God is the author of sin.','What is the Westminster Confession of Faith?','Confessions',200,'The chapter pairs a strong account of providential decree with explicit creaturely responsibility.','Westminster Confession, chapter 3','https://opc.org/wcf.html#Chapter_03'],
 ['This error says Christ only seemed to possess a real human body and to suffer.','What is Docetism?','Historical Errors',100,'The apostolic stress on the Word becoming flesh and the risen Christ’s tangible body excludes a merely apparent incarnation.','1 John 4:1–3; Luke 24:36–43 (ESV)','https://www.biblegateway.com/passage/?search=1+John+4%3A1-3%3B+Luke+24%3A36-43&version=ESV']
]});
G.push({id:'guess',title:'Guess the Theologian',where:'Voice chat · progressive clues',desc:'Reveal biographical and theological clues one at a time. Guess correctly with fewer clues for greater honor—and explain one lasting contribution.',assist:'Reveal the person’s century or tradition, but require the player to name a work or controversy before accepting the answer.',items:[
 ['Augustine of Hippo',['I was born in Roman North Africa in 354.','My conflict with Pelagius sharpened the Western church’s teaching about sin and grace.','I wrote Confessions and The City of God.'],'Augustine’s writings shaped Western reflection on grace, the church, history, desire, and the Christian life.','Encyclopaedia Britannica: Augustine','https://www.britannica.com/biography/Saint-Augustine'],
 ['Athanasius of Alexandria',['I attended Nicaea as a young deacon.','I endured repeated exiles during the Arian controversy.','I wrote On the Incarnation and defended the Son’s full deity.'],'Athanasius became the most famous fourth-century defender of the Nicene confession against attempts to place the Son within creation.','Encyclopaedia Britannica: Athanasius','https://www.britannica.com/biography/Saint-Athanasius'],
 ['Anselm of Canterbury',['I was an Italian-born monk who became an English archbishop.','My method has been summarized as faith seeking understanding.','I wrote Proslogion and Why God Became Man.'],'Anselm joined disciplined reasoning to confessed faith and offered a deeply influential account of why the God-man makes satisfaction for sin.','Encyclopaedia Britannica: Anselm','https://www.britannica.com/biography/Saint-Anselm-of-Canterbury'],
 ['Thomas Aquinas',['I belonged to the Dominican order.','Aristotle strongly influenced my theological method.','My unfinished masterwork is the Summa Theologiae.'],'Aquinas organized a vast synthesis of Christian theology and philosophy whose distinctions continue to shape Catholic and Protestant debate.','Encyclopaedia Britannica: Thomas Aquinas','https://www.britannica.com/biography/Saint-Thomas-Aquinas'],
 ['Martin Luther',['I lectured on Scripture at Wittenberg.','I defended the bondage of the fallen will against Erasmus.','My Ninety-Five Theses became a symbol of the Reformation.'],'Luther’s preaching and writing placed justification by faith, the authority of Scripture, and the freedom of the gospel at the center of reform.','Encyclopaedia Britannica: Martin Luther','https://www.britannica.com/biography/Martin-Luther'],
 ['John Calvin',['I first trained in law and the humanities.','I ministered chiefly in Geneva after an early expulsion and return.','I repeatedly revised the Institutes of the Christian Religion.'],'Calvin united biblical exposition, doctrinal teaching, worship reform, and pastoral organization in a form influential across Reformed churches.','Encyclopaedia Britannica: John Calvin','https://www.britannica.com/biography/John-Calvin'],
 ['Francis Turretin',['I taught at the Genevan Academy in the generation after Calvin and Beza.','My theology uses the disputed-question method of Reformed scholasticism.','I wrote the Institutes of Elenctic Theology.'],'Turretin offered a precise, polemical synthesis of seventeenth-century Reformed orthodoxy and its debates with rival systems.','Post-Reformation Digital Library: Francis Turretin','https://www.prdl.org/author_view.php?a_id=48'],
 ['John Owen',['I served as vice-chancellor of Oxford under the English Commonwealth.','My works treat the Holy Spirit, mortification, and Christ’s priesthood at length.','I was a leading English Congregationalist theologian.'],'Owen combined close biblical argument, Reformed doctrinal precision, and searching analysis of Christian experience.','Encyclopaedia Britannica: John Owen','https://www.britannica.com/biography/John-Owen'],
 ['Jonathan Edwards',['I ministered in colonial New England and later among the Mohicans.','I analyzed revival in Religious Affections.','I preached Sinners in the Hands of an Angry God.'],'Edwards joined revival theology, philosophical rigor, and a vision of divine beauty in a distinctly Reformed account of Christian experience.','Encyclopaedia Britannica: Jonathan Edwards','https://www.britannica.com/biography/Jonathan-Edwards'],
 ['Herman Bavinck',['I taught at Kampen before joining the Free University of Amsterdam.','I worked in the Dutch neo-Calvinist tradition alongside Abraham Kuyper.','My principal work is the four-volume Reformed Dogmatics.'],'Bavinck presented catholic Christian doctrine through a Reformed lens while engaging modern philosophy, science, and culture.','The Bavinck Institute','https://bavinckinstitute.org/herman-bavinck/'],
 ['J. Gresham Machen',['I taught New Testament at Princeton before helping found Westminster Seminary.','I opposed theological liberalism in the Presbyterian controversy.','I wrote Christianity and Liberalism.'],'Machen argued that historic Christianity and theological liberalism were rival religions, not merely different emphases within one faith.','Encyclopaedia Britannica: J. Gresham Machen','https://www.britannica.com/biography/J-Gresham-Machen'],
 ['Geerhardus Vos',['I was born in the Netherlands and became Princeton’s first professor of biblical theology.','My work emphasized the organic, historical unfolding of revelation.','I wrote Biblical Theology and The Pauline Eschatology.'],'Vos helped establish Reformed biblical theology as the study of revelation unfolding through redemptive history toward Christ.','Westminster Seminary: Geerhardus Vos','https://wm.wts.edu/content/geerhardus-vos']
]});
G.push({id:'passages',title:'Difficult Passages Lab',where:'Voice chat · open Bibles',desc:'Work through genuinely difficult texts by tracing context, grammar, canonical connections, and the strongest competing readings before reaching a conclusion.',assist:'Assign four roles: literary context, cross-references, historical interpretation, and strongest objection. Each must report before the host guide is opened.',items:[
 ['James 2:14–26','How can James say a person is “justified by works” while Paul denies justification by works of the law?','Compare the questions being answered. Paul rejects works as the ground of acceptance before God; James confronts a claim to faith that produces no living obedience. Account for the different uses of “justify,” “faith,” and Abraham without making either writer contradict the other.','James 2:14–26; Romans 3:21–4:8 (ESV)','https://www.biblegateway.com/passage/?search=James+2%3A14-26%3B+Romans+3%3A21-4%3A8&version=ESV'],
 ['Hebrews 6:4–12','Who are those who have been enlightened, tasted the heavenly gift, and then fallen away?','Read the warning as real pastoral speech, not a hypothetical puzzle. Compare covenant participation, perseverance, apostasy, and the author’s stated confidence in “better things” for the hearers. Test Reformed, Arminian, and other readings against the whole letter.','Hebrews 6:4–12 (ESV)','https://www.biblegateway.com/passage/?search=Hebrews+6%3A4-12&version=ESV'],
 ['Romans 9:6–24','What does the potter-and-clay argument say about election, mercy, hardening, and human responsibility?','Trace Paul’s argument from the reliability of God’s promise through Isaac, Jacob, Pharaoh, and the prophetic potter imagery. Do not detach the paragraph from Romans 9–11 or ignore Paul’s anguish, the Gentile question, and Israel’s responsibility.','Romans 9–11 (ESV)','https://www.biblegateway.com/passage/?search=Romans+9-11&version=ESV'],
 ['1 Corinthians 15:29','What could Paul mean by people being “baptized for the dead”?','Separate what Paul uses rhetorically from what he necessarily approves. Compare proposed readings—vicarious practice, baptism motivated by departed believers, or another local custom—and ask which best serves his argument for bodily resurrection.','1 Corinthians 15:12–34 (ESV)','https://www.biblegateway.com/passage/?search=1+Corinthians+15%3A12-34&version=ESV'],
 ['1 Peter 3:18–22','When and to whom did Christ proclaim to “the spirits in prison”?','Map the grammar and the Noah context before choosing among descent-to-the-dead, proclamation through Noah, or victory announcement readings. Relate the passage carefully to baptism without treating water as a mechanical saving power.','1 Peter 3:18–22 (ESV)','https://www.biblegateway.com/passage/?search=1+Peter+3%3A18-22&version=ESV'],
 ['Matthew 24:29–35','What does “this generation will not pass away” refer to?','Distinguish the destruction of Jerusalem, the coming of the Son of Man, prophetic compression, and final consummation. Test preterist, futurist, and mixed readings against both the near time statements and the cosmic language.','Matthew 24 (ESV)','https://www.biblegateway.com/passage/?search=Matthew+24&version=ESV'],
 ['John 6:48–65','What does it mean to eat Christ’s flesh and drink His blood?','Attend to believing, coming, eating, the Father’s drawing, resurrection on the last day, and the later institution of the Supper. Compare sacramental and non-sacramental readings without reducing either to a slogan.','John 6:35–65 (ESV)','https://www.biblegateway.com/passage/?search=John+6%3A35-65&version=ESV'],
 ['1 Timothy 2:8–15','How do the creation argument and “saved through childbearing” fit Paul’s instructions about teaching and worship?','Follow the paragraph’s movement from prayer and adornment to learning, teaching, Adam and Eve, and faithful perseverance. Compare major complementarian and egalitarian readings while refusing interpretations that make motherhood the ground of salvation.','1 Timothy 2:8–15 (ESV)','https://www.biblegateway.com/passage/?search=1+Timothy+2%3A8-15&version=ESV'],
 ['1 Corinthians 11:2–16','What are the head coverings, and why does Paul appeal to creation, glory, angels, nature, and church practice?','Distinguish the enduring theological claims from their first-century expression. Compare garment, hairstyle, and symbolic-authority readings, and explain how women praying and prophesying shapes the passage.','1 Corinthians 11:2–16 (ESV)','https://www.biblegateway.com/passage/?search=1+Corinthians+11%3A2-16&version=ESV'],
 ['Revelation 20:1–10','When is the millennium, and how does it relate to Christ’s present reign and final return?','Compare premillennial, amillennial, and postmillennial readings through the sequence of Revelation, the binding of Satan, the first resurrection, and parallel New Testament texts. State what all orthodox readings affirm before debating chronology.','Revelation 20:1–10 (ESV)','https://www.biblegateway.com/passage/?search=Revelation+20%3A1-10&version=ESV'],
 ['Genesis 6:1–4','Who are the “sons of God,” the daughters of man, and the Nephilim?','Compare angelic, royal-tyrant, and Sethite readings using the phrase “sons of God,” the flow from Genesis 4–6, ancient context, and later biblical references. Keep the main narrative emphasis on escalating human wickedness and judgment.','Genesis 6:1–8 (ESV)','https://www.biblegateway.com/passage/?search=Genesis+6%3A1-8&version=ESV'],
 ['Philippians 2:5–11','In what sense did the eternal Son “empty himself”?','Let the participles explain the verb: the Son empties Himself by taking servant form and becoming human, not by ceasing to possess deity. Then consider how the passage joins preexistence, humiliation, obedience, exaltation, and worship.','Philippians 2:5–11 (ESV)','https://www.biblegateway.com/passage/?search=Philippians+2%3A5-11&version=ESV']
]});
