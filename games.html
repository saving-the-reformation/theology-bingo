r(--wine)}.game.fresh{border-top:4px solid var(--gold);background:linear-gradient(145deg,#fffdf8,#fff8e9)}.tag{color:var(--sage);font:700 .72rem Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}.game h2{font-size:1.42rem}.game p{margin:0;color:var(--muted);line-height:1.45}.game button,button,.options button{cursor:pointer;border:0;background:var(--wine);color:#fff;padding:11px 15px;margin-top:18px;font:700 .94rem Georgia,serif}.game button{margin-top:auto}.game button:hover,button:hover{background:#592435}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.empty-games{grid-column:1/-1;padding:32px;text-align:center;background:var(--paper);border:1px solid var(--line);color:var(--muted)}.room{display:none;max-width:820px;margin:32px auto;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:clamp(22px,5vw,38px)}.room.show{display:block}.playing .library{display:none}.playing .room{margin-top:28px}.room.heresy .prompt{border-left-color:var(--wine)}.room-top{display:flex;justify-content:space-between;gap:14px;align-items:start}.round-count{white-space:nowrap;color:var(--sage);font:700 .8rem Arial,sans-serif}.room .guide{color:var(--muted);line-height:1.5;margin:0 0 20px}.prompt{padding:22px;background:#f4ead6;border-left:4px solid var(--gold);font-size:clamp(1.1rem,2.5vw,1.4rem);line-height:1.38}.prompt small{display:block;margin-bottom:8px;color:var(--wine);font:700 .72rem Arial,sans-serif;letter-spacing:.12em}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.options button{margin:0;background:#fff;color:var(--ink);border:1px solid #cdbb97;text-align:left}.options button.correct{background:#dcebe4;border-color:var(--sage)}.options button.wrong{background:#f8dddd;border-color:#a34a50}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls button.secondary{background:transparent;border:1px solid var(--wine);color:var(--wine)}.answer,.assist{display:none;margin-top:16px;padding:14px;line-height:1.45}.answer{background:#dcebe4;border-left:4px solid var(--sage)}.answer a{color:#284c43}.assist{background:#f4ead6;border-left:4px solid var(--gold)}.answer.show,.assist.show{display:block}.score{margin:16px 0;color:var(--sage);font:700 .92rem Arial,sans-serif}.input-row{display:flex;gap:8px;margin-top:16px}.input-row input{flex:1;padding:11px;border:1px solid #cdbb97;font:1rem Georgia,serif}.input-row button{margin:0}.timeline{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.timeline button{margin:0;background:#fff;color:var(--ink);border:1px solid #cdbb97}.timeline button.picked{background:var(--sage);color:#fff}.note{margin-top:18px;color:var(--muted);font-size:.9rem;line-height:1.5}.shortcuts{font:700 .78rem Arial,sans-serif}.hidden{display:none}@media(max-width:680px){.app{padding:20px 12px}.games{grid-template-columns:1fr}header{flex-direction:column;align-items:flex-start}.library-tools{grid-template-columns:1fr}.library-tools>#surprise{margin:0}.options,.live-form{grid-template-columns:1fr}.live-form .wide{grid-column:1}.input-row{flex-direction:column}.room-top{display:block}.round-count{margin-top:6px}.shortcuts{display:none}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.game{transition:none}}

const G=[
 {id:'who',title:'Bible Who Am I?',where:'Voice chat + chat',desc:'Identify a less familiar biblical figure, name the passage, and explain why the clue matters in the narrative.',assist:'One player may name the biblical book or historical period. A second may give one additional clue without saying the answer.',items:[['I was a priest-king of Salem who blessed Abram and received a tenth from him; later Scripture makes me a type of Christ.','Melchizedek'],['I served as secretary to Jeremiah, read his scroll in the temple, and later received a promise of preservation.','Baruch'],['I was a left-handed Benjamite judge who delivered Israel from Moab after gaining a private audience with King Eglon.','Ehud'],['I was a prophetess consulted during Josiah’s reform after the Book of the Law was found.','Huldah'],['I fled from Absalom, cursed David, and later sought pardon when David returned to Jerusalem.','Shimei'],['I was selected to replace Judas, though Acts says relatively little more about my ministry.','Matthias'],['I was a Cushite court official who rescued Jeremiah from a cistern and received a promise that my life would be spared.','Ebed-melech'],['I wrote down Paul’s letter to the Romans and briefly greeted its recipients in my own name.','Tertius'],['I opposed four hundred prophets before Ahab, described a heavenly council, and foretold the king’s death at Ramoth-gilead.','Micaiah son of Imlah'],['Paul called me his brother, fellow worker, fellow soldier, and the Philippians’ messenger; I nearly died in Christ’s service.','Epaphroditus'],['I repeatedly refreshed Paul, was not ashamed of his chains, and searched earnestly for him in Rome.','Onesiphorus'],['I was the priest who hid the young Joash, arranged his coronation, and led the overthrow of Athaliah.','Jehoiada'],['I amazed Samaria with magic, received baptism, and then tried to purchase the power to impart the Holy Spirit.','Simon Magus','Acts 8:9–24 contrasts receiving God’s gift with attempting to control or commercialize it; Peter calls Simon to repentance.'],['I taught that the resurrection had already happened and upset the faith of some, so Paul named my teaching a gangrene.','Hymenaeus','Second Timothy 2:16–19 refutes an over-realized eschatology by affirming God’s firm foundation and the future hope the false teachers had displaced.'],['I loved to be first, rejected apostolic authority, spread malicious words, and expelled believers who welcomed the brothers.','Diotrephes','Third John 9–11 exposes domineering ambition and tells believers to imitate good rather than evil.'],['I was a Jewish false prophet and magician who opposed Paul and Barnabas before the proconsul on Cyprus.','Elymas, also called Bar-Jesus','Acts 13:6–12 opposes manipulation and resistance to the gospel with apostolic witness confirmed by judgment and the proconsul’s belief.']]},
 {id:'said',title:'Who Said It?',where:'Any chat',desc:'Identify the theologian, creed, confession, or catechism—and explain the controversy the line addresses.',assist:'Ask the room for exactly one of these: century, theological tradition, document type, or controversy.',items:[['“You have made us for yourself, and our heart is restless until it rests in you.”','Augustine'],['“The bound will of man cannot be free, inasmuch as it is in bondage to sin.”','Martin Luther'],['“The chief end of man is to glorify God and to enjoy him forever.”','Westminster Shorter Catechism'],['“There is no square inch in the whole domain of our human existence over which Christ, who is Sovereign over all, does not cry: Mine!”','Abraham Kuyper'],['“The knowledge of God is the beginning of wisdom; and the knowledge of the Holy One is understanding.”','John Calvin'],['“A man does not attain the knowledge of God merely by looking at the world; he must be instructed by the Word.”','Herman Bavinck'],['“For He was made man that we might be made God.”','Athanasius'],['“You have not yet considered how heavy the weight of sin is.”','Anselm of Canterbury'],['“Grace does not destroy nature, but perfects it.”','Thomas Aquinas'],['“I am not my own, but belong—body and soul, in life and in death—to my faithful Savior, Jesus Christ.”','Heidelberg Catechism'],['“Acknowledged in two natures, without confusion, without change, without division, without separation.”','Definition of Chalcedon'],['“The Church is the congregation of saints, in which the Gospel is rightly taught and the Sacraments are rightly administered.”','Augsburg Confession'],['“There was when he was not.”','Arius and the Arian party','The slogan places the Son inside time and creation; Nicaea answered with “begotten, not made” and “of one essence with the Father.”'],['“What has not been assumed has not been healed.”','Gregory of Nazianzus','Gregory’s anti-Apollinarian rule argues that the Son assumed a complete human nature, including a rational mind, to heal the whole human person.'],['“Give what you command, and command what you will.”','Augustine','Pelagius objected to this prayer because it makes obedient willing dependent on grace; Augustine used it to confess both divine command and enabling grace.'],['Teaching summarized: the Creator who gave Israel the Law is not the previously unknown Father revealed by Jesus.','Marcion','The Church answered Marcion by confessing one Creator and Redeemer and by reading Christ as the fulfillment of Israel’s Scriptures rather than their enemy.']]},
 {id:'trivia',title:'Bible & Church History Trivia',where:'Voice chat or chat',desc:'Advanced multiple-choice rounds requiring close reading, doctrinal vocabulary, and historical context—not lucky name recognition.',assist:'Before choosing, ask another player to eliminate one option and justify the elimination. The explanation matters even if the final answer is wrong.',items:[['Which ecumenical council formally condemned monothelitism and confessed two wills in Christ?','Constantinople III',['Ephesus','Constantinople II','Constantinople III','Chalcedon']],['Which New Testament letter most directly develops Christ’s priesthood according to the order of Melchizedek?','Hebrews',['Romans','Hebrews','James','1 Peter']],['Which early theologian is especially associated with defending the Nicene confession during the Arian controversy?','Athanasius',['Origen','Athanasius','Jerome','Ambrose']],['The Synod of Dort addressed the controversy arising from the followers of which theologian?','Jacobus Arminius',['Thomas Aquinas','Jacobus Arminius','John Wesley','Menno Simons']],['Which king’s reforms followed the rediscovery of the Book of the Law in the temple?','Josiah',['Hezekiah','Josiah','Asa','Jehoash']],['In which book does Paul describe Adam as a type of the one who was to come?','Romans',['Galatians','Romans','Colossians','Hebrews']],['Which council condemned the Three Chapters in an effort to reconcile opponents of Chalcedon?','Constantinople II',['Ephesus','Chalcedon','Constantinople II','Nicaea II']],['Whose Tome supplied a major Christological resource for the Council of Chalcedon?','Leo I',['Cyril of Jerusalem','Leo I','Gregory of Nyssa','John Chrysostom']],['Who became the leading defender of dyothelitism and suffered mutilation and exile for opposing monothelitism?','Maximus the Confessor',['John of Damascus','Maximus the Confessor','Theodore of Mopsuestia','Eusebius of Caesarea']],['Which document is the earliest surviving source to list exactly the twenty-seven books of the present New Testament together?','Athanasius’s Thirty-Ninth Festal Letter',['The Muratorian Fragment','Athanasius’s Thirty-Ninth Festal Letter','The Didache','Nicaea’s canons']],['Which technical term names the attribution of properties of either nature to the one person of Christ?','Communication of properties',['Extra Calvinisticum','Beatific vision','Communication of properties','Divine appropriation']],['Which confession gives an influential Reformed account of the marks of the true church in Article 29?','Belgic Confession',['Augsburg Confession','Belgic Confession','Westminster Confession','Second Helvetic Confession']],['Which council rejected Semi-Pelagian accounts of the beginning of faith by insisting that even the desire to believe is a gift of preceding grace?','Second Council of Orange',['Council of Trent','Second Council of Orange','Council of Constance','Synod of Whitby'],'Orange in 529 rejected both Pelagian self-sufficiency and the claim that unaided human willing initiates salvation, while not teaching later Reformed double predestination.'],['Which Christological error taught that Christ’s humanity was absorbed or confused after the union rather than remaining a complete human nature?','Eutychianism',['Apollinarianism','Eutychianism','Adoptionism','Monothelitism'],'Chalcedon answered Eutychian confusion with two natures “without confusion, without change.” Oriental Orthodox miaphysitism should not be reduced to this position.'],['Which fourth-century party denied the full deity of the Holy Spirit while accepting a high doctrine of the Son?','Pneumatomachians',['Donatists','Pneumatomachians','Novatians','Montanists'],'Constantinople I confessed the Spirit as Lord and giver of life, worshiped and glorified with the Father and the Son.'],['Which theologian became the most influential Latin opponent of Donatism and argued that sacramental validity rests on Christ rather than the minister’s moral purity?','Augustine',['Jerome','Augustine','Ambrose','Pelagius'],'Augustine distinguished the objective gift and promise of Christ from the worthiness of the minister, without excusing corrupt clergy from discipline.']]},
 {id:'scavenge',title:'Scripture Scavenger Hunt',where:'Voice chat + chat',desc:'Find a strong passage, read enough context to establish the claim, and explain why it is better than a merely related proof text.',assist:'Each person may contribute either one passage or one contextual observation. Combine the pieces into a single argued answer.',items:[['God’s covenant faithfulness','Strong answers include Deuteronomy 7:9, Psalm 105:8–10, Lamentations 3:22–23, and 2 Timothy 2:13.'],['Christ’s present intercession','Strong answers include Romans 8:34, Hebrews 7:25, Hebrews 9:24, and 1 John 2:1.'],['the limits of human wisdom before God','Strong answers include Job 38–42, Isaiah 55:8–9, Romans 11:33–36, and 1 Corinthians 1:20–25.'],['the unity of the church across its diversity','Strong answers include John 17:20–23, Romans 12:4–5, 1 Corinthians 12:12–27, and Ephesians 4:1–6.'],['endurance in suffering','Strong answers include Romans 5:3–5, 2 Corinthians 4:16–18, James 1:2–4, and 1 Peter 1:6–7.'],['the sufficiency of Scripture for faithful ministry','Strong answers include Deuteronomy 8:3, 2 Timothy 3:14–17, and 2 Peter 1:3.'],['union with Christ as the center of salvation','Strong answers include John 15:1–7, Romans 6:1–11, 1 Corinthians 1:30, Galatians 2:20, and Ephesians 2:4–7.'],['the kingdom as already present but not yet consummated','Strong answers include Matthew 12:28, Luke 17:20–21, 1 Corinthians 15:24–28, Hebrews 2:8–9, and Revelation 11:15.'],['Adam and Christ as representative heads of humanity','Strong answers include Romans 5:12–21 and 1 Corinthians 15:21–22, 45–49; explain the parallel as well as the contrast.'],['God’s self-sufficiency and independence from creation','Strong answers include Exodus 3:14, Psalm 50:9–12, Acts 17:24–25, Romans 11:35–36, and John 5:26.'],['church discipline ordered toward restoration rather than humiliation','Strong answers include Matthew 18:15–20, 1 Corinthians 5:1–5, 2 Corinthians 2:5–8, and Galatians 6:1.'],['the exodus as a pattern fulfilled in Christian salvation','Strong answers include Luke 9:30–31, 1 Corinthians 5:7, 1 Corinthians 10:1–4, and 1 Peter 1:18–19.'],['the claim that the Son is a creature rather than the eternal Creator','Strong answers include John 1:1–3, Colossians 1:15–17, Hebrews 1:2–12, and Revelation 5:11–14. Explain why “firstborn” denotes supremacy and inheritance rather than first-created status.'],['the claim that Father, Son, and Spirit are merely temporary roles of one person','Strong answers include Jesus’ baptism in Matthew 3:16–17, John 17:1–5, John 14:16–17, and Matthew 28:19. Show simultaneous personal relations, not merely three divine names.'],['the denial of a future bodily resurrection','Strong answers include Luke 24:36–43, John 5:28–29, Romans 8:11, 1 Corinthians 15:12–23, 35–49, and Philippians 3:20–21.'],['the claim that unaided human willing can begin salvation','Strong answers include John 6:44, Romans 8:7–8, 1 Corinthians 2:14, Ephesians 2:1–10, Philippians 1:29, and John 1:12–13. Distinguish responsibility from moral ability.']]},
 {id:'steelman',title:'Steelman Challenge',where:'General voice chat',desc:'Defend the precise claim before evaluating it. Give its biblical or historical case, answer its strongest obvious objection, and aim for an account an informed advocate would recognize as fair.',assist:'Divide the work: one player states the positive biblical or historical case, another answers the strongest objection, and a third checks whether an advocate would recognize the result.',items:[
  ['Christ truly gives believers His body and blood in the Lord’s Supper.','Distinguish a real sacramental gift from both a merely mental remembrance and a crude, local or physical eating; explain how the words of institution and 1 Corinthians 10 support the claim.','Sacraments'],
  ['Baptism is ordinarily a means through which God grants saving grace.','Explain “means of grace” without treating the rite as magic or making God unable to save apart from it; address Acts 2:38, Romans 6:3–4, Titus 3:5 and 1 Peter 3:21.','Sacraments'],
  ['Infants of believers should receive baptism as members of the covenant community.','Present covenant continuity, the inclusion of believers’ children, household baptisms and baptism’s relation to circumcision; answer the objection that the New Testament records no explicit infant baptism.','Sacraments'],
  ['Only professing believers are proper candidates for baptism.','Present the new-covenant, repentance-and-faith and disciple-making arguments; explain why household baptisms and the circumcision analogy do not establish infant baptism.','Sacraments'],
  ['The Eucharist is a sacrifice without repeating Christ’s sacrifice on the cross.','Explain the distinction between Christ’s once-for-all bloody sacrifice and its sacramental memorial or re-presentation; address Hebrews 7–10 and the charge that any Eucharistic sacrifice competes with Calvary.','Sacraments'],
  ['Christ is truly received in the Lord’s Supper through the Holy Spirit, although His human body remains in heaven.','Explain how believers genuinely partake of Christ by the Spirit without a local descent of His body or a change in the elements; connect the view to Christ’s ascension and 1 Corinthians 10.','Sacraments'],
  ['Apostolic succession is necessary for preserving the Church’s visible continuity.','Present succession as continuity in ordained ministry, public teaching and sacramental oversight rather than a merely mechanical chain; answer the objection that fidelity to apostolic doctrine alone is sufficient.','Catholic & Orthodox claims'],
  ['The bishop of Rome possesses a unique primacy grounded in Peter’s role.','Build the case from Peter’s prominence, Matthew 16, Luke 22, John 21 and early Roman witness; distinguish primacy from the claim that every later papal action is correct.','Catholic & Orthodox claims'],
  ['Invoking the saints is compatible with Christ’s unique mediation.','Distinguish asking glorified believers to intercede from offering them the worship due to God; explain why Christ’s unique mediatorship need not exclude subordinate intercession.','Catholic & Orthodox claims'],
  ['The veneration of icons follows from the reality of the Incarnation.','Explain the distinction between veneration and worship and argue that the visible incarnation changes how the prohibition of images applies; answer the charge that the practice remains idolatrous.','Catholic & Orthodox claims'],
  ['Sacred tradition can transmit apostolic teaching not stated explicitly in Scripture.','Distinguish apostolic tradition from later custom, use the New Testament’s language of received traditions, and explain how such teaching could be identified without making every tradition infallible.','Catholic & Orthodox claims'],
  ['Ecumenical councils can speak infallibly under particular conditions.','Explain a conciliar model of Spirit-guided judgment rooted in Acts 15 and the Church’s reception of the creeds; address failed councils, disputed reception and the difference between indefectibility and impeccability.','Catholic & Orthodox claims'],
  ['The essence–energies distinction preserves both God’s transcendence and real participation in God.','Explain how creatures can truly participate in God’s uncreated energies without comprehending or sharing the divine essence; answer the objection that the distinction composes God.','Catholic & Orthodox claims'],
  ['Sola Scriptura does not reduce Christianity to private interpretation.','Distinguish Scripture as the only infallible rule from the legitimate authority of creeds, councils, teachers and tradition; explain how ministerial authority remains real but corrigible.','Protestant & Reformed claims'],
  ['Unconditional election is compatible with God’s sincere offer of salvation to all.','Distinguish God’s revealed invitation from His eternal decree, explain why inability does not cancel responsibility, and address texts that express God’s desire for repentance.','Protestant & Reformed claims'],
  ['Definite atonement strengthens rather than limits the sufficiency of Christ’s death.','Distinguish the infinite sufficiency of Christ’s sacrifice from its saving design and application; explain how the cross actually secures faith and redemption rather than merely making salvation possible.','Protestant & Reformed claims'],
  ['God’s exhaustive sovereignty is compatible with genuine human responsibility.','Present a compatibilist account in which people act voluntarily according to their desires while God ordains events without becoming morally blameworthy; address Joseph’s betrayal and Acts 2:23.','Protestant & Reformed claims'],
  ['Penal substitution is biblical and does not divide the Trinity.','Present the cross as the triune God’s united saving action in which the incarnate Son willingly bears the covenant penalty for His people; answer charges of injustice, divine child abuse and conflict within God.','Protestant & Reformed claims'],
  ['Perseverance of the saints does not make warnings against apostasy meaningless.','Explain the warnings as real means God uses to preserve believers, distinguish temporary participation from final salvation, and account for Hebrews 6 and 10 without emptying their urgency.','Protestant & Reformed claims'],
  ['The regulative principle of worship protects Christian liberty rather than restricting it.','Explain why requiring divine warrant for corporate worship prevents leaders from binding consciences with invented religious practices; answer the objection that the New Testament gives no exhaustive liturgy.','Protestant & Reformed claims'],
  ['Calling Mary Theotokos protects the identity of Christ rather than exalting Mary.','Explain that the title identifies the one born of Mary as truly God incarnate without making Mary the source of the divine nature; connect it to the rejection of Nestorian division.','Christology & the Trinity'],
  ['The Son’s eternal generation does not make Him created or inferior.','Distinguish an eternal relation of origin from a temporal act of creation, and explain how “begotten, not made” preserves both personal distinction and full equality of essence.','Christology & the Trinity'],
  ['Christ possesses two wills without being two persons.','Explain why each complete nature includes its proper will and operation, how the human will freely follows the divine will, and why Gethsemane does not divide Christ’s person.','Christology & the Trinity'],
  ['The filioque can be defended without denying the Father’s monarchy.','Explain procession from the Father through, or with, the Son as one spiration while retaining the Father as the unoriginate source; address both the theological and conciliar objections.','Christology & the Trinity'],
  ['Divine simplicity does not make God impersonal or eliminate real distinctions.','Explain why God is not assembled from more basic parts and why His attributes are identical with His undivided being; preserve real Trinitarian relations and meaningful creaturely knowledge.','Christology & the Trinity'],
  ['The doctrine of the Trinity is genuinely biblical despite its later technical language.','Derive one divine being and three distinct persons from the biblical data, then explain why terms such as essence and person clarify rather than add to Scripture.','Christology & the Trinity'],
  ['The Chalcedonian definition unites rather than merely compromises Alexandrian and Antiochene Christology.','Show how “one person in two natures” safeguards both the unity of Christ’s acting subject and the integrity of His divinity and humanity; answer the charge that it produces two Sons.','Christology & the Trinity'],
  ['Conditional security takes the New Testament’s apostasy warnings with full seriousness.','Present a coherent account of genuine covenant participation that can be abandoned, using Hebrews 6 and 10 and John 15; answer the objection that this makes salvation depend on autonomous human effort.','Disputed doctrines'],
  ['Divine impassibility does not mean that God is indifferent or incapable of love.','Distinguish perfect, active divine love from involuntary emotional change caused by creatures; explain how Scripture’s language of grief and compassion can be true without making God unstable.','Disputed doctrines'],
  ['The covenant of works is a biblical doctrine even though Scripture never uses that exact phrase.','Build the case from Adam’s representative role, the life promised for obedience, the death sanction and the Adam–Christ parallel; answer the objection that covenant language is being imposed on Genesis.','Disputed doctrines'],
  ['Papal infallibility protects the Church without making the pope personally infallible.','Define the narrow conditions under which the doctrine applies, distinguish infallibility from inspiration and impeccability, and explain why a visible teaching office might be necessary; address disputed papal statements and historical error.','Catholic & Orthodox claims'],
  ['Purgatory completes sanctification rather than offering a second chance at salvation.','Present purgatory as the final purification of people already saved by grace, not postmortem conversion or a second atonement; address Hebrews 9:27 and the sufficiency of Christ’s work.','Catholic & Orthodox claims'],
  ['Confession to a priest is a biblical exercise of Christ’s authority to forgive sins.','Build the case from John 20:21–23, Matthew 16 and James 5:16; distinguish Christ as the source of forgiveness from ordained ministry as its declarative or sacramental instrument.','Catholic & Orthodox claims'],
  ['Infused righteousness does not amount to earning salvation by works.','Explain justification as wholly initiated and sustained by grace that truly transforms the believer; distinguish Spirit-enabled cooperation from independent merit and answer the charge that assurance becomes impossible.','Catholic & Orthodox claims'],
  ['The Marian dogmas are legitimate developments of Christological doctrine.','Show how claims about Mary are argued from Christ’s identity, grace and the Church’s reflection rather than from treating her as divine; explain the criteria that distinguish legitimate development from doctrinal novelty.','Catholic & Orthodox claims'],
  ['The deuterocanonical books belong to the Old Testament canon.','Present the case from Septuagint usage, early Christian reception and conciliar lists; address Jewish canonical boundaries, patristic disagreements and the Reformers’ distinction between canonical and ecclesiastical books.','Catholic & Orthodox claims'],
  ['The Orthodox rejection of the filioque protects the Father’s monarchy within the Trinity.','Distinguish the Spirit’s eternal procession from His temporal mission, explain the Father as the single personal source, and address Western claims that the Son’s role is biblically and patristically warranted.','Catholic & Orthodox claims'],
  ['Justification by faith alone does not make obedience optional.','Distinguish faith as the sole instrument of justification from the living faith that necessarily bears fruit; explain how works can be necessary as evidence and path without becoming the ground of acceptance.','Protestant & Reformed claims'],
  ['Imputed righteousness is a real saving union with Christ, not a legal fiction.','Explain how the believer’s forensic standing rests on genuine union with the righteous Christ and His representative obedience; answer the objection that imputation leaves people unchanged.','Protestant & Reformed claims'],
  ['Reprobation is compatible with God’s goodness and human responsibility.','Distinguish God’s just passing over and condemnation of sinners from His gracious election, preserve human willing responsibility, and address Romans 9 and the charge of arbitrary cruelty.','Protestant & Reformed claims'],
  ['Effectual grace liberates the will rather than forcing people to believe.','Explain regeneration as changing the heart so that a person comes freely and gladly to Christ, not as external coercion; answer the objection that an irresistible choice cannot be genuine.','Protestant & Reformed claims'],
  ['God can ordain sinful actions without becoming the author of sin.','Distinguish God’s holy intention and sovereign concurrence from the creature’s evil intention and proximate agency; use Genesis 50:20 and Acts 2:23 while facing the problem rather than merely renaming it.','Protestant & Reformed claims'],
  ['The Protestant canon can be known without an infallible institutional Church.','Explain how fallible believers can possess warranted and sufficiently certain knowledge through apostolic origin, catholic reception and the Spirit’s witness; answer the circularity and fragmentation objections.','Protestant & Reformed claims'],
  ['Confessions and creeds can possess real authority without competing with Scripture.','Present confessions as public, subordinate standards that bind officeholders because they faithfully summarize Scripture; explain how they remain corrigible without becoming optional.','Protestant & Reformed claims'],
  ['Christ’s body and blood are truly present in the Supper without transubstantiation.','Present sacramental union and Christ’s words of institution without requiring the substance of bread and wine to cease; address both memorialist and Roman Catholic objections.','Lutheran, Arminian & Anabaptist'],
  ['Baptismal regeneration does not mean that water works automatically apart from God’s promise.','Explain how God joins His Word and promise to baptism while rejecting a mechanical power in the element itself; address faith, apostasy and apparently unregenerate baptized people.','Lutheran, Arminian & Anabaptist'],
  ['Conditional election can preserve salvation by grace rather than human merit.','Present election in Christ and conditioned on Spirit-enabled faith rather than foreseen moral worth; explain why receiving grace need not count as earning it.','Lutheran, Arminian & Anabaptist'],
  ['Prevenient grace prevents Arminianism from collapsing into Semi-Pelagianism.','Explain grace as preceding, enabling and universally restoring the capacity to respond while salvation remains impossible without divine initiative; answer why differing responses do not make the decisive cause autonomous.','Lutheran, Arminian & Anabaptist'],
  ['Libertarian freedom is necessary for genuine love and moral responsibility.','Define the relevant ability to do otherwise under the same conditions and explain why determined choices may seem insufficient for responsibility; answer objections from divine foreknowledge, character and moral formation.','Lutheran, Arminian & Anabaptist'],
  ['Christian pacifism is the clearest application of Jesus’ teaching about enemies.','Build the case from the Sermon on the Mount, the cross and the Church’s nonretaliatory witness; address protection of the innocent, Romans 13 and whether public office changes a disciple’s duties.','Lutheran, Arminian & Anabaptist'],
  ['The Sermon on the Mount forbids Christians from exercising coercive political power.','Explain a two-kingdom or Anabaptist reading in which the Church witnesses through suffering service rather than the sword; answer Romans 13 and examples of faithful officials in Scripture.','Lutheran, Arminian & Anabaptist'],
  ['Refusing oaths, military service and political office can be faithful Christian discipleship.','Present the integrated case from Matthew 5, enemy-love and separation of Church from coercive power; answer the objection that withdrawal abandons neighbors and civic responsibility.','Lutheran, Arminian & Anabaptist'],
  ['Jesus’ submission to the Father does not imply inferiority of essence.','Distinguish personal relation and the incarnate Son’s economic mission from inequality of divine nature; explain how the Father sends and the Son obeys while both remain fully God.','Christology & the Trinity'],
  ['Nicene doctrine legitimately clarifies Scripture rather than imposing Greek philosophy upon it.','Show how homoousios blocks exegetically inadequate readings of the Son while Scripture supplies the doctrine’s substance; address the use and transformation of nonbiblical philosophical vocabulary.','Christology & the Trinity'],
  ['Christ could not sin, yet His temptations were entirely real.','Explain how temptation requires a genuine human trial and obedient resistance but not the metaphysical possibility of the divine Son’s failure; address whether inability to sin diminishes solidarity with us.','Christology & the Trinity'],
  ['Christ remained fully divine while genuinely suffering and dying as man.','Use the communication of properties to explain why the divine person truly suffered according to His human nature without change or death in the divine nature; avoid dividing Christ into two acting subjects.','Christology & the Trinity'],
  ['Eternal conscious punishment is compatible with God’s justice and goodness.','Present the seriousness and continuing character of rebellion, the biblical language of unending punishment and God’s right judgment; answer proportionality, divine love and the apparent final victory of evil.','Last things'],
  ['Conditional immortality explains final punishment better than eternal conscious torment.','Argue that immortality is God’s gift to the redeemed and that destruction, death and perishing name the wicked’s final end; address texts describing eternal fire, smoke and conscious torment.','Last things'],
  ['Christian universalism can take divine judgment and human freedom seriously.','Present judgment as real, severe and finally restorative through Christ’s victory rather than as denial of sin; explain how final reconciliation could respect agency and address texts of irreversible exclusion.','Last things'],
  ['Paedocommunion follows more consistently from covenant theology than withholding Communion from baptized children.','Argue that baptized children are members of the visible covenant community and should share its family meal; answer 1 Corinthians 11’s self-examination language and distinctions between baptism and the Supper.','Sacraments'],
  ['Speaking in tongues and prophecy remain ordinary gifts for the Church today.','Build the case from Acts, 1 Corinthians 12–14 and the absence of an explicit cessation text; distinguish fallible congregational prophecy from canonical revelation and address abuse and failed claims.','Spiritual gifts'],
  ['Cessationism honors the sufficiency of Scripture without denying the Spirit’s present activity.','Explain revelatory sign gifts as tied to the apostolic foundation while affirming providence, illumination, prayer and extraordinary answers; address continuationist readings of 1 Corinthians 13 and Acts 2.','Spiritual gifts'],
  ['Women may hold ordained pastoral office without rejecting biblical authority.','Present an egalitarian reading of creation, Pentecost, women coworkers and the disputed restriction texts; explain how 1 Timothy 2 and 1 Corinthians 14 may address local errors without dismissing them.','Church, state & ethics'],
  ['Complementarianism affirms equal dignity without making men and women interchangeable.','Explain equal image-bearing and salvation alongside differentiated responsibilities in church or home; ground the distinction without implying lesser ability, value or access to God.','Church, state & ethics'],
  ['The civil magistrate should enforce both tables of the Ten Commandments.','Present a magisterial Protestant case from the public claims of God’s moral law, covenantal social responsibility and historic Christian practice; answer coercion, religious error and the New Testament distinction between Church and state.','Church, state & ethics'],
  ['Christian nationalism can be defined without confusing the Church with the state.','Present a bounded account of a nation publicly shaped by Christian moral inheritance while rejecting ethnic supremacy, coerced conversion and ecclesial control of government; address pluralism and equal citizenship.','Church, state & ethics'],
  ['Religious liberty is a Christian principle rather than an Enlightenment compromise.','Build the case from the limits of civil authority, the spiritual nature of faith and the distinction between Church and state; answer whether public religious neutrality is possible or desirable.','Church, state & ethics'],
  ['The death penalty can remain compatible with Christian mercy.','Argue from the magistrate’s limited duty to administer proportionate public justice and distinguish personal forgiveness from civil punishment; address wrongful convictions, unequal application and opportunities for repentance.','Church, state & ethics'],
  ['Just-war theory is more faithful to Christian love than absolute pacifism.','Explain just authority, cause, intention, proportionality and discrimination as restraints ordered to protecting neighbors; answer Jesus’ enemy-love commands and the realities of civilian harm.','Church, state & ethics'],
  ['Young-earth creationism can be intellectually serious rather than anti-scientific.','Present its hermeneutical case, distinction between observational evidence and historical reconstruction, and models for apparent age and geological data; face mainstream scientific objections directly.','Creation'],
 ['Evolutionary creation can be reconciled with biblical authority and historic Christianity.','Explain a noncompetitive account of divine creation through providential natural processes while preserving creation, fall, image-bearing and Christ’s new-Adam work; address Genesis, death before the fall and historical Adam questions.','Creation']
 ]},
 {id:'heresy',title:'Steelman Challenge: Heresy Mode',where:'General voice chat',tone:'heresy',desc:'State the strongest internally coherent case for the displayed claim, then identify where it departs from biblical and creedal Christianity. Players see the claim only; reveal the historical name after discussion.',assist:'One player builds the best case for the claim. A second names the biblical or creedal distinction at stake without naming the heresy. A third decides whether the account avoided caricature.',items:[
  ['The Father alone is the uncreated God; the Son is His first and greatest creature.','Arianism. Nicaea rejected the idea that the Son belongs to creation: the Son is eternally begotten, not made, and consubstantial with the Father.','Arianism'],
  ['Father, Son, and Spirit are three manifestations of one divine person.','Modalism or Sabellianism. The doctrine collapses the real, eternal personal distinctions revealed in the Father’s sending of the Son and the Son’s relation to the Father and Spirit.','Modalism / Sabellianism'],
  ['The Father Himself became incarnate and suffered on the cross.','Patripassianism. This modalist conclusion confuses the persons: the one divine Son, not the Father, assumed human nature and suffered according to that nature.','Patripassianism'],
  ['Jesus began as an ordinary man whom God adopted and exalted as His Son.','Adoptionism. Historic Christianity confesses that the acting subject in Jesus is the eternal Son, who became human rather than an ordinary human person who later acquired divine sonship.','Adoptionism'],
  ['Jesus is the uniquely exalted human Messiah but not an eternal divine person.','Socinianism. The position denies the Son’s eternal personal preexistence and full deity confessed from texts such as John 1:1–18, John 20:28, and Philippians 2:5–11.','Socinianism'],
  ['The Holy Spirit is God’s highest ministering creature rather than consubstantial with Him.','Pneumatomachianism. Constantinople I confessed the Spirit as Lord and giver of life, worshiped and glorified with the Father and Son, not a creature within the divine economy.','Pneumatomachianism'],
  ['Father, Son, and Spirit are three divine beings united perfectly in will and purpose.','Tritheism. Nicene Christianity confesses three distinct persons who possess one indivisible divine essence, power, will, and operation—not three cooperating gods.','Tritheism'],
  ['The divine Logos replaced Christ’s rational human mind, guaranteeing His sinlessness.','Apollinarianism. The Church rejected an incomplete humanity: the Son assumed a complete human nature, including a rational soul and mind, so that the whole human person is healed.','Apollinarianism'],
  ['Christ’s divine and human realities remain distinct personal subjects joined in profound unity.','A classical Nestorian formulation. Ephesus and Chalcedon safeguard one acting person or hypostasis in two complete natures. This label should not be casually imposed on the modern Church of the East, whose own Christological language requires careful treatment.','Classical Nestorian formulation'],
  ['After the Incarnation, Christ possesses one nature formed from the divine and human.','Eutychianism. Chalcedon rejects confusion or alteration of Christ’s two natures. This is not a description of Oriental Orthodox miaphysitism, which explicitly denies Eutychian mixture and corruption.','Eutychianism'],
  ['Christ has only one divine-human will because He is one person.','Monothelitism. Constantinople III confessed two natural wills and operations corresponding to Christ’s complete divine and human natures, acting harmoniously in one person.','Monothelitism'],
  ['Christ only appeared to possess a physical body and undergo suffering.','Docetism. The apostolic witness insists that the Son truly came in the flesh, suffered, died, was buried, and rose bodily; apparent humanity cannot accomplish human redemption.','Docetism'],
  ['The Son surrendered or suspended essential divine attributes when He became human.','Ontological Kenoticism. Philippians 2 describes the Son’s self-emptying through taking servant form and humbling Himself, not ceasing to possess the attributes of the immutable divine nature.','Ontological Kenoticism'],
  ['The Son is eternally subordinate in authority because the Father is the supreme divine person.','Subordinationism. Classical Trinitarianism distinguishes personal relations and the incarnate mission from an eternal hierarchy inside the divine essence; the three persons possess one divine will and equal glory.','Subordinationism'],
  ['Human beings are born morally capable of choosing righteousness without inward renewing grace.','Pelagianism. The anti-Pelagian tradition confesses the inherited corruption and bondage of sin and the necessity of prevenient, converting grace for any saving movement toward God.','Pelagianism'],
  ['The first movement toward faith can originate in the unaided human will, after which grace assists.','Semi-Pelagianism. The Second Council of Orange taught that even the beginning of faith and the desire to believe arise through preceding grace, not autonomous human initiative.','Semi-Pelagianism'],
  ['Saving faith is merely accepting the truth of the gospel, even without repentance or spiritual renewal.','Sandemanianism. Its characteristic “bare assent” account fails to preserve saving faith as personal reception of and trust in Christ, a living faith inseparable from repentance and Spirit-wrought fruit.','Sandemanianism'],
  ['Because salvation is entirely sovereign, the gospel need not be offered indiscriminately to everyone.','Hyper-Calvinism. Reformed orthodoxy pairs unconditional election with the Church’s duty to proclaim Christ freely to every hearer and to summon all people to repentance and faith.','Hyper-Calvinism'],
  ['Because Christians are justified, God’s moral law no longer governs their conduct.','Antinomianism. Justification is apart from works, but the moral law still exposes sin and guides the grateful, Spirit-enabled obedience of those united to Christ.','Antinomianism'],
  ['Every rational creature—including Satan—will eventually be reconciled to God.','Universal Apokatastasis. This maximal restoration claim conflicts with the Church’s confession of final judgment and scriptural descriptions of irreversible exclusion; it is more specific than every form of hopeful universalism.','Universal Apokatastasis'],
  ['Christ’s atonement normally guarantees physical health and material prosperity to believers.','Prosperity Gospel. The gospel promises resurrection and the final renewal of creation, but the New Testament treats suffering, weakness, persecution, and unmet temporal needs as normal within the present age.','Prosperity Gospel'],
  ['The God of the Old Testament is an inferior deity distinct from Jesus’ loving Father.','Marcionism. The Church confesses one Creator and Redeemer: Jesus identifies His Father with Israel’s God and fulfills, rather than rejects, the Law, Prophets, and covenant history.','Marcionism'],
  ['The material world was made by an inferior being, and salvation comes through secret spiritual knowledge.','Gnosticism. Apostolic Christianity confesses the good creation of the one God, the true incarnation and bodily resurrection, and a publicly proclaimed gospel rather than saving esoteric knowledge.','Gnosticism'],
  ['Jesus was a naturally born human Messiah, and obedience to the Mosaic Law remains necessary.','Ebionism. Ancient groups gathered under this label varied, but the position characteristically denied Christ’s full divine identity and imposed Torah observance in a way rejected by the apostolic Gentile mission.','Ebionism'],
  ['Sacraments administered by seriously sinful ministers cannot be valid.','Donatism. The anti-Donatist judgment grounds sacramental validity in Christ and His promise rather than the hidden moral condition of the minister, while still requiring discipline of corrupt clergy.','Donatism'],
  ['Christians who apostatize after baptism cannot be restored to full communion with the Church.','Novatianism. The rigorist refusal to readmit the repentant “lapsed” was rejected because the Church possesses a ministry of reconciliation even for grave post-baptismal sin.','Novatianism'],
  ['New prophetic revelations may impose universal disciplines beyond established apostolic practice.','Montanism. The historical movement was complex, but the Church rejected the claim that post-apostolic prophecy could bind the whole Church with new revelation and universal disciplines. This is not a synonym for modern continuationism.','Montanism'],
  ['Spirit and matter come from opposing eternal principles of good and evil.','Manichaeism. Christian doctrine confesses one sovereign Creator of all that exists; evil is neither an eternal substance nor an independent principle equal to God.','Manichaeism'],
  ['The resurrection is purely spiritual; the physical body will never rise.','Denial of bodily resurrection. First Corinthians 15 makes the transformed raising of the body essential to Christian hope and ties believers’ resurrection to Christ’s own bodily resurrection.','Denial of bodily resurrection'],
  ['God is one person who manifests Himself as Father, Son, and Spirit, and saving baptism must be in Jesus’ name alone.','Oneness Pentecostalism. Its modalist doctrine denies the eternal personal distinctions of Father, Son, and Spirit; Acts’ baptismal language does not erase the triune name commanded in Matthew 28:19.','Oneness Pentecostalism'],
  ['Jesus is the preexistent archangel Michael, God’s first creation and agent of creation.','Jehovah’s Witness Christology. This is an Arianizing account that places the Son inside creation, contrary to Nicene confession and New Testament texts that place all created things on the far side of His creative agency.','Jehovah’s Witness Christology'],
  ['God the Father was once mortal, and faithful humans may become gods of the same order.','Latter-day Saint exaltation. The position rejects the historic Christian distinction between the uncreated, uniquely divine God and creatures who may share in divine life by grace without becoming gods of the same order.','Latter-day Saint exaltation'],
  ['The Holy Spirit is God’s impersonal power rather than a distinct divine person.','Modern Unitarianism. Scripture depicts the Spirit speaking, willing, interceding, teaching, and being personally distinguished from Father and Son while sharing in divine identity and action.','Modern Unitarianism'],
  ['Future free choices are not settled facts and therefore are not exhaustively foreknown by God.','Open Theism. This is a modern heterodox revision of classical omniscience rather than an ancient conciliar heresy; it holds that some future contingents are possibilities rather than facts known as definite.','Open Theism'],
  ['God and creation mutually develop, so God changes and grows through His relationship with the world.','Process Theology. This modern heterodox system rejects classical divine aseity, immutability, and creation from nothing by making God and the world mutually dependent participants in an ongoing process.','Process Theology']
 ]},
 {id:'simple',title:'Explain It Simply',where:'General voice chat',desc:'Explain an advanced doctrine to a thoughtful new Christian in one minute without losing the distinction that makes it necessary.',assist:'Ask one person for a biblical text and another for a plain-language analogy. The speaker must use the text and may keep or reject the analogy.',items:[['justification','Distinguish God’s verdict from inward moral renewal; include Christ’s righteousness and faith.'],['the Trinity','Confess one God and three distinct persons without turning the persons into three gods or three roles.'],['sanctification','Distinguish growth in holiness from the basis of acceptance with God.'],['the incarnation','Explain why the one person Jesus Christ is truly God and truly human.'],['the covenant of grace','Explain God’s saving promise in Christ and its unfolding through Scripture.'],['the communion of saints','Explain the church’s shared life in Christ across gifts, suffering, worship, and service.'],['the eternal generation of the Son','Explain an eternal relation of origin that distinguishes Father and Son without making the Son created, later, or less divine.'],['Christ’s active and passive obedience','Explain Christ’s whole life of law-keeping and His suffering of the law’s penalty without suggesting that He was passive in the ordinary sense.'],['union with Christ','Explain how belonging to Christ is the living bond through which believers receive justification, adoption, sanctification, and glorification.'],['divine simplicity','Explain that God is not assembled from parts or attributes more basic than He is, while preserving the Trinity and meaningful speech about God.'],['the inseparable operations of the Trinity','Explain why every outward work of God is the work of the one triune God even when Scripture especially appropriates a work to one person.'],['the law–gospel distinction','Explain how God’s command and God’s saving promise differ without treating the Old Testament as law only or making obedience irrelevant.'],['why Arianism is not merely a minor disagreement about Jesus','Explain that placing the Son inside creation changes the identity of the Savior and the worship Christians offer; contrast “made” with the Nicene confession “eternally begotten.”'],['why modalism is not the doctrine of the Trinity','Explain that one God truly exists as three eternal persons who relate to one another, not one person changing masks or roles across history.'],['why Pelagianism misunderstands both sin and grace','Explain that fallen people remain responsible yet need grace not merely for information or assistance but for the new heart and faith by which they come to God.'],['why Gnosticism cannot be combined with the Christian gospel','Explain why the goodness of creation, the Word’s real flesh, the public apostolic message, and bodily resurrection rule out salvation by escaping matter through secret knowledge.']]},
 {id:'timeline',title:'Church History Timeline',where:'Any chat',desc:'Arrange tightly spaced events, councils, confessions, and movements from earliest to latest; justify at least one placement.',assist:'Each player may place one item and give a date, ruler, controversy, or neighboring event that supports the placement.',items:[['Augustine|Nicaea I|Martin Luther',['Nicaea I','Augustine','Martin Luther']],['Council of Chalcedon|John Calvin|Athanasius',['Athanasius','Council of Chalcedon','John Calvin']],['Edict of Milan|Council of Trent|Great Schism',['Edict of Milan','Great Schism','Council of Trent']],['Jonathan Edwards|Augustine|John Wesley',['Augustine','Jonathan Edwards','John Wesley']],['Synod of Dort|Augsburg Confession|Westminster Assembly',['Augsburg Confession','Synod of Dort','Westminster Assembly']],['First Council of Constantinople|Council of Ephesus|Second Council of Nicaea',['First Council of Constantinople','Council of Ephesus','Second Council of Nicaea']],['Destruction of Jerusalem|Pliny’s letter to Trajan|Martyrdom of Polycarp|Irenaeus writes Against Heresies',['Destruction of Jerusalem','Pliny’s letter to Trajan','Martyrdom of Polycarp','Irenaeus writes Against Heresies']],['Nicaea I|Constantinople I|Council of Ephesus|Council of Chalcedon',['Nicaea I','Constantinople I','Council of Ephesus','Council of Chalcedon']],['Ninety-Five Theses|Diet of Worms|Augsburg Confession|Council of Trent opens',['Ninety-Five Theses','Diet of Worms','Augsburg Confession','Council of Trent opens']],['Geneva Academy founded|Belgic Confession|Heidelberg Catechism|Synod of Dort',['Geneva Academy founded','Belgic Confession','Heidelberg Catechism','Synod of Dort']],['Westminster Assembly convenes|Savoy Declaration|Second London Baptist Confession|First Great Awakening',['Westminster Assembly convenes','Savoy Declaration','Second London Baptist Confession','First Great Awakening']],['Oxford Movement begins|Vatican I|Azusa Street Revival|Vatican II',['Oxford Movement begins','Vatican I','Azusa Street Revival','Vatican II']],['Arius is condemned at Alexandria|Nicaea I|Death of Arius|Constantinople I',['Arius is condemned at Alexandria','Nicaea I','Death of Arius','Constantinople I'],'The sequence traces the Arian controversy from its early Alexandrian judgment through the two councils that frame the Nicene settlement.'],['Montanist movement emerges|Novatian schism|Donatist controversy begins|Pelagian controversy begins',['Montanist movement emerges','Novatian schism','Donatist controversy begins','Pelagian controversy begins'],'These movements arise roughly in the late second century, mid-third century, early fourth century, and early fifth century.'],['Augustine begins anti-Pelagian writings|Council of Carthage condemns Pelagian errors|Council of Ephesus rejects Pelagianism|Second Council of Orange',['Augustine begins anti-Pelagian writings','Council of Carthage condemns Pelagian errors','Council of Ephesus rejects Pelagianism','Second Council of Orange'],'The Western grace controversy develops from Augustine’s early responses through Carthage in 418, Ephesus in 431, and Orange in 529.'],['Nicaea I rejects Arianism|Constantinople I rejects Apollinarianism|Ephesus rejects Nestorian division|Chalcedon rejects Eutychian confusion',['Nicaea I rejects Arianism','Constantinople I rejects Apollinarianism','Ephesus rejects Nestorian division','Chalcedon rejects Eutychian confusion'],'The sequence shows how the fourth- and fifth-century councils progressively clarified the identity, full humanity, personal unity, and two natures of Christ.']]},
 {id:'error',title:'Two Truths and an Error',where:'Any chat',desc:'Find the subtle error, defend why the other statements are accurate, and replace the error with a precise correction.',assist:'Assign one statement to each of three players. Each player must defend or challenge that statement before the group votes.',items:[['The Council of Ephesus met before the Council of Chalcedon.|The Council of Chalcedon confessed Christ as one person in two natures.|The Council of Chalcedon was convened before the Council of Nicaea I.',2,'Nicaea I met in 325; Chalcedon met in 451, after both Nicaea and Ephesus.'],['Athanasius was present at Nicaea I as a deacon accompanying Alexander of Alexandria.|Athanasius defended the full deity of the Son against Arianism.|Athanasius died before the Council of Nicaea I met.',2,'Athanasius attended Nicaea as a young deacon and died in 373, nearly five decades after the council.'],['The Synod of Dort addressed the Remonstrant controversy.|The Canons of Dort were produced in the seventeenth century.|The Synod of Dort was an ecumenical council of the undivided church.',2,'Dort was an international Reformed synod, not an ecumenical council of the undivided Church.'],['Augustine wrote Confessions and The City of God.|Augustine’s anti-Pelagian writings defended the necessity of grace.|Augustine lived after Thomas Aquinas.',2,'Augustine lived in the fourth and fifth centuries; Aquinas lived in the thirteenth.'],['The Jerusalem Council in Acts 15 considered the status of Gentile believers.|James gave the council’s concluding judgment in Acts 15.|The Jerusalem Council occurred after Paul wrote Romans.',2,'The Jerusalem Council preceded Romans; Romans is generally dated to Paul’s later ministry.'],['The Didache is an early Christian manual of teaching and practice.|The Muratorian Fragment is an early witness to discussion of the New Testament canon.|The Apostles’ Creed was composed by the twelve apostles in its final form.',2,'The creed developed over time from early baptismal formulas; the apostles did not compose its final form together.'],['Constantinople I met in 381.|The council affirmed the full deity of the Holy Spirit against the Pneumatomachians.|Constantinople I issued the Definition of Chalcedon.',2,'The Definition of Chalcedon was issued by the Council of Chalcedon in 451.'],['Athanasius’s Thirty-Ninth Festal Letter lists the present twenty-seven New Testament books.|The Septuagint is an ancient Greek translation of Jewish Scriptures.|Nicaea I issued the first binding list of the New Testament canon.',2,'The surviving canons of Nicaea I do not establish a New Testament book list.'],['Luther published the Ninety-Five Theses in 1517.|Melanchthon was the principal author of the Augsburg Confession.|Calvin made his famous refusal to recant at the Diet of Worms.',2,'Martin Luther, not Calvin, appeared at the Diet of Worms in 1521.'],['Lateran IV used the language of transubstantiation.|Calvin taught real spiritual participation in Christ in the Supper.|Zwingli taught that Christ’s body is locally present in the bread.',2,'Zwingli rejected a local bodily presence and emphasized the Supper as commemorative proclamation.'],['Maximus the Confessor opposed monothelitism.|Constantinople III confessed two natural wills in Christ.|Monothelitism taught that Christ has two personal wills competing within Him.',2,'Monothelitism taught one will in Christ; orthodox dyothelitism confesses two natural wills belonging to one person.'],['Guido de Brès was a principal author of the Belgic Confession.|The Heidelberg Catechism was commissioned under Elector Frederick III.|The Westminster Confession was drafted by the Synod of Dort.',2,'The Westminster Confession was produced by the Westminster Assembly, not the Synod of Dort.'],['Arianism places the Son within the created order.|Nicaea confessed the Son as begotten, not made.|Arianism and Nicene orthodoxy agree that the Son is consubstantial with the Father.',2,'Arianism denies that the Son is consubstantial with the Father; homoousios was central to Nicaea’s rejection of the created-Son claim.'],['Apollinarianism denied Christ a complete rational human soul.|Gregory of Nazianzus answered that what is not assumed is not healed.|Apollinarianism was condemned because it divided Christ into two personal subjects.',2,'The two-subject charge targets Nestorian division; Apollinarianism instead made Christ’s humanity incomplete by replacing the rational human mind with the Logos.'],['Donatism tied sacramental validity to the minister’s moral purity.|Augustine argued that Christ, not the minister, is the sacrament’s true giver.|The anti-Donatist position taught that corrupt ministers should never face church discipline.',2,'Grounding sacramental validity in Christ does not excuse corrupt ministers; their acts may be valid while they remain subject to removal and discipline.'],['Marcion rejected the Old Testament and sharply separated its Creator from Jesus’ Father.|The early Church answered Marcion by defending continuity between creation and redemption.|Marcion preserved the four canonical Gospels exactly as the catholic churches received them.',2,'Marcion used an edited form of Luke and a reduced Pauline collection rather than preserving the catholic four-Gospel canon.']]},
 {id:'verse',title:'Finish the Verse',where:'Voice chat + chat',desc:'Complete a less familiar theological clause, identify the reference, and explain how its context controls its use.',assist:'Ask one player for the biblical book and another for the paragraph’s main theme. Neither may supply the missing words.',items:[['“For our sake he made him to be sin who knew no sin…”','“…so that in him we might become the righteousness of God.” — 2 Corinthians 5:21',['“…so that in him we might become the righteousness of God.” — 2 Corinthians 5:21','“…so that he might learn obedience through suffering.”','“…that the law might be fulfilled by our works.”']],['“For in him the whole fullness of deity dwells bodily…”','“…and you have been filled in him, who is the head of all rule and authority.” — Colossians 2:9–10',['“…and you have been filled in him, who is the head of all rule and authority.” — Colossians 2:9–10','“…though he emptied himself of all divine attributes.”','“…therefore the body is of no consequence.”']],['“He is the radiance of the glory of God…”','“…and the exact imprint of his nature.” — Hebrews 1:3',['“…and the exact imprint of his nature.” — Hebrews 1:3','“…and the first creature made by his power.”','“…but not the proper object of worship.”']],['“But now the righteousness of God has been manifested apart from the law…”','“…although the Law and the Prophets bear witness to it.” — Romans 3:21',['“…although the Law and the Prophets bear witness to it.” — Romans 3:21','“…and therefore the law has no use for believers.”','“…through the traditions received from the apostles alone.”']],['“God chose what is foolish in the world to shame the wise…”','“…God chose what is weak in the world to shame the strong.” — 1 Corinthians 1:27',['“…God chose what is weak in the world to shame the strong.” — 1 Corinthians 1:27','“…so that human wisdom might become the measure of faith.”','“…because strength is irrelevant to Christian obedience.”']],['“For we do not have a high priest who is unable to sympathize with our weaknesses…”','“…but one who in every respect has been tempted as we are, yet without sin.” — Hebrews 4:15',['“…but one who in every respect has been tempted as we are, yet without sin.” — Hebrews 4:15','“…and therefore has no need to intercede for us.”','“…because his divinity prevented genuine human experience.”']],['“For from him and through him and to him are all things…”','“…To him be glory forever. Amen.” — Romans 11:36',['“…To him be glory forever. Amen.” — Romans 11:36','“…yet creation remains outside his rule.”','“…because the law alone reveals his righteousness.”']],['“Therefore he had to be made like his brothers in every respect…”','“…so that he might become a merciful and faithful high priest in the service of God.” — Hebrews 2:17',['“…so that he might become a merciful and faithful high priest in the service of God.” — Hebrews 2:17','“…except for possessing a genuinely human will.”','“…in order to surrender his divine nature.”']],['“As a plan for the fullness of time…”','“…to unite all things in him, things in heaven and things on earth.” — Ephesians 1:10',['“…to unite all things in him, things in heaven and things on earth.” — Ephesians 1:10','“…to replace Israel without fulfilling the promises.”','“…to abolish every created distinction immediately.”']],['“When all things are subjected to him, then the Son himself will also be subjected…”','“…that God may be all in all.” — 1 Corinthians 15:28',['“…that God may be all in all.” — 1 Corinthians 15:28','“…because the Son will cease to share the divine nature.”','“…so that death may continue as the final enemy.”']],['“And the Scripture, foreseeing that God would justify the Gentiles by faith…”','“…preached the gospel beforehand to Abraham.” — Galatians 3:8',['“…preached the gospel beforehand to Abraham.” — Galatians 3:8','“…set aside every promise given to Abraham.”','“…made circumcision the final ground of justification.”']],['“And he is before all things…”','“…and in him all things hold together.” — Colossians 1:17',['“…and in him all things hold together.” — Colossians 1:17','“…although he belongs within the created order.”','“…but only the invisible world depends upon him.”']],['“All things were made through him…”','“…and without him was not any thing made that was made.” — John 1:3',['“…and without him was not any thing made that was made.” — John 1:3','“…except the Son, who made himself before all ages.”','“…although he belongs to the highest rank of created beings.”'],'John places the Word on the Creator side of the Creator–creature distinction: everything that came to be came through Him.'],['“See my hands and my feet, that it is I myself…”','“…For a spirit does not have flesh and bones as you see that I have.” — Luke 24:39',['“…For a spirit does not have flesh and bones as you see that I have.” — Luke 24:39','“…because resurrection leaves the physical body permanently in the grave.”','“…for my appearance is spiritual and not continuous with the crucified body.”'],'Jesus refutes a merely spiritual resurrection by identifying the risen one with the crucified body while also displaying transformed life.'],['“He saved us, not because of works done by us in righteousness…”','“…but according to his own mercy.” — Titus 3:5',['“…but according to his own mercy.” — Titus 3:5','“…after the unaided will produced the first movement of faith.”','“…because baptism makes inward renewal unnecessary.”'],'The verse grounds salvation in divine mercy and immediately speaks of regeneration and renewal by the Holy Spirit.'],['“Why has Satan filled your heart to lie to the Holy Spirit…”','“…You have not lied to man but to God.” — Acts 5:3–4',['“…You have not lied to man but to God.” — Acts 5:3–4','“…because the Spirit is merely an impersonal force.”','“…although deceit cannot be directed toward the Spirit personally.”'],'Peter’s parallel language treats lying to the Holy Spirit as lying to God and depicts the Spirit as a personal divine agent.']]},
 {id:'rather',title:'Christian Would You Rather?',where:'General voice chat',desc:'Choose under a real theological or pastoral tradeoff, then make the strongest case for the option you rejected.',assist:'Ask another player to advocate for the unchosen option. You may change your answer only after summarizing that case fairly.',items:[['Spend six weeks studying a single biblical book in depth or six weeks surveying the development of the early creeds?','Ask which practice would best serve the group’s present needs, and why.'],['Devote an hour to memorizing a substantial passage or an hour to praying slowly through a psalm?','Ask how each discipline forms both mind and affection.'],['Discuss one difficult doctrine in depth or compare two traditions’ approaches to five doctrines briefly?','Ask which format better promotes understanding among the present group.'],['Read an ancient ecumenical creed together or a Reformation-era confession together?','Ask what each text contributes to Christian formation.'],['Hold a formal debate night or a testimony-and-prayer night?','Ask what purpose and setting would make the chosen format most fruitful.'],['Read a major theological work communally or undertake a structured Bible-reading plan?','Ask how the group could retain the strengths of both practices.'],['Preach from a passage with a major textual variant and explain it publicly, or select a neighboring text and teach the variant in a separate class?','Ask how transparency, congregational confidence, and the duty to preach the whole counsel of God affect the choice.'],['Join a church that matches nearly every doctrine but has unhealthy pastoral culture, or a healthy church that differs on a significant secondary doctrine?','Name which doctrines and failures would move the decision from prudence to conscience.'],['Correct a public doctrinal error immediately in the same forum, or first seek a private conversation with the speaker?','Weigh the audience’s protection, the error’s severity, Matthew 18, and the public nature of the claim.'],['Spend a year mastering one biblical language or a year tracing how the whole Church has interpreted one disputed doctrine?','Ask what kinds of interpretive blindness each discipline can correct—and what each cannot.'],['Debate a position you reject before an expert audience, or defend your own position against its best-informed critic?','Ask which assignment better exposes hidden assumptions and rewards intellectual charity.'],['Adopt a historic confession now with stated exceptions, or delay subscription until the church has studied every disputed article together?','Weigh doctrinal clarity, catholic continuity, institutional honesty, and the cost of indefinite ambiguity.'],['Refute Arianism using one carefully explained biblical passage, or by building the cumulative case that led to the Nicene Creed?','Ask which approach better serves a confused beginner and which better answers an informed advocate who has prepared counter-readings.'],['Study one heresy deeply from surviving primary sources, or compare five heresies through a reliable modern survey?','Weigh historical empathy and precision against the ability to recognize recurring patterns across different controversies.'],['Role-play the strongest case for a condemned doctrine, or serve as the orthodox respondent who must identify its hidden premise?','Require both players to state the opposing position fairly before offering a rebuttal.'],['Correct a friend who unknowingly uses modalist language immediately, or first ask questions to learn what the friend actually believes?','Distinguish an imprecise analogy from a settled denial, and weigh doctrinal clarity alongside patience and teachability.']]}
