errorGame.items.push(
 ['Chalcedon’s Canon 28 granted Constantinople privileges because it was New Rome.|The canon appealed to the city’s imperial and senatorial status.|The canon grounded Constantinople’s rank chiefly in an apostolic foundation superior to Rome’s.',2,'Canon 28 explicitly reasons from Constantinople’s civil status as New Rome, not from a claim that its apostolic foundation surpassed Rome’s.','Council of Chalcedon, canon 28; compare Constantinople I, canon 3.'],
 ['Nicaea’s Canon 6 presupposed ancient regional customs involving Rome, Alexandria and Antioch.|The canon recognized Alexandria’s customary authority in Egypt, Libya and Pentapolis.|The canon made Alexandria’s authority valid only after annual ratification by the bishop of Rome.',2,'Canon 6 appeals to established custom; it does not create an annual Roman ratification requirement for Alexandria.','Council of Nicaea I, canon 6.'],
 ['Cyril opened the Council of Ephesus before John of Antioch and his bishops arrived.|John’s party later held a rival session and condemned Cyril.|The Formula of Reunion settled the dispute before the Council of Ephesus first convened.',2,'The council met in 431; the Formula of Reunion belongs to the later reconciliation between Cyril and John in 433.','Acts of Ephesus; Cyril’s Formula of Reunion with John of Antioch (433).'],
 ['Chalcedon confessed Christ as complete in deity and complete in humanity, with a rational soul and body.|Its four famous adverbs guard the two natures against confusion, change, division and separation.|Chalcedon taught that the union abolishes the distinction and properties of Christ’s two natures.',2,'The Definition says the distinction of natures is not taken away by the union and that each nature’s property is preserved.','Definition of Chalcedon (451).'],
 ['Constantinople II met in 553 under Emperor Justinian.|The council condemned the Three Chapters while professing fidelity to the first four councils.|Constantinople II rejected Chalcedon’s Definition as an incurably Nestorian document.',2,'The council received Chalcedon and argued that its condemnation of the Three Chapters protected rather than overturned Chalcedonian faith.','Constantinople II, Sentence and Anathemas; conciliar profession of the four councils.'],
 ['Constantinople III confessed two natural wills and two natural operations in the one Christ.|The council included Pope Honorius among those anathematized in connection with monothelitism.|The council protected Christ’s personal unity by locating only one natural will in Him.',2,'The council distinguished two natural wills without positing two persons, rejecting the one-will formula as a threat to Christ’s complete humanity.','Constantinople III, Definition of Faith and condemnation list.'],
 ['Nicaea II met in 787 and defended the reception of holy images.|The council said the honor shown to an image passes to its prototype.|The council assigned the worship of adoration due to the divine nature to icons themselves.',2,'Nicaea II distinguished honorable veneration from the worship of adoration owed to God alone.','Nicaea II, Definition of Faith.'],
 ['Augustine taught that original sin leaves the human will responsible but unable to heal itself.|In his mature anti-Pelagian writings, even the beginning of faith depends on preceding grace.|Augustine described grace as coercing the renewed will rather than liberating it to delight in the good.',2,'For Augustine, effective grace heals and frees the will so that the person comes willingly; it is not external compulsion against the will.','Augustine, On the Spirit and the Letter; On Grace and Free Will; On the Predestination of the Saints.'],
 ['Anselm’s Cur Deus Homo argues that the God-man makes the satisfaction humanity owes but cannot render.|Anselm’s account rejects the idea that God owed the devil a payment as the price of liberation.|Anselm makes Christ’s death a satisfaction paid to Satan because Satan possesses lawful ownership of sinners.',2,'Anselm directs satisfaction toward the honor and justice owed to God, not toward a supposed legal claim held by the devil.','Anselm, Cur Deus Homo, especially books 1–2.'],
 ['Aquinas treats the beatific vision as humanity’s supernatural final end.|For Aquinas, grace perfects nature rather than simply destroying it.|A created intellect can attain the immediate vision of the divine essence by its unaided natural power.',2,'Aquinas argues that the intellect must be elevated by the light of glory to see the divine essence.','Thomas Aquinas, Summa Theologiae I.12.4–5; I.1.8 ad 2.'],
 ['Luther’s Heidelberg Disputation preceded his appearance at the Diet of Worms.|The Bondage of the Will was published before The Freedom of a Christian.|The Bondage of the Will answered Erasmus’s argument concerning free choice.',1,'The Freedom of a Christian appeared in 1520; The Bondage of the Will followed in 1525 as Luther’s response to Erasmus.','Luther, Heidelberg Disputation (1518); The Freedom of a Christian (1520); The Bondage of the Will (1525).'],
 ['Calvin published the first Latin edition of the Institutes in 1536.|The final Latin edition of 1559 is arranged in four books.|The first edition already possessed the final edition’s four-book architecture and nearly complete scope.',2,'The compact 1536 edition had six chapters; Calvin repeatedly expanded and reorganized it before the much larger four-book edition of 1559.','Calvin, Institutes editions of 1536 and 1559.'],
 ['The Marburg Colloquy took place in 1529 under Philip of Hesse.|Luther and Zwingli reached substantial agreement on fourteen articles but remained divided over the Supper.|Both parties signed an unqualified agreement that Christ’s body is locally present in the bread.',2,'The fifteenth article recorded substantial common ground but preserved the unresolved disagreement over Christ’s bodily presence.','Marburg Articles (1529), especially article 15.'],
 ['Melanchthon was the principal author of the Augsburg Confession presented in 1530.|Luther’s Smalcald Articles were prepared after the Augsburg Confession.|The Formula of Concord was written before the intra-Lutheran controversies it was intended to settle.',2,'The Formula of Concord came in 1577 as a settlement after decades of disputes among Lutherans following Luther’s death.','Augsburg Confession (1530); Smalcald Articles (1537); Formula of Concord (1577).'],
 ['The Book of Concord was published in 1580.|It includes Luther’s Small and Large Catechisms and the Formula of Concord.|It includes the Westminster Confession as its Reformed account of church government.',2,'The Book of Concord is the Lutheran confessional corpus; the Westminster Confession is a later Reformed document and is not included.','Book of Concord (1580), table of contents.'],
 ['Heidelberg Catechism Question 1 centers Christian comfort on belonging to Jesus Christ.|Question 80 was absent from the first edition and was added and expanded during 1563.|Calvin personally authored the catechism’s official German text for the Palatinate.',2,'The catechism was commissioned by Frederick III and is chiefly associated with Zacharias Ursinus; Calvin was not the author of its official German text.','Heidelberg Catechism editions of 1563; Frederick III’s preface.'],
 ['The Canons of Dort answer the five articles of the Remonstrance.|Their third and fourth heads are treated together because the subjects are closely joined.|Dort required supralapsarianism as the only permissible Reformed ordering of the decrees.',2,'Dort defined shared boundaries on election and grace without making supralapsarianism the sole permissible position.','Canons of Dort, Heads I–V and Conclusion.'],
 ['Westminster Confession chapter 7 distinguishes a covenant of works and a covenant of grace.|It says the covenant of grace was differently administered under law and gospel while remaining one in substance.|It teaches that the Old and New Testaments contain two covenants of grace that differ in saving substance.',2,'Westminster expressly calls them one and the same covenant under different dispensations, not two saving covenants different in substance.','Westminster Confession of Faith 7.5–6.'],
 ['Westminster says God ordains whatsoever comes to pass.|It immediately denies that God thereby becomes the author of sin or violates creaturely wills.|It explains providence by making secondary causes unnecessary and forcing every event in the same manner.',2,'Westminster preserves real secondary causes and distinguishes necessary, free and contingent events under providence.','Westminster Confession of Faith 3.1 and 5.2.'],
 ['The Savoy Declaration adapts Westminster in a Congregational direction, especially on the church.|The 1689 Baptist Confession draws heavily from Westminster and Savoy while confessing believers’ baptism.|The 1689 confession reproduces Westminster’s chapters on the church and baptism without substantive alteration.',2,'The Baptist confession deliberately revises ecclesiology and baptism even while retaining much of Westminster and Savoy.','Savoy Declaration (1658), chapters 26 and 30; Second London Baptist Confession (1689), chapters 26 and 29.'],
 ['Belgic Confession article 27 says the catholic Church is not confined or bound to one place or group.|Article 29 identifies pure preaching, proper sacramental administration and church discipline as marks of the true Church.|Article 29 makes an unbroken episcopal succession the sole sufficient mark of a true Church.',2,'The Belgic Confession’s stated marks concern doctrine, sacraments and discipline, not succession as a solitary test.','Belgic Confession, articles 27–29.'],
 ['Romans 4 appeals to Genesis 15:6 in its argument about Abraham and faith.|James 2 describes the offering of Isaac and then says Genesis 15:6 was fulfilled.|Paul and James use “justify” for precisely the same question at precisely the same narrative moment.',2,'Paul addresses the ungodly being counted righteous apart from works; James addresses faith being shown genuine and brought to maturity in obedient action.','Genesis 15:6; 22:1–18; Romans 4:1–8; James 2:14–26.'],
 ['Hebrews repeatedly applies Psalm 110:4 to Christ’s priesthood.|Hebrews quotes Jeremiah 31 at length when arguing for the new covenant.|Hebrews places Melchizedek inside Aaron’s genealogy to establish Christ’s Levitical succession.',2,'Hebrews stresses that Melchizedek’s priesthood is distinct from and superior to the Levitical order.','Psalm 110:4; Jeremiah 31:31–34; Hebrews 7–10.'],
 ['Romans 10 adapts Deuteronomy 30’s language about the word being near.|Romans 11 recalls the seven thousand preserved in Elijah’s day.|Romans 10 identifies Isaiah as the source of “The word is near you, in your mouth and in your heart.”',2,'That wording comes from Deuteronomy 30:14, which Paul applies christologically to the word of faith.','Deuteronomy 30:11–14; 1 Kings 19:18; Romans 10:6–10; 11:2–5.'],
 ['Galatians 3 identifies the singular promised offspring with Christ.|Paul says the law given 430 years later does not annul the prior promise.|When Paul asks whether the law is contrary to God’s promises, he answers that it certainly is.',2,'Paul answers “Certainly not”; the law cannot give life, but it serves within the history ordered toward the promised Christ.','Galatians 3:15–24.'],
 ['First Corinthians 15 ties believers’ resurrection to the bodily resurrection of the crucified and buried Christ.|A “spiritual body” is an imperishable body fitted for and empowered by the Spirit, not a nonphysical ghost.|“Flesh and blood cannot inherit the kingdom” means the created body has no continuity with the resurrection body.',2,'Paul contrasts the perishable Adamic condition with transformed imperishability while insisting that what is sown is raised.','1 Corinthians 15:1–8, 35–54.'],
 ['John 1 distinguishes the Word from God while also calling the Word God.|The prologue places everything that came into being among the things made through the Word.|John uses the same “came into being” construction to place the Word Himself among the created things.',2,'The Word already “was” in the beginning; things that “came into being” did so through Him, placing Him on the Creator side of the distinction.','John 1:1–3; compare 1:6 and 1:14.'],
 ['Philippians 2 speaks of Christ in the form of God and then taking the form of a servant.|The hymn joins His obedience unto death to His subsequent exaltation.|The passage explicitly defines Christ’s self-emptying as surrendering essential divine attributes.',2,'The grammar explains the emptying through taking servant form and obedient humiliation; it does not list discarded divine attributes.','Philippians 2:5–11.'],
 ['Colossians 1 calls Christ firstborn of all creation and immediately says all things were created through and for Him.|It also calls Him firstborn from the dead in connection with His headship over the Church.|In both phrases, “firstborn” necessarily identifies Christ as the first member brought into existence within the relevant class.',2,'The context uses firstborn language for supremacy and inheritance; the Creator of all things cannot simultaneously be one item within “all things” created through Him.','Psalm 89:27; Colossians 1:15–20.'],
 ['The Athanasian Creed probably arose in the Latin West after Athanasius’s lifetime.|It confesses one Christ through the divine person’s assumption of humanity, not by converting deity into flesh.|Athanasius drafted the creed at Nicaea and the council adopted it as its official expanded symbol.',2,'Despite its traditional name, the creed postdates Athanasius and was not the creed adopted at Nicaea.','Athanasian Creed; compare the Nicene Creed of 325 and Constantinopolitan Creed of 381.'],
 ['The Apostles’ Creed developed from earlier baptismal summaries such as the Old Roman Symbol.|The descent clause was absent from early forms and had a varied history before entering the received text.|The twelve apostles jointly composed the creed’s final wording before separating for their missions.',2,'The creed is apostolic in doctrinal substance, but its received wording developed over centuries rather than being drafted in one meeting by the Twelve.','Old Roman Symbol; Rufinus, Commentary on the Apostles’ Creed; later creedal forms.'],
 ['The Cappadocian Fathers include Basil of Caesarea, Gregory of Nazianzus and Gregory of Nyssa.|Their mature pro-Nicene grammar speaks of one ousia and three hypostases.|Their settlement depended on treating ousia and hypostasis as permanently interchangeable words with no useful distinction.',2,'Their terminology distinguished the one common divine essence from the three irreducible personal realities.','Basil, Letter 38; Gregory of Nazianzus, Theological Orations; Gregory of Nyssa, To Ablabius.']
);

const HERESY_CASES={
 'Arianism':['“Firstborn,” “begotten,” Proverbs 8:22 and the Son’s being sent can be read as placing Him below the unbegotten Father while still above every other creature.','Only the Father’s unbegottenness is compatible with full deity; derivation or begetting must imply a lesser essence.','John 1:1–3; Colossians 1:15–17; Hebrews 1; Nicaea (325).'],
 'Modalism / Sabellianism':['Scripture insists on one God and applies divine names and works to Father, Son and Spirit, which can be taken as three ways the single divine self acts toward creation.','Personal distinctions describe temporary economies or manifestations rather than eternal relations within God.','Matthew 3:16–17; John 14:16–17; John 17:1–5; Matthew 28:19.'],
 'Patripassianism':['If Father and Son name the same divine subject under different manifestations, the Father can be said to suffer when that subject appears as the incarnate Son.','Incarnational predicates may be transferred across divine manifestations without preserving distinct personal subjects.','John 1:1–2; John 8:16–18; John 17:5; the anti-modalist rule that the Son, not the Father, became incarnate.'],
 'Adoptionism':['Jesus’ baptism, growth, obedience, resurrection and exaltation can be organized as stages at which an exemplary man receives divine sonship and authority.','Sonship is a functional status granted within history rather than the identity of an eternal divine person.','John 1:1–18; Galatians 4:4; Philippians 2:5–11; Hebrews 1.'],
 'Socinianism':['Jesus prays, obeys, suffers and dies; biblical monotheism can therefore be protected by treating Him as the uniquely commissioned and exalted human Messiah.','Divine honor and saving authority may be delegated to a creature without that person sharing God’s eternal identity.','John 1:1–3; John 20:28; Philippians 2:5–11; Hebrews 1.'],
 'Pneumatomachianism':['The Spirit is sent, poured out and described as divine power, language that can be read as placing Him among God’s supreme ministering agents.','Only the Father and Son possess personal divine identity; personal verbs applied to the Spirit are personifications of power.','Acts 5:3–4; 1 Corinthians 12:11; 2 Corinthians 3:17–18; Constantinople I.'],
 'Tritheism':['Father, Son and Spirit speak to one another, send one another and appear simultaneously, so ordinary personal language may suggest three centers of being cooperating perfectly.','Every distinct person must also be a numerically separate being, will and operation.','Deuteronomy 6:4; John 10:30; 1 Corinthians 8:4–6; the doctrine of inseparable operations.'],
 'Apollinarianism':['Replacing the fallible human rational mind with the Logos seems to secure Christ’s unity and sinlessness while retaining a human body and sensitive soul.','A complete rational human nature would either sin or introduce a second acting subject beside the Logos.','Luke 2:52; Matthew 26:39; Hebrews 2:17; Gregory of Nazianzus, Letter 101.'],
 'Classical Nestorian formulation':['A full divine nature cannot suffer, while a full human nature does; assigning each range of acts to its own subject seems to preserve both without mixture.','Every complete nature requires its own personal subject, so two complete natures imply two acting “whos.”','Cyril’s Third Letter to Nestorius; Ephesus (431); Chalcedon (451).'],
 'Eutychianism':['The incarnation’s unity can seem safer if the humanity is understood as taken into one resulting incarnate nature rather than left as a second coordinate reality.','Continuing to speak of two natures after the union necessarily divides Christ into two subjects.','Leo’s Tome; Chalcedon’s “without confusion, without change”; distinguish Oriental Orthodox miaphysite formulas.'],
 'Monothelitism':['Because willing appears to belong to the acting person, one incarnate person seems to require one unified divine-human will rather than two centers of willing.','Will is a property of person rather than nature.','Matthew 26:39; Hebrews 5:8; Maximus the Confessor; Constantinople III.'],
 'Docetism':['Divine transcendence and immortality appear incompatible with birth, bodily weakness and suffering, so visible humanity can be treated as an accommodated appearance.','Material embodiment is inherently unworthy of God and cannot become a permanent vehicle of salvation.','John 1:14; 1 John 4:2–3; Luke 24:39; 1 Corinthians 15.'],
 'Ontological Kenoticism':['Philippians says the Son “emptied himself,” and genuine human limitation may seem to require laying aside omniscience, omnipotence or omnipresence.','Possessing divine attributes is incompatible with living a genuinely limited human life.','Philippians 2:6–8; Colossians 2:9; Hebrews 1:3; distinguish possession from the manner of exercise.'],
 'Subordinationism':['The Father sends, commands and is called greater, while the Son obeys; this order can be projected into an eternal hierarchy of authority.','Relations of origin and the incarnate mission imply unequal ranks of authority within the divine life.','John 5:18–23; John 16:15; Philippians 2:6–11; Nicaea.'],
 'Pelagianism':['God commands repentance and righteousness and holds people responsible, which can seem to presuppose an intact natural capacity to obey without inward renewal.','Moral obligation always entails native moral ability under the same fallen conditions.','Romans 5:12–21; John 6:44; Ephesians 2:1–10; Augustine’s anti-Pelagian works.'],
 'Semi-Pelagianism':['Grace is necessary for salvation, yet responsibility can appear to require that the first desire for faith originate with the person before grace assists.','A response is genuinely free only if its initial movement is self-originating rather than enabled by prior grace.','John 6:44; Philippians 1:29; 1 Corinthians 2:14; Second Council of Orange.'],
 'Sandemanianism':['The gospel presents truths to be believed, so saving faith can be reduced to intellectual assent in order to prevent repentance or affection from becoming meritorious additions.','Trust, repentance and transformed allegiance are works added after the essence of saving faith.','James 2:14–26; Galatians 5:6; 1 Thessalonians 1:4–10.'],
 'Hyper-Calvinism':['If God intends salvation only for the elect, an indiscriminate call may appear insincere or an attempt to accomplish what God has not decreed.','The secret decree, rather than God’s revealed command and promise, determines to whom the Church may sincerely offer Christ.','Matthew 28:18–20; Acts 17:30; Romans 10:14–17; Canons of Dort II.5.'],
 'Antinomianism':['Believers are not under law but grace and possess Christ’s righteousness, so moral law can be treated as wholly obsolete for Christian conduct.','Freedom from the law’s condemnation removes every normative and instructional use of God’s commands.','Romans 3:31; Romans 6:1–14; Romans 8:4; Galatians 5:13–14.'],
 'Universal Apokatastasis':['Texts about reconciling all things and every knee confessing Christ can be joined to medicinal judgment and God’s final victory over every enemy.','Judgment is always restorative, and universal terms must include every rational creature without permanent exception.','Matthew 25:46; 2 Thessalonians 1:9; Revelation 20; compare Colossians 1:20 carefully.'],
 'Prosperity Gospel':['Christ bears the curse, God heals, and covenant blessing includes material provision; these promises can be combined into a normal entitlement to health and wealth now.','The final blessings of resurrection and new creation are exhaustively available as present guarantees to sufficiently faithful believers.','2 Corinthians 11–12; Philippians 4:10–13; 1 Timothy 6:5–10; 1 Peter 4:12–19.'],
 'Marcionism':['The Old Testament’s wars, judgments and law can be contrasted with Jesus’ mercy and grace, suggesting two incompatible divine characters and economies.','Retributive justice and saving love cannot belong to one God; radical covenantal discontinuity therefore implies different deities.','Luke 24:25–27; Romans 3:21–31; 1 Corinthians 10:1–11; Irenaeus and Tertullian.'],
 'Gnosticism':['Human alienation from the body, the world’s suffering and language about heavenly knowledge can be woven into salvation as awakening to a hidden spiritual origin.','Matter is intrinsically defective, and salvation is escape from material creaturehood through esoteric knowledge.','Genesis 1; John 1:14; 1 John 1:1–3; 1 Corinthians 15.'],
 'Ebionism':['Jesus’ Jewish messiahship, obedience to Torah and human development can be emphasized while strict monotheism excludes personal preexistence and Gentiles are drawn into Israel’s law.','Divine unity excludes an eternal divine Son, and covenant inclusion requires continuing Mosaic boundary markers.','John 1:1–18; Acts 15; Galatians 2–5; Philippians 2:5–11.'],
 'Donatism':['The Church is called holy and ministers publicly represent Christ; a traitor or gravely corrupt bishop can therefore seem incapable of mediating a holy sacrament.','A sacrament’s validity depends on the minister’s hidden spiritual and ecclesial worthiness.','1 Corinthians 3:5–7; Augustine and Optatus against the Donatists; distinguish validity from discipline.'],
 'Novatianism':['Hebrews warns that restoration after apostasy is impossible, so refusing reconciliation to the baptized “lapsed” can appear to protect baptism and the Church’s holiness.','Severe warning texts remove the Church’s authority to recognize repentance after grave post-baptismal sin.','2 Corinthians 2:5–11; Galatians 6:1; John 20:21–23; read Hebrews 6 and 10 in full.'],
 'Montanism':['The promised Spirit continues prophetic speech, and rigorous fasting or discipline can appear to be urgent new guidance for a compromised Church.','Post-apostolic prophecy may bind the universal Church with disciplines beyond the received apostolic rule.','1 Corinthians 14; 1 John 4:1–6; Eusebius, Ecclesiastical History V; distinguish continuationism.'],
 'Manichaeism':['The depth and persistence of evil, together with conflict between flesh and spirit, can suggest two opposed cosmic realities rather than one good creation gone wrong.','Evil is a positive eternal substance that requires an independent metaphysical source.','Genesis 1; Isaiah 45:5–7; Colossians 1:15–20; Augustine’s anti-Manichaean works.'],
 'Denial of bodily resurrection':['Paul contrasts a natural body with a spiritual body, which can be read as replacement of physical existence by an immaterial afterlife.','“Spiritual” names the substance from which the risen person is made rather than a body transformed and governed by the Spirit.','Luke 24:36–43; Romans 8:11; 1 Corinthians 15:35–54; Philippians 3:20–21.'],
 'Oneness Pentecostalism':['The Bible confesses one God, the fullness of deity dwells in Jesus, and Acts records baptism in Jesus’ name; these can be read as identifying Jesus as the single divine person.','Real eternal personal distinctions would divide God, while the singular divine name belongs exclusively to Jesus as one person.','Matthew 3:16–17; Matthew 28:19; John 14:16–17; John 17:1–5.'],
 'Jehovah’s Witness Christology':['“Firstborn of creation,” “beginning of God’s creation,” wisdom language and Michael’s heavenly role can be combined into a preexistent chief creature through whom God made everything else.','“Firstborn” and “beginning” must denote the first member of the created class rather than supremacy or source.','John 1:3; Colossians 1:16–17; Hebrews 1:5–14; Revelation 5.'],
 'Latter-day Saint exaltation':['Biblical adoption, participation in divine nature, heavenly family language and patristic deification can be interpreted as humans progressing into the same species of deity.','The Creator–creature distinction is a difference of development and degree rather than an absolute difference of being.','Isaiah 43:10; Isaiah 44:6–8; Genesis 1:1; Nicaea; distinguish Christian theosis by grace.'],
 'Modern Unitarianism':['Spirit can mean breath, wind or power, and impersonal images such as pouring and filling can be taken as evidence against distinct personhood.','Personal actions attributed to the Spirit are literary personifications of God’s operative power.','Acts 5:3–4; Acts 13:2; 1 Corinthians 12:11; Matthew 28:19.'],
 'Open Theism':['God tests people, regrets actions, responds to prayer and announces conditional futures; libertarian freedom can seem incompatible with already settled future facts.','Exhaustively definite foreknowledge would make alternative future choices impossible and relationships nonresponsive.','Isaiah 46:9–10; Psalm 139:1–16; Acts 2:23; distinguish covenantal responsiveness from ignorance.'],
 'Process Theology':['Scripture portrays God as responsive, compassionate and affected by creatures; perfect love can therefore be redefined as sharing the world’s becoming and suffering.','Perfect love requires metaphysical change and dependence, while immutability would entail indifference.','Exodus 3:14; Malachi 3:6; Acts 17:24–25; creation from nothing and classical divine aseity.']

 ['scripture-02','scripture','If Scripture is clear in what is necessary for salvation, why do faithful interpreters reach incompatible conclusions about major doctrines?','Does the disagreement challenge biblical clarity, human interpreters, or the claim that every disputed doctrine is equally clear?','Psalm 19:7–11; Psalm 119:105, 130; Luke 24:25–27; 2 Peter 3:15–16'],
 ['scripture-03','scripture',"When the New Testament reads Israel's Scriptures typologically, may Christians use the same method today?",'Compare Matthew 2:15 and Galatians 4:21–31 with the original contexts of Hosea 11 and Genesis 16–21.','Genesis 16–21; Hosea 11:1; Matthew 2:15; 1 Corinthians 10:1–11; Galatians 4:21–31'],
 ['scripture-04','scripture','Should the theological unity of Scripture control the interpretation of an individual passage, or must doctrine always wait upon exegesis of each text?','How can the analogy of faith guide interpretation without silencing passages that challenge a theological system?','Luke 24:27, 44–47; Acts 20:27; Romans 12:6; 2 Peter 1:19–21'],
 ['scripture-05','scripture',"Is the biblical canon known primarily through the church's authoritative recognition, the texts' self-authenticating qualities, or historical evidence?",'What role should John 10:27, apostolic authority, early reception, and disputed books play in the account?','Luke 24:44; John 10:27; 1 Corinthians 14:37; 2 Peter 3:15–16'],
 ['scripture-06','scripture','What principles distinguish a biblical command that binds the church in every age from one tied to an ancient covenant or culture?','Test the proposed principles against head coverings in 1 Corinthians 11 and the holy kiss in Romans 16:16.','Romans 16:16; 1 Corinthians 11:2–16; Acts 15:19–29; 1 Timothy 2:8–15'],
 ['scripture-07','scripture','Does the existence of textual variants weaken a strong doctrine of biblical inspiration and preservation?','How should Matthew 5:18 be understood alongside the manuscript evidence for Mark 16:9–20 and John 7:53–8:11?','Matthew 5:18; Mark 16:9–20; John 7:53–8:11; 1 Peter 1:24–25'],
 ['scripture-08','scripture','How should Christians hold together the diverse human voices of Scripture with the claim that it has one divine author?','Use the different emphases of Romans, James, Proverbs, and Ecclesiastes to test any proposed account of unity.','Proverbs 26:4–5; Ecclesiastes 1:2–11; Romans 3:21–4:8; James 2:14–26'],
 ['god-01','god','Does the baptismal name of Matthew 28:19 and the pattern of 2 Corinthians 13:14 require the Nicene doctrine of one essence in three persons?','Which alternative account best explains the same texts, and where does it fail to preserve biblical monotheism?','Deuteronomy 6:4; Matthew 28:19; John 1:1–18; 2 Corinthians 13:14'],

}

room.addEventListener('click',e=>{if(active?.id!=='live')return;if(e.target.id==='generateLive'){e.preventDefault();e.stopImmediatePropagation();requestLiveQuestion();return}if(e.target.id==='nextLiveQuestion'){e.preventDefault();e.stopImmediatePropagation();nextLiveQuestion();return}if(e.target.dataset.liveAnswer!==undefined){e.preventDefault();e.stopImmediatePropagation();let correct=e.target.dataset.liveAnswer===liveQuestion.answer;room.querySelectorAll('[data-live-answer]').forEach(button=>{button.disabled=true;if(button.dataset.liveAnswer===liveQuestion.answer)button.classList.add('correct')});if(!correct)e.target.classList.add('wrong');score+=correct?1:0;streak=correct?streak+1:0;room.querySelector('.score').textContent=`Live score: ${score} · Current streak: ${streak}`;room.querySelector('.answer').classList.add('show')}},true);
room.addEventListener('click',e=>{if(active?.id!=='wheel')return;let category=e.target.dataset.wheel;if(category!==undefined){e.preventDefault();e.stopImmediatePropagation();spinWheel(category);render();return}if(e.target.id==='next'){e.preventDefault();e.stopImmediatePropagation();spinWheel();render()}},true);
document.addEventListener('keydown',event=>{if(!active||event.target.matches('input,select,textarea'))return;let key=event.key.toLowerCase();if(key==='escape')room.querySelector('#back')?.click();else if(key==='n')(room.querySelector('#next')||room.querySelector('#generateLive'))?.click();else if(key==='r')room.querySelector('#reveal')?.click();else if(key==='a')room.querySelector('#assist')?.click()});
</script></body></html>
