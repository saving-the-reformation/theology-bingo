<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theology Bingo</title><style>
:root{--ink:#172133;--paper:#fffdf8;--cream:#f5eddd;--wine:#743245;--gold:#d5a63e;--sage:#46665c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,serif}.app{width:min(1080px,100%);margin:auto;padding:28px 20px 48px}header{display:flex;justify-content:space-between;gap:18px;align-items:center;border-bottom:1px solid #d8c7a7;padding-bottom:20px}p{margin:0 0 8px;color:var(--wine);font:800 .7rem Arial,sans-serif;letter-spacing:.15em}h1{margin:0;font-size:clamp(2rem,5vw,3.7rem);line-height:.94}h2{font-size:clamp(1.5rem,3vw,2.4rem)}header b{border:1px solid var(--gold);border-radius:30px;padding:8px 12px;color:var(--wine);font:.8rem Arial,sans-serif}.intro{text-align:center;padding:40px 10px 22px}.intro span{display:block;max-width:520px;margin:auto;color:#58606b}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:7px;background:var(--ink);border:5px solid var(--gold)}.square{position:relative;min-height:104px;border:0;padding:9px 6px;background:var(--paper);font-family:Georgia,serif;font-weight:bold;font-size:clamp(.67rem,1.7vw,.95rem);line-height:1.08}.square:hover{background:#f9e9c3}.on{background:var(--sage);color:#fff}.free{background:var(--wine);color:#fff;font-size:1.1rem;letter-spacing:.08em}.seal{display:block;color:#f7d16d;margin-top:6px}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;padding:25px 0 8px}.actions button,.host button{border:0;background:var(--wine);color:#fff;padding:12px 17px;font:700 1rem Georgia,serif}.actions button+button{background:transparent;color:var(--wine);border:1px solid var(--wine)}small{flex-basis:100%;text-align:center;color:var(--sage)}footer{text-align:center;margin-top:18px;color:#69707b;font-size:.9rem}.host{display:grid;grid-template-columns:1.5fr .85fr;gap:20px;margin-top:28px}.host article,.host aside{background:var(--paper);border:1px solid #dfd2b7;padding:28px}.host select{width:100%;font:1rem Georgia,serif;padding:12px;margin:14px 0}.host ol{padding-left:20px;line-height:1.55}@media(max-width:650px){.app{padding:20px 12px}.grid .square{min-height:71px;padding:6px 3px;font-size:.58rem}.free{font-size:.78rem}.host{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style></head><body><main id="app" class="app"></main><script>
const T=`Homoousios|Eternal generation|Procession|Inseparable operations|Perichoresis|Hypostatic union|Communicatio idiomatum|Dyothelitism|Extra Calvinisticum|Munus triplex|Pactum salutis|Federal headship|Imputation|Definitive sanctification|Ordo salutis|Effectual calling|Perseverance of the saints|Conditional election|Prevenient grace|Monergism|Means of grace|Sacramental union|Transubstantiation|Real spiritual presence|Ex opere operato|Paedobaptism|Credobaptism|Visible church|Marks of the church|Regulative principle of worship|Antinomianism|Third use of the law|Covenant of works|Covenant of grace|Typology|Republication|Analogia fidei|Analogia entis|Archetypal theology|Ectypal theology|Theologia viatorum|Theologia unionis|Adiaphora|Sola fide|Solus Christus|Filioque|Theosis|Council of Chalcedon|Canons of Dort|Westminster Confession of Faith`.split('|');
const P=new URLSearchParams(location.search),isHost=P.get('host')==='arbiter',num=Math.min(15,Math.max(1,+P.get('card')||1)),key='theology-bingo-'+num;
function card(n){let x=1777+n*7919,p=T.map((_,i)=>i);for(let i=49;i;i--){x=x*48271%2147483647;let j=x%(i+1);[p[i],p[j]]=[p[j],p[i]]}return p.slice(0,24)}
function head(label){return `<header><div><p>${label}</p><h1>Theology Bingo</h1></div><b>${isHost?'Host Dashboard':'Private Card '+String(num).padStart(2,'0')}</b></header>`}
function player(){let m=JSON.parse(localStorage.getItem(key)||'[]'),a=card(num);document.querySelector('#app').innerHTML=head('AREOPAGUS FORUM PRESENTS')+`<section class="intro"><p>YOUR PRIVATE CARD</p><h2>Listen. Identify. Mark.</h2><span>Tap a term after you identify the host’s clue. Marks stay on this device.</span></section><div class="grid">${Array.from({length:25},(_,i)=>{let f=i===12,x=f?-1:a[i>12?i-1:i],on=f||m.includes(x);return `<button class="square ${on?'on':''} ${f?'free':''}" data-x="${x}">${f?'FREE<br>SPACE':T[x]}${on?'<i class="seal">✦</i>':''}</button>`}).join('')}</div><div class="actions"><button id="bingo">I have Bingo!</button><button id="clear">Clear marks</button><small id="note"></small></div><footer>Do not share this link. The host verifies every claim against the called clues.</footer>`;document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{let x=+b.dataset.x;m=m.includes(x)?m.filter(v=>v!==x):[...m,x];localStorage.setItem(key,JSON.stringify(m));player()});document.querySelector('#clear').onclick=()=>{localStorage.removeItem(key);player()};document.querySelector('#bingo').onclick=async()=>{await navigator.clipboard.writeText(`BINGO — Card ${num}. I have marked my completed pattern.`);document.querySelector('#note').textContent='Claim copied—paste it into your Discord DM to the host.'}}
function host(){let called=JSON.parse(localStorage.getItem('theology-bingo-called')||'[]');document.querySelector('#app').innerHTML=head('HOST DASHBOARD')+`<section class="host"><article><p>HOST CONTROL</p><h2>Read the matching clue from your private host key, then reveal its term here.</h2><select id="term"><option value="">Select a term to call…</option>${T.map((t,i)=>`<option value="${i}">${i+1}. ${t}</option>`).join('')}</select><button id="call">Add to called list</button><p style="margin-top:24px">Keep your source-checked host key in a separate private tab; screen-share this dashboard only.</p></article><aside><p>CALLED TERMS · ${called.length}</p><ol>${called.map(i=>`<li>${T[i]}</li>`).join('')||'<li>No clues revealed yet.</li>'}</ol><button id="reset">Clear round</button></aside></section><footer>For the original clue bank and sources, use the host game pack supplied with this site.</footer>`;document.querySelector('#call').onclick=()=>{let i=+document.querySelector('#term').value;if(!Number.isNaN(i)&&!called.includes(i)){called.push(i);localStorage.setItem('theology-bingo-called',JSON.stringify(called));host()}};document.querySelector('#reset').onclick=()=>{localStorage.removeItem('theology-bingo-called');host()}}
isHost?host():player();
</script></body></html>
