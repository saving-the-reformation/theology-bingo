<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Private Theology Bingo themed question presenter"><title>Theology Bingo — Themed Flip Cards</title><style>
:root{--ink:#172133;--paper:#fffdf8;--cream:#f5eddd;--wine:#743245;--gold:#d5a63e;--sage:#46665c;--muted:#66707c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f5eddd,#e9dcc3);color:var(--ink);font-family:Georgia,serif;min-height:100vh}.app{width:min(980px,100%);margin:auto;padding:24px 18px 44px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #cfbb96;padding-bottom:18px}header p,.eyebrow{margin:0 0 7px;color:var(--wine);font:800 .72rem Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,5vw,3.35rem);line-height:.96}header b{border:1px solid var(--gold);border-radius:30px;padding:8px 12px;color:var(--wine);font:700 .76rem Arial,sans-serif}.deckname{color:var(--muted);font-size:1.05rem;margin-top:9px}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:24px 0 16px}.controls select,.controls button,.buttons button{border:1px solid #ccb98f;background:var(--paper);color:var(--ink);padding:12px 14px;font:700 .95rem Georgia,serif}.controls button,.buttons .primary{background:var(--wine);color:white;border-color:var(--wine);cursor:pointer}.status{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font:700 .78rem Arial,sans-serif;margin:12px 2px}.scene{perspective:1200px;min-height:390px}.card{position:relative;width:100%;height:390px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1);cursor:pointer}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:5px solid var(--gold);box-shadow:0 18px 50px #473a2530;padding:clamp(28px,6vw,62px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--paper)}.back{transform:rotateY(180deg);background:var(--ink);color:white}.face h2{max-width:790px;margin:10px 0;font-size:clamp(1.45rem,3.6vw,2.65rem);line-height:1.22}.back h2{color:#fff}.number{color:#f2cf7b;font:800 .85rem Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}.hint{margin-top:22px;color:var(--muted);font-size:.9rem}.back .hint{color:#c9d0d8}.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:18px}.buttons button{cursor:pointer;min-width:120px}.buttons button:disabled{opacity:.45;cursor:not-allowed}.note{text-align:center;color:var(--muted);font-size:.87rem;line-height:1.45;margin:18px auto 0;max-width:700px}kbd{background:#fff8;border:1px solid #9998;border-radius:4px;padding:2px 5px}.empty{padding:60px;text-align:center;background:var(--paper);border:2px solid var(--gold)}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.controls{grid-template-columns:1fr}.scene,.card{height:430px}.face{padding:28px 20px}.buttons button{flex:1;min-width:95px}}
</style></head><body><main class="app"><header><div><p>Private Host Presentation Tool</p><h1>Theology Bingo Flip Cards</h1><div class="deckname" id="deckName"></div></div><b>HIGH-TIER · 50 QUESTIONS</b></header><section class="controls" aria-label="Question filters"><select id="topic"><option value="all">Balanced mix — all topics</option></select><button id="shuffle">Create a Fresh Mix</button></section><div class="status"><span id="progress"></span><span id="topicName"></span></div><section id="stage"></section><div class="buttons"><button id="prev">← Previous</button><button id="flip" class="primary">Flip Card</button><button id="next">Next →</button></div><p class="note">Click the card or press <kbd>Space</kbd> to reveal the answer and question number. Most rounds end after about 20–30 questions. Keep this page private from players.</p></main><script src="themed-decks.js"></script><script>
const params=new URLSearchParams(location.search),deckKey=Object.hasOwn(THEMED_DECKS,params.get('deck'))?params.get('deck'):'creeds',selectedDeck=THEMED_DECKS[deckKey],QUESTIONS=selectedDeck.questions,topicSelect=document.querySelector('#topic'),stage=document.querySelector('#stage'),progress=document.querySelector('#progress'),topicName=document.querySelector('#topicName'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),flip=document.querySelector('#flip');let deck=[],index=0,revealed=false;document.title=`Theology Bingo — ${selectedDeck.title} Questions`;document.querySelector('#deckName').textContent=selectedDeck.title;const topics=[...new Set(QUESTIONS.map(question=>question.topic))];for(const topic of topics)topicSelect.insertAdjacentHTML('beforeend',`<option value="${topic}">${topic}</option>`);function shuffle(items){let copy=[...items];for(let i=copy.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}function balanced(items){let groups=topics.map(topic=>shuffle(items.filter(question=>question.topic===topic))),out=[];while(groups.some(group=>group.length))for(const group of groups)if(group.length)out.push(group.pop());return out}function rebuild(){let topic=topicSelect.value,pool=QUESTIONS.filter(question=>topic==='all'||question.topic===topic);deck=topic==='all'?balanced(pool):shuffle(pool);index=0;revealed=false;render()}function render(){if(!deck.length){stage.innerHTML='<div class="empty">No questions match this selection.</div>';progress.textContent='0 questions';topicName.textContent='';return}let question=deck[index];stage.innerHTML=`<div class="scene"><article class="card ${revealed?'flipped':''}" id="card" tabindex="0" role="button" aria-label="${revealed?'Answer shown. Flip to question':'Question shown. Flip to answer'}"><div class="face front"><p class="eyebrow">Theology Bingo clue</p><h2>${question.clue}</h2><div class="hint">Answer hidden — flip when ready</div></div><div class="face back"><div class="number">Question #${question.number}</div><h2>${question.answer}</h2><div class="hint">Click again to return to the clue</div></div></article></div>`;document.querySelector('#card').onclick=toggle;progress.textContent=`Question ${index+1} of ${deck.length}`;topicName.textContent=question.topic;prev.disabled=index===0;next.disabled=index===deck.length-1;flip.textContent=revealed?'Show Clue':'Flip Card'}function toggle(){revealed=!revealed;render()}function move(by){let target=index+by;if(target<0||target>=deck.length)return;index=target;revealed=false;render()}topicSelect.onchange=rebuild;document.querySelector('#shuffle').onclick=rebuild;flip.onclick=toggle;prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.addEventListener('keydown',event=>{if(event.target.matches('select,button'))return;if(event.code==='Space'){event.preventDefault();toggle()}if(event.key==='ArrowLeft')move(-1);if(event.key==='ArrowRight')move(1)});rebuild();
</script></body></html>
