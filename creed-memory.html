<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Learn, practice, sequence, quiz, and recite the four ecumenical creeds."><title>Creed Memory · Areopagus Game Room</title><style>

:root{--ink:#1d2633;--paper:#fffdf8;--cream:#f3ead9;--wine:#743245;--wine2:#572334;--gold:#b98625;--sage:#46665c;--good:#dce9e1;--bad:#f4dddd;--muted:#66707d;--line:#d9c9aa;--shadow:0 12px 32px #422d1719}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(145deg,#f7f0e4,#eadcc3);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(1120px,100%);margin:auto;padding:24px 16px 60px}header{display:flex;justify-content:space-between;gap:18px;align-items:center;border-bottom:1px solid #cfbb96;padding-bottom:18px}.eyebrow,.label{display:block;margin:0 0 7px;color:var(--wine);font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1,h2,h3,.creed-text{font-family:Georgia,"Times New Roman",serif}h1{margin:0;font-size:clamp(2rem,5vw,3.6rem);line-height:.96}h2{margin:4px 0 12px;font-size:clamp(1.65rem,4vw,2.55rem)}h3{margin:0 0 8px;font-size:1.3rem}p{line-height:1.55}.back{color:var(--wine);font-weight:750;text-underline-offset:3px}.intro{max-width:760px;margin:30px auto 24px;text-align:center;color:var(--muted)}button,.button{border:0;border-radius:3px;background:var(--wine);color:#fff;cursor:pointer;font:750 .95rem inherit;padding:12px 16px}button:hover{background:var(--wine2)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d6a838;outline-offset:2px}button.secondary{background:transparent;color:var(--wine);border:1px solid var(--wine)}button.ghost{background:#f7f0e4;color:var(--ink);border:1px solid var(--line)}button:disabled{cursor:not-allowed;opacity:.55}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card,.panel{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow)}.creed-card{padding:22px;display:flex;flex-direction:column;min-height:245px}.creed-card p{color:var(--muted);margin:0 0 16px}.card-top,.progress-row{display:flex;justify-content:space-between;gap:12px}.meter{height:8px;background:#e9dfce;border-radius:8px;overflow:hidden;margin:12px 0 8px}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--wine),var(--gold))}.stats,.progress-row{color:var(--sage);font-size:.8rem;font-weight:800}.creed-card button{margin-top:auto;align-self:flex-start}.workspace{display:none}.workspace.show{display:block}.workspace-head{margin:28px 0 14px;padding:20px;background:#fffdf8bd;border:1px solid var(--line)}.workspace-head-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.workspace-head p{margin:0;color:var(--muted)}.modes{display:flex;gap:8px;overflow-x:auto;padding:10px 0 14px}.modes button{white-space:nowrap;background:#fff;color:var(--ink);border:1px solid var(--line)}.modes button.active{background:var(--wine);color:#fff;border-color:var(--wine)}.panel{padding:clamp(18px,4vw,34px)}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:18px}.controls select{min-height:43px;border:1px solid var(--line);background:#fff;padding:9px 12px;font:inherit}.section-list,.sequence{display:grid;gap:12px}.section{border:1px solid var(--line);background:#fff}.section summary{list-style:none;cursor:pointer;padding:17px 18px}.section summary::-webkit-details-marker{display:none}.section .creed-text{font-size:clamp(1.04rem,2.3vw,1.22rem);line-height:1.52}.explanation{padding:14px 18px 18px;margin:0;color:var(--muted);border-top:1px solid #eee3d0}.variant{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;background:#f6eddd;border:1px solid var(--line);margin-bottom:16px}.variant strong{margin-right:auto}.prompt{background:#f6eddd;border-left:4px solid var(--gold);padding:20px;font:clamp(1.08rem,2.5vw,1.35rem)/1.58 Georgia,serif}.blank{display:inline-block;min-width:72px;border-bottom:2px solid var(--wine);color:var(--wine);font-weight:800;text-align:center}.answer-box{margin-top:14px}.answer-box label{display:block;font-weight:800;margin-bottom:7px}.answer-box input{width:100%;border:1px solid var(--line);padding:13px;font:1rem inherit}.feedback{display:none;margin-top:14px;padding:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:var(--good);border-left:4px solid var(--sage)}.feedback.bad{background:var(--bad);border-left:4px solid #9b4850}.correct-text{color:#6d2036;font-weight:800}.sequence-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px;background:#fff;border:1px solid var(--line)}.sequence-item .creed-text{line-height:1.4}.move{display:flex;gap:6px}.move button{padding:9px 12px}.quiz-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:15px}.quiz-options button{background:#fff;color:var(--ink);border:1px solid var(--line);text-align:left;line-height:1.35}.quiz-options button.correct{background:var(--good);border-color:var(--sage)}.quiz-options button.wrong{background:var(--bad);border-color:#9b4850}.recite-cue{min-height:180px;display:grid;place-items:center;text-align:center;background:#f6eddd;border:1px solid var(--line);padding:24px}.recite-cue .creed-text{font-size:clamp(1.35rem,4vw,2rem);line-height:1.5}.blind{background:#202633;color:#fff}.blind .label{color:#e9c56e}.note{color:var(--muted);font-size:.9rem}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.grid,.quiz-options{grid-template-columns:1fr}.workspace-head-top{display:block}.workspace-head .secondary{margin-top:12px}.panel{padding:18px 14px}.sequence-item{grid-template-columns:1fr}.move{justify-content:flex-end}}
</style></head><body><main class="shell"><header><div><p class="eyebrow">Areopagus Forum presents</p><h1>Creed Memory</h1></div><a class="back" href="games.html">← The Game Room</a></header><p class="intro">Learn the four ecumenical creeds in meaningful sections, then strengthen exact wording, order, understanding, and recitation. Progress stays privately on this device.</p><section id="landing"><div id="creed-grid" class="grid"></div></section><section id="workspace" class="workspace" aria-live="polite"><div class="workspace-head"><div class="workspace-head-top"><div><p class="label" id="period"></p><h2 id="creed-title"></h2><p id="creed-desc"></p></div><button class="secondary" id="all-creeds">← All creeds</button></div></div><nav id="modes" class="modes" aria-label="Study mode"></nav><section id="panel" class="panel"></section></section></main><script>
function S(title,text,explanation,easy,distractors){return{title,text,explanation,easy,distractors}}function Q(q,a,wrong,explanation){return{q,a,options:[a,...wrong],explanation}}
const CREEDS={
apostles:{title:"Apostles’ Creed",period:"Ancient baptismal symbol",desc:"A compact confession organized around the Father, the Son, and the Holy Spirit.",variantLabel:"Descent wording",variants:{dead:"descended to the dead",hell:"descended into hell"},sections:[
S("God the Father","I believe in God, the Father almighty, creator of heaven and earth.","Confesses one sovereign Father as the source and maker of all that exists.","creator",["redeemer","judge","preserver"]),
S("Jesus Christ","I believe in Jesus Christ, God’s only Son, our Lord.","Names Jesus as the unique Son and as Lord, the one to whom Christian allegiance belongs.","only Son",["first prophet","highest angel","chosen servant"]),
S("Conception and birth","Who was conceived by the Holy Spirit, born of the Virgin Mary.","Confesses both divine initiative and Christ’s real human birth.","Holy Spirit",["power of God","angel Gabriel","divine wisdom"]),
S("Passion and burial","Suffered under Pontius Pilate, was crucified, died, and was buried.","Places the saving death of Jesus in public history and affirms that his death was real.","Pontius Pilate",["Herod Antipas","Caesar Augustus","Tiberius Caesar"]),
S("Descent","He {{descent}}.","Confesses Christ’s passage through death and his victory over its dominion; Christian traditions explain the clause in different ways.","{{descent}}",["entered into glory","rested in the tomb","preached to Israel"]),
S("Resurrection","On the third day he rose again.","The resurrection is God’s vindication of Christ and the ground of Christian hope.","third day",["seventh day","first day","appointed day"]),
S("Ascension and session","He ascended into heaven and is seated at the right hand of the Father.","The risen Christ reigns with the Father and intercedes for his people.","right hand",["holy throne","highest place","heavenly court"]),
S("Return and judgment","He will come again to judge the living and the dead.","History moves toward Christ’s return and universal, righteous judgment.","living and the dead",["nations and rulers","faithful and faithless","angels and humanity"]),
S("The Holy Spirit","I believe in the Holy Spirit.","The Spirit is confessed within the creed’s Trinitarian structure, not as an impersonal force.","Holy Spirit",["holy wisdom","divine power","heavenly gift"]),
S("Church and communion","The holy catholic Church, the communion of saints.","“Catholic” means the universal Church; believers share one holy fellowship in Christ.","communion of saints",["assembly of believers","fellowship of churches","company of apostles"]),
S("Forgiveness","The forgiveness of sins.","The gospel grants real pardon and reconciliation with God.","forgiveness",["remembrance","overlooking","weighing"]),
S("Resurrection and life","The resurrection of the body, and the life everlasting. Amen.","Christian hope is bodily resurrection and unending life with God, not escape from creation.","body",["spirit","righteous","faithful"])],curated:[Q("Which wording is distinctive of the Apostles’ Creed?","resurrection of the body",["resurrection of the dead","life of the world to come","one baptism for forgiveness"],"The Apostles’ Creed says “resurrection of the body”; the Nicene Creed says “resurrection of the dead.”"),Q("What does “catholic” mean here?","universal",["Roman only","clerical","invisible only"],"Here “catholic” names the whole or universal Church."),Q("Why does the creed name Pontius Pilate?","to locate Christ’s passion in history",["to praise Roman government","to date Christ’s birth exactly","to excuse the Jerusalem leaders"],"The name anchors the crucifixion in public history under a known governor.")]},
nicene:{title:"Nicene Creed",period:"Niceno-Constantinopolitan · AD 381",desc:"The Church’s expanded Trinitarian confession, formed amid disputes about the Son and the Holy Spirit.",variantLabel:"Procession wording",variants:{original:"who proceeds from the Father",filioque:"who proceeds from the Father and the Son"},sections:[
S("One God and Father","We believe in one God, the Father almighty, maker of heaven and earth, of all things visible and invisible.","The creed begins with the one Creator, ruling out any division between a lesser maker and a higher God.","visible and invisible",["earthly and heavenly","temporal and eternal","bodily and spiritual"]),
S("One Lord Jesus Christ","And in one Lord Jesus Christ, the only Son of God, eternally begotten of the Father.","The Son’s origin is eternal generation, not an act of creation within time.","eternally begotten",["foreordained","first created","spiritually adopted"]),
S("God from God","God from God, Light from Light, true God from true God, begotten, not made, of one Being with the Father.","Nicaea’s language protects the Son’s full and equal deity against Arian claims that he is a creature.","one Being",["one purpose","like substance","highest rank"]),
S("Maker through the Son","Through him all things were made.","The Son belongs on the Creator side of the Creator–creature distinction.","all things",["heavenly things","living things","new things"]),
S("Incarnation","For us and for our salvation he came down from heaven, was incarnate from the Holy Spirit and the Virgin Mary, and became truly human.","The eternal Son assumed complete humanity for human salvation.","our salvation",["our example","Israel’s freedom","the world’s renewal"]),
S("Passion and resurrection","For our sake he was crucified under Pontius Pilate; he suffered death and was buried. On the third day he rose again in accordance with the Scriptures.","The saving events are historical and fulfill God’s scriptural promises.","in accordance with the Scriptures",["before all the nations","by the power of the Spirit","as the apostles testified"]),
S("Ascension and kingdom","He ascended into heaven and is seated at the right hand of the Father. He will come again in glory to judge the living and the dead, and his kingdom will have no end.","The risen Son reigns now and will return openly; his kingship is everlasting.","no end",["no rival","all nations","perfect peace"]),
S("The Holy Spirit","We believe in the Holy Spirit, the Lord, the giver of life, {{procession}}; who with the Father and the Son is worshiped and glorified; who has spoken through the prophets.","The Spirit is fully divine, gives life, receives worship with Father and Son, and inspired the prophets. The Filioque is a later Western addition to the 381 text.","giver of life",["bearer of truth","bond of love","power from heaven"]),
S("Church, baptism, resurrection","We believe in one holy catholic and apostolic Church. We acknowledge one baptism for the forgiveness of sins. We look for the resurrection of the dead, and the life of the world to come. Amen.","The creed joins the Church’s unity and apostolicity to one baptism, bodily resurrection, and the coming renewed world.","one baptism",["one ministry","one confession","one communion"])],curated:[Q("Which council supplied the received form commonly called the Nicene Creed?","Constantinople I in 381",["Nicaea I in 325 only","Ephesus in 431","Chalcedon in 451"],"Nicaea supplied the core anti-Arian confession in 325; Constantinople expanded the received form in 381."),Q("What error does “begotten, not made” oppose?","the Son is a creature",["the Son has a human body","the Father is invisible","the Spirit spoke by prophets"],"Arian teaching placed the Son among created things."),Q("What does homoousios mean?","of one Being with the Father",["of one purpose with creation","of similar rank to the Father","of one person with the Spirit"],"The Son shares the same divine being or essence as the Father."),Q("Which phrase is the later Western addition?","and the Son",["giver of life","spoken through the prophets","worshiped and glorified"],"The Latin West later added filioque, “and the Son.”"),Q("Which wording belongs to this creed?","resurrection of the dead",["resurrection of the body","communion of saints","descended to the dead"],"The Apostles’ and Nicene creeds use different characteristic wording for the same bodily hope.")]},
chalcedon:{title:"Chalcedonian Definition",period:"Council of Chalcedon · AD 451",desc:"A precise confession of the one person and two natures of Jesus Christ.",sections:[
S("Following the fathers","Following the holy fathers, we unanimously teach that we confess one and the same Son, our Lord Jesus Christ.","Chalcedon presents its definition as continuity with the Church’s inherited confession.","one and the same Son",["one divine nature","one saving will","one holy Church"]),
S("Perfect in deity and humanity","The same is perfect in deity and perfect in humanity, truly God and truly man, composed of a rational soul and a body.","Christ possesses everything proper to deity and everything proper to complete humanity.","rational soul",["created spirit","divine mind","heavenly body"]),
S("Consubstantial with us","He is consubstantial with the Father according to the deity and consubstantial with us according to the humanity, like us in all things except sin.","The Son shares the Father’s divine being and our human nature, while remaining sinless.","except sin",["except mortality","except weakness","except suffering"]),
S("Two births","Before the ages he was begotten from the Father according to the deity, and in these last days, for us and for our salvation, the same was born from the Virgin Mary, the God-bearer, according to the humanity.","The same person is eternally begotten as God and historically born of Mary as man.","God-bearer",["mother of humanity","holy virgin","bearer of grace"]),
S("Two natures","One and the same Christ, Son, Lord, only-begotten, is acknowledged in two natures.","The distinction of deity and humanity remains real within the unity of the one Christ.","two natures",["two persons","one nature only","three substances"]),
S("Four safeguards","The two natures are without confusion, without change, without division, without separation.","The first pair guards the natures from mixture or alteration; the second guards the one Christ from being split.","without confusion",["without distinction","without suffering","without limitation"]),
S("Properties preserved","The difference of the natures is by no means taken away because of the union, but rather the property of each nature is preserved.","Union does not erase what is properly divine or properly human.","preserved",["dissolved","exchanged","completed"]),
S("One person and hypostasis","The characteristics of both natures come together in one person and one hypostasis, not parted or divided into two persons, but one and the same Son and only-begotten God the Word, Lord Jesus Christ; as the prophets from the beginning have declared concerning him, and the Lord Jesus Christ himself has taught us, and the creed of the holy fathers has handed down to us.","All Christ’s divine and human acts belong to one personal subject: the eternal Son.","one hypostasis",["one operation","one natural will","one composite essence"])],curated:[Q("Which council issued this Definition?","Chalcedon in 451",["Ephesus in 431","Constantinople in 381","Nicaea in 325"],"Chalcedon met in 451 and received key earlier teaching, including Cyril’s letters and Leo’s Tome."),Q("Which pair guards against mixing the natures?","without confusion and without change",["without division and without separation","without body and without soul","without place and without time"],"Confusion and change deny the integrity of deity or humanity."),Q("Why mention a rational soul?","to confess complete humanity",["to deny bodily suffering","to replace Christ’s divine mind","to separate two persons"],"This answers teaching that replaced a complete human rational soul with the divine Logos."),Q("What does God-bearer protect?","the identity of Mary’s son as God the Word",["Mary’s origin before creation","Mary’s share in the divine essence","the absence of Christ’s humanity"],"The title identifies the person she bore as the divine Son incarnate.")]},
athanasian:{title:"Athanasian Creed",period:"Quicunque Vult · Latin West",desc:"A sustained confession of Trinitarian equality and the incarnation of the one Christ.",sections:[
S("The catholic faith","Whosoever will be saved, before all things it is necessary that he hold the catholic faith. Which faith except everyone do keep whole and undefiled, without doubt he shall perish everlastingly.","The opening underscores that the realities confessed concern the identity of the God who saves.","whole and undefiled",["simple and sincere","ancient and universal","firm and unchanging"]),
S("Trinity in unity","And the catholic faith is this: That we worship one God in Trinity, and Trinity in Unity, neither confounding the Persons, nor dividing the Substance.","Christian worship distinguishes Father, Son, and Spirit without dividing the one divine being.","confounding the Persons",["naming the Persons","ranking the Persons","separating the works"]),
S("Distinct persons, one Godhead","For there is one Person of the Father, another of the Son, and another of the Holy Ghost. But the Godhead of the Father, of the Son, and of the Holy Ghost, is all one, the glory equal, the majesty co-eternal.","Personal distinction does not imply unequal deity or three gods.","majesty co-eternal",["mission identical","authority delegated","appearance invisible"]),
S("Uncreated and eternal","Such as the Father is, such is the Son, and such is the Holy Ghost. The Father uncreate, the Son uncreate, and the Holy Ghost uncreate. The Father incomprehensible, the Son incomprehensible, and the Holy Ghost incomprehensible. The Father eternal, the Son eternal, and the Holy Ghost eternal. And yet they are not three eternals, but one eternal. As also there are not three incomprehensibles, nor three uncreated, but one uncreated, and one incomprehensible.","Each person wholly possesses the undivided divine nature.","one eternal",["one eternal Person","three eternals","one heavenly order"]),
S("God and Lord","So likewise the Father is Almighty, the Son Almighty, and the Holy Ghost Almighty. And yet they are not three Almighties, but one Almighty. So the Father is God, the Son is God, and the Holy Ghost is God. And yet they are not three Gods, but one God. So likewise the Father is Lord, the Son Lord, and the Holy Ghost Lord. And yet not three Lords, but one Lord.","The creed fully predicates deity of each person while maintaining monotheism.","one God",["one Person","one office","one appearance"]),
S("Personal relations","For like as we are compelled by the Christian verity to acknowledge every Person by himself to be both God and Lord, so are we forbidden by the catholic religion to say, There be three Gods, or three Lords. The Father is made of none, neither created, nor begotten. The Son is of the Father alone, not made, nor created, but begotten. The Holy Ghost is of the Father and of the Son, neither made, nor created, nor begotten, but proceeding.","The persons are distinguished by eternal relations of origin, not degrees of deity.","begotten",["created","adopted","appointed"]),
S("Coequal Trinity","So there is one Father, not three Fathers; one Son, not three Sons; one Holy Ghost, not three Holy Ghosts. And in this Trinity none is afore, or after other; none is greater, or less than another; but the whole three Persons are co-eternal together and co-equal. So that in all things, as is aforesaid, the Unity in Trinity and the Trinity in Unity is to be worshipped. He therefore that will be saved must thus think of the Trinity.","The missions of Son and Spirit in history do not make them lesser in divine being.","co-eternal together and co-equal",["cooperative and united","equal in authority","eternal in purpose"]),
S("God and man","Furthermore, it is necessary to everlasting salvation that he also believe rightly the Incarnation of our Lord Jesus Christ. For the right faith is, that we believe and confess, that our Lord Jesus Christ, the Son of God, is God and Man; God, of the Substance of the Father, begotten before the worlds; and Man of the Substance of his Mother, born in the world; perfect God and perfect Man, of a reasonable soul and human flesh subsisting.","The incarnation unites full deity and complete humanity in the one Lord Jesus Christ.","perfect God and perfect Man",["divine soul and human body","highest God and lesser man","one nature after union"]),
S("Equal and inferior","Equal to the Father, as touching his Godhead; and inferior to the Father, as touching his manhood.","Texts of equality and subordination can both be affirmed by attending to Christ’s two natures.","as touching his manhood",["before his resurrection","according to his Person","during his earthly ministry"]),
S("One Christ","Who although he be God and Man, yet he is not two, but one Christ; one, not by conversion of the Godhead into flesh, but by taking of the Manhood into God; one altogether, not by confusion of Substance, but by unity of Person. For as the reasonable soul and flesh is one man, so God and Man is one Christ.","The divine nature is not changed into humanity, and the natures are not blended.","unity of Person",["identity of nature","agreement of wills","mixture of Substance"]),
S("Saving work","Who suffered for our salvation, descended into hell, rose again the third day from the dead. He ascended into heaven, he sitteth on the right hand of the Father, God Almighty, from whence he shall come to judge the quick and the dead.","The one divine Son truly underwent these events in the humanity he assumed.","for our salvation",["as our example","to reveal his power","for Israel’s kingdom"]),
S("Return and judgment","At whose coming all men shall rise again with their bodies and shall give account for their own works. And they that have done good shall go into life everlasting; and they that have done evil into everlasting fire. This is the catholic faith, which except a man believe faithfully, he cannot be saved. Amen.","The creed closes with bodily resurrection, judgment, and everlasting life.","rise again with their bodies",["return as pure spirits","receive another trial","enter an earthly kingdom"])],curated:[Q("Did Athanasius write this creed?","probably not; it arose later in the Latin West",["yes, at Nicaea in 325","yes, during his final exile","no, it was written at Chalcedon"],"The traditional title honors its pro-Nicene theology, but the text is later and Western in origin."),Q("What does “not three Gods” protect?","the unity of the divine being",["the absence of personal distinctions","the temporary nature of the Son","the inferiority of the Spirit"],"Each person is fully God, yet the divine essence is one and indivisible."),Q("How does it distinguish Christ’s natures?","equal as God, inferior as man",["visible as God, invisible as man","created as God, eternal as man","one before birth, two after birth"],"Predications are clarified according to deity or humanity while the person remains one."),Q("What makes Christ one?","unity of Person",["conversion of deity","confusion of Substance","loss of humanity"],"The creed rejects changing deity into flesh and blending the natures.")]}}
const MODES=[['learn','Learn'],['fill','Fill in the blank'],['sequence','Sequence'],['quiz','Quiz'],['recite','Recitation']],KEY='areopagus-creed-memory-v1';let state=load(),active=null,mode='learn',level='easy',fillAt=0,order=[],started=0,quiz=[],quizAt=0,score=0,reciteStage='prompted',reciteAt=0,revealed=false;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function progress(id){return state[id]||(state[id]={learned:[],mastered:[],quizBest:0,sequenceBest:null,blind:0,variant:id==='apostles'?'dead':id==='nicene'?'original':null})}function creedText(s){let x=s.text,p=progress(active);if(active==='apostles')x=x.replace('{{descent}}',CREEDS[active].variants[p.variant]);if(active==='nicene')x=x.replace('{{procession}}',CREEDS[active].variants[p.variant]);return x}function norm(x){return x.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim()}function shuffle(x){let a=x.slice();for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pc(id){let p=progress(id),n=new Set([...p.learned,...p.mastered]).size;return Math.round(n/CREEDS[id].sections.length*100)}function time(ms){let s=Math.round(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function landing(){document.querySelector('#creed-grid').innerHTML=Object.entries(CREEDS).map(([id,c])=>{let p=progress(id),n=pc(id);return `<article class="card creed-card"><div class="card-top"><span class="label">${esc(c.period)}</span><strong>${n}%</strong></div><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><div class="meter"><span style="width:${n}%"></span></div><div class="stats">Quiz best ${p.quizBest}% · Blind recitations ${p.blind}${p.sequenceBest?` · Sequence ${time(p.sequenceBest)}`:''}</div><button data-open="${id}">Study this creed →</button></article>`}).join('')}
document.querySelector('#creed-grid').onclick=e=>{let b=e.target.closest('[data-open]');if(b)open(b.dataset.open)};document.querySelector('#all-creeds').onclick=()=>{document.querySelector('#workspace').classList.remove('show');document.querySelector('#landing').hidden=false;landing();scrollTo(0,0)};document.querySelector('#modes').onclick=e=>{let b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;reset();render()}};document.querySelector('#panel').addEventListener('change',e=>{if(e.target.id==='difficulty'){level=e.target.value;fillAt=0;render()}});
function open(id){active=id;mode='learn';reset();document.querySelector('#landing').hidden=true;document.querySelector('#workspace').classList.add('show');render();scrollTo(0,0)}function reset(){fillAt=0;order=[];started=0;quiz=buildQuiz();quizAt=0;score=0;reciteStage='prompted';reciteAt=0;revealed=false}function variants(){let c=CREEDS[active];return c.variants?`<div class="variant"><strong>${c.variantLabel}</strong>${Object.entries(c.variants).map(([id,x])=>`<button class="${progress(active).variant===id?'':'ghost'}" data-variant="${id}">${esc(x)}</button>`).join('')}</div>`:''}
function render(){let c=CREEDS[active];document.querySelector('#period').textContent=c.period;document.querySelector('#creed-title').textContent=c.title;document.querySelector('#creed-desc').textContent=c.desc;document.querySelector('#modes').innerHTML=MODES.map(([id,x])=>`<button class="${mode===id?'active':''}" data-mode="${id}">${x}</button>`).join('');let p=document.querySelector('#panel');p.innerHTML=variants()+(mode==='learn'?learn():mode==='fill'?fill():mode==='sequence'?sequence():mode==='quiz'?quizView():recite());p.onclick=act;let input=document.querySelector('#fill-answer');if(input){input.onkeydown=e=>{if(e.key==='Enter')checkFill()};input.focus()}}
function learn(){let c=CREEDS[active],p=progress(active);return `<div class="progress-row"><span>Tap a section to read why it matters</span><span>${p.learned.length}/${c.sections.length} opened</span></div><div class="section-list">${c.sections.map((s,i)=>`<details class="section" data-section="${i}"><summary><span class="label">${i+1}. ${esc(s.title)}</span><div class="creed-text">${esc(creedText(s))}</div></summary><p class="explanation">${esc(s.explanation)}</p></details>`).join('')}</div>`}
function missing(s){let full=creedText(s);if(level==='hard')return{display:'<span class="blank">entire section</span>',answer:full};let easy=s.easy.includes('{{')?CREEDS[active].variants[progress(active).variant]:s.easy,answer=level==='easy'?easy:medium(full,easy),at=full.toLowerCase().indexOf(answer.toLowerCase());return{answer,display:esc(full.slice(0,at))+`<span class="blank">${'•'.repeat(Math.min(12,Math.max(4,answer.length)))}</span>`+esc(full.slice(at+answer.length))}}function medium(full,easy){let words=full.split(/\s+/),at=words.findIndex(x=>norm(x)===norm(easy).split(' ')[0]);if(at<0)at=Math.floor(words.length/2);return words.slice(at,Math.min(words.length,at+Math.max(4,Math.min(8,Math.ceil(words.length/3))))).join(' ').replace(/[.,;:]$/,'')}
function fill(){let c=CREEDS[active],s=c.sections[fillAt],m=missing(s);return `<div class="progress-row"><span>Section ${fillAt+1} of ${c.sections.length}</span><span>${progress(active).mastered.length} mastered</span></div><div class="controls" style="margin:0 0 14px"><strong>Difficulty</strong><select id="difficulty"><option value="easy" ${level==='easy'?'selected':''}>Easy · key word</option><option value="medium" ${level==='medium'?'selected':''}>Medium · full phrase</option><option value="hard" ${level==='hard'?'selected':''}>Hard · entire section</option></select></div><div class="prompt"><span class="label">${esc(s.title)}</span>${m.display}</div><div class="answer-box"><label for="fill-answer">Type the missing text</label><input id="fill-answer" autocomplete="off"><div id="fill-feedback" class="feedback"></div></div><div class="controls"><button id="check-fill">Check answer</button><button class="secondary" id="next-fill">Next section</button></div>`}
function checkFill(){let i=document.querySelector('#fill-answer'),f=document.querySelector('#fill-feedback'),a=missing(CREEDS[active].sections[fillAt]).answer,ok=norm(i.value)===norm(a);f.className=`feedback show ${ok?'good':'bad'}`;if(ok){f.textContent='Correct. This section is now marked as practiced.';let p=progress(active);if(!p.mastered.includes(fillAt))p.mastered.push(fillAt);save();document.querySelector('#check-fill').textContent='Next section';document.querySelector('#check-fill').dataset.next='1';i.disabled=true;landing()}else{f.innerHTML=`Not quite. The correct text is <span class="correct-text">${esc(a)}</span>. Edit your answer and retry.`;i.select()}}
function sequence(){let c=CREEDS[active],p=progress(active);if(!order.length)return `<div class="prompt"><span class="label">Sequence challenge</span>Put all ${c.sections.length} sections into their correct order. The timer begins when you start; use the large arrow buttons to move each section.</div><p class="note">Personal best: ${p.sequenceBest?time(p.sequenceBest):'No completed attempt yet.'}</p><button id="start-sequence">Start timed attempt</button>`;return `<div class="progress-row"><span id="timer">Time ${time(Date.now()-started)}</span><span>Personal best ${p.sequenceBest?time(p.sequenceBest):'—'}</span></div><div class="sequence">${order.map((n,i)=>`<div class="sequence-item"><div><span class="label">Position ${i+1}</span><div class="creed-text">${esc(creedText(c.sections[n]))}</div></div><div class="move"><button class="ghost" data-up="${i}" aria-label="Move up">↑</button><button class="ghost" data-down="${i}" aria-label="Move down">↓</button></div></div>`).join('')}</div><div id="sequence-feedback" class="feedback"></div><div class="controls"><button id="check-sequence">Check order</button><button class="secondary" id="restart-sequence">Reshuffle</button></div>`}
function buildQuiz(){if(!active)return[];let c=CREEDS[active],a=[];c.sections.forEach((s,i)=>{let answer=s.easy.includes('{{')?CREEDS[active].variants[progress(active).variant]:s.easy;a.push(Q(`Which wording completes section ${i+1}, “${s.title}”?`,answer,s.distractors,s.explanation));if(i<c.sections.length-1)a.push(Q(`Which section comes immediately after “${s.title}”?`,c.sections[i+1].title,shuffle(c.sections.filter((_,j)=>j!==i+1).map(x=>x.title)).slice(0,3),`The creed moves from “${s.title}” to “${c.sections[i+1].title}.”`))});return shuffle([...a,...c.curated])}
function quizView(){let q=quiz[quizAt];if(!q){let n=Math.round(score/quiz.length*100),p=progress(active);p.quizBest=Math.max(p.quizBest,n);save();landing();return `<div class="prompt"><span class="label">Quiz complete</span>You scored <strong>${score} of ${quiz.length}</strong> (${n}%).</div><p class="note">Best score: ${p.quizBest}%.</p><button id="restart-quiz">Try another shuffled quiz</button>`}return `<div class="progress-row"><span>Question ${quizAt+1} of ${quiz.length}</span><span>Score ${score}</span></div><div class="prompt"><span class="label">Creed quiz</span>${esc(q.q)}</div><div class="quiz-options">${shuffle(q.options).map(x=>`<button data-quiz="${esc(x)}">${esc(x)}</button>`).join('')}</div><div id="quiz-feedback" class="feedback"></div><div class="controls"><button id="next-quiz" disabled>Next question</button></div>`}
function first(x,n){return x.split(/\s+/).slice(0,n).join(' ')}function recite(){let c=CREEDS[active],s=c.sections[reciteAt];if(reciteStage==='complete')return `<div class="prompt"><span class="label">Recitation complete</span>You finished the blind recitation and self-check. Record it only if you made an honest full attempt.</div><div class="controls"><button id="record-blind">Record successful blind recitation</button><button class="secondary" id="restart-recite">Practice again</button></div>`;let blind=reciteStage==='blind',blank=reciteStage==='blank',cue=blank?'Recite the entire creed from memory.':blind?first(creedText(s),3):(revealed?creedText(s):first(creedText(s),5)+' …');return `<div class="progress-row"><span>${blank?'Final challenge':`Section ${reciteAt+1} of ${c.sections.length}`}</span><span>${blank?'No visual cues':blind?'Blind cues':'Guided prompts'}</span></div><div class="recite-cue ${blank?'blind':''}"><div><span class="label">${blank?'Fully blank recitation':esc(s.title)}</span><div class="creed-text">${esc(cue)}</div></div></div>${blank&&revealed?`<div class="section-list" style="margin-top:14px">${c.sections.map((x,i)=>`<div class="section"><div style="padding:15px"><span class="label">${i+1}. ${esc(x.title)}</span><div class="creed-text">${esc(creedText(x))}</div></div></div>`).join('')}</div>`:''}<div class="controls"><button id="reveal-recite">${revealed?(blank?'Finish self-check':'Next section'):(blank?'Reveal full creed':'Reveal section')}</button>${blank?'':'<button class="secondary" id="next-recite">I recited it · next</button>'}</div><p class="note">Say the words aloud before revealing. This mode is self-checked and stores no audio.</p>`}
function act(e){let d=e.target.dataset;if(e.target.closest('details[data-section]')){let x=e.target.closest('details[data-section]');setTimeout(()=>{if(x.open){let p=progress(active),n=+x.dataset.section;if(!p.learned.includes(n))p.learned.push(n);save();landing()}},0)}if(d.variant){progress(active).variant=d.variant;save();reset();render();return}if(e.target.id==='check-fill'){if(d.next){fillAt=(fillAt+1)%CREEDS[active].sections.length;render()}else checkFill();return}if(e.target.id==='next-fill'){fillAt=(fillAt+1)%CREEDS[active].sections.length;render();return}if(e.target.id==='start-sequence'||e.target.id==='restart-sequence'){order=shuffle(CREEDS[active].sections.map((_,i)=>i));if(order.every((x,i)=>x===i))order.reverse();started=Date.now();render();tick();return}if(d.up!==undefined){let i=+d.up;if(i)[order[i-1],order[i]]=[order[i],order[i-1]];render();tick();return}if(d.down!==undefined){let i=+d.down;if(i<order.length-1)[order[i+1],order[i]]=[order[i],order[i+1]];render();tick();return}if(e.target.id==='check-sequence'){let ok=order.every((x,i)=>x===i),f=document.querySelector('#sequence-feedback');f.className=`feedback show ${ok?'good':'bad'}`;if(ok){let elapsed=Date.now()-started,p=progress(active);p.sequenceBest=p.sequenceBest===null?elapsed:Math.min(p.sequenceBest,elapsed);p.learned=CREEDS[active].sections.map((_,i)=>i);save();landing();f.textContent=`Correct in ${time(elapsed)}. Personal best: ${time(p.sequenceBest)}.`}else f.textContent='Not yet. At least one section is out of order.';return}if(d.quiz!==undefined){let q=quiz[quizAt],ok=d.quiz===q.a;document.querySelectorAll('[data-quiz]').forEach(b=>{b.disabled=true;if(b.dataset.quiz===q.a)b.classList.add('correct')});if(ok)score++;else e.target.classList.add('wrong');let f=document.querySelector('#quiz-feedback');f.className=`feedback show ${ok?'good':'bad'}`;f.innerHTML=`<strong>${ok?'Correct.':'The correct answer is '+esc(q.a)+'.'}</strong> ${esc(q.explanation)}`;document.querySelector('#next-quiz').disabled=false;return}if(e.target.id==='next-quiz'){quizAt++;render();return}if(e.target.id==='restart-quiz'){quiz=buildQuiz();quizAt=score=0;render();return}if(e.target.id==='reveal-recite'){if(revealed)advance();else{revealed=true;render()}return}if(e.target.id==='next-recite'){advance();return}if(e.target.id==='restart-recite'){reciteStage='prompted';reciteAt=0;revealed=false;render();return}if(e.target.id==='record-blind'){progress(active).blind++;save();landing();reciteStage='prompted';reciteAt=0;render()}}
function tick(){clearInterval(tick.id);tick.id=setInterval(()=>{let x=document.querySelector('#timer');if(x)x.textContent=`Time ${time(Date.now()-started)}`;else clearInterval(tick.id)},1000)}function advance(){revealed=false;reciteAt++;if(reciteAt<CREEDS[active].sections.length){render();return}if(reciteStage==='prompted'){reciteStage='blind';reciteAt=0}else if(reciteStage==='blind'){reciteStage='blank';reciteAt=0}else reciteStage='complete';render()}landing();
</script></body></html>
